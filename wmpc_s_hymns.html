<style>
  .hymns-viewer {
    display: grid;
    gap: 14px;
  }

  .hymns-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 12px;
  }

  .hymns-field {
    display: grid;
    gap: 6px;
    flex: 1 1 260px;
    min-width: 0;
  }

  .hymns-label {
    color: var(--ds-label-color, #5C6B7A);
    font-size: 13px;
    font-weight: 700;
  }

  .hymns-select {
    width: 100%;
    min-height: 44px;
    border: 1px solid rgba(0, 0, 0, 0.22);
    border-radius: 8px;
    background: #fff;
    color: var(--ds-text, #212121);
    font: inherit;
    padding: 8px 12px;
  }

  .hymns-open-link,
  .hymns-retry-button {
    min-height: 44px;
    border-radius: 8px;
    border: 1px solid rgba(0, 0, 0, 0.22);
    background: #fff;
    color: var(--ds-text, #212121);
    font: inherit;
    font-weight: 700;
    line-height: 1.2;
    padding: 10px 14px;
    text-decoration: none;
  }

  .hymns-retry-button {
    cursor: pointer;
  }

  .hymns-status {
    min-height: 22px;
    color: var(--ds-text-secondary, #656565);
    font-size: 14px;
  }

  .hymns-frame-wrap {
    position: relative;
    min-height: 72vh;
    overflow: hidden;
    border: 1px solid rgba(0, 0, 0, 0.18);
    border-radius: 8px;
    background: #f7f5f0;
  }

  .hymns-frame-wrap.is-loading::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, #ece7df 25%, #f9f7f2 45%, #ece7df 65%);
    background-size: 220% 100%;
    animation: hymns-shimmer 1.5s ease-in-out infinite;
    z-index: 1;
  }

  .hymns-frame-wrap.is-loading::after {
    content: "Loading hymnal PDF...";
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    transform: translate(-50%, -50%);
    color: var(--ds-text-secondary, #656565);
    font-size: 15px;
    font-weight: 700;
  }

  .hymns-frame {
    display: block;
    width: 100%;
    height: 72vh;
    min-height: 560px;
    border: 0;
    background: #fff;
  }

  .hymns-error {
    padding: 18px;
    border: 1px solid rgba(204, 0, 0, 0.28);
    border-radius: 8px;
    background: rgba(204, 0, 0, 0.06);
    color: var(--ds-text, #212121);
  }

  .hymns-hidden {
    display: none !important;
  }

  @keyframes hymns-shimmer {
    0% { background-position: 180% 0; }
    100% { background-position: -80% 0; }
  }

  @media (max-width: 640px) {
    .hymns-frame-wrap,
    .hymns-frame {
      min-height: 68vh;
      height: 68vh;
    }

    .hymns-open-link,
    .hymns-retry-button {
      width: 100%;
      text-align: center;
    }
  }
</style>

<div class="hymns-viewer" data-manifest-url="documents/hymns/index.json">
  <div class="hymns-toolbar">
    <label class="hymns-field" for="hymnPdfSelect">
      <span class="hymns-label">Hymn PDF</span>
      <select class="hymns-select" id="hymnPdfSelect" disabled>
        <option>Loading hymns...</option>
      </select>
    </label>
    <a class="hymns-open-link hymns-hidden" id="hymnPdfFallback" href="#" target="_blank" rel="noopener">Open PDF</a>
    <button class="hymns-retry-button hymns-hidden" id="hymnPdfRetry" type="button">Retry</button>
  </div>
  <p class="hymns-status" id="hymnPdfStatus" role="status" aria-live="polite">Loading hymns...</p>
  <div class="hymns-frame-wrap is-loading" id="hymnPdfFrameWrap">
    <iframe class="hymns-frame" id="hymnPdfViewer" title="Hymn PDF viewer"></iframe>
  </div>
</div>

<script>
(function() {
  var root = document.querySelector('.hymns-viewer');
  if (!root) return;

  var manifestUrl = root.getAttribute('data-manifest-url');
  var select = document.getElementById('hymnPdfSelect');
  var viewer = document.getElementById('hymnPdfViewer');
  var fallback = document.getElementById('hymnPdfFallback');
  var retry = document.getElementById('hymnPdfRetry');
  var status = document.getElementById('hymnPdfStatus');
  var frameWrap = document.getElementById('hymnPdfFrameWrap');
  var hymns = [];
  var loadTimer = null;

  function setLoading(isLoading) {
    frameWrap.classList.toggle('is-loading', isLoading);
  }

  function setStatus(message) {
    status.textContent = message;
  }

  function finishShowing() {
    var hymn = hymns[Number(select.value)];
    if (!hymn) return;
    if (loadTimer) {
      window.clearTimeout(loadTimer);
      loadTimer = null;
    }
    setLoading(false);
    setStatus('Showing ' + hymn.title + '.');
  }

  function isSafeHymnFile(file) {
    return typeof file === 'string' &&
      /^documents\/hymns\/[^?#]+\.pdf$/i.test(file) &&
      file.indexOf('..') === -1 &&
      !/^[a-z][a-z0-9+.-]*:/i.test(file);
  }

  function normalizeHymns(items) {
    if (!Array.isArray(items)) return [];

    return items.filter(function(item) {
      return item &&
        typeof item.title === 'string' &&
        item.title.trim() &&
        isSafeHymnFile(item.file);
    }).map(function(item) {
      return {
        title: item.title.trim(),
        file: item.file
      };
    });
  }

  function delay(ms) {
    return new Promise(function(resolve) {
      window.setTimeout(resolve, ms);
    });
  }

  function fetchManifestWithBackoff(attempt) {
    return fetch(manifestUrl, { cache: 'no-store' }).then(function(response) {
      if (!response.ok) throw new Error('Manifest request failed: ' + response.status);
      return response.json();
    }).catch(function(error) {
      if (attempt >= 2) throw error;
      return delay(300 * Math.pow(3, attempt)).then(function() {
        return fetchManifestWithBackoff(attempt + 1);
      });
    });
  }

  function populateSelect() {
    var options = document.createDocumentFragment();

    hymns.forEach(function(hymn, index) {
      var option = document.createElement('option');
      option.value = String(index);
      option.textContent = hymn.title;
      options.appendChild(option);
    });

    select.textContent = '';
    select.appendChild(options);
    select.disabled = hymns.length === 0;
  }

  function hymnUrl(hymn) {
    var url = new URL(hymn.file, window.location.href);
    url.searchParams.set('embed', '1');
    return encodeURI(url.href);
  }

  function showHymn(index) {
    var hymn = hymns[index];
    if (!hymn) return;

    var encodedFile = hymnUrl(hymn);
    if (loadTimer) window.clearTimeout(loadTimer);
    setLoading(true);
    setStatus('Loading ' + hymn.title + '...');
    fallback.href = encodedFile;
    fallback.classList.remove('hymns-hidden');
    viewer.src = encodedFile;
    loadTimer = window.setTimeout(finishShowing, 2500);
  }

  function showError() {
    select.textContent = '';
    var option = document.createElement('option');
    option.textContent = 'Hymns unavailable';
    select.appendChild(option);
    select.disabled = true;
    retry.classList.remove('hymns-hidden');
    fallback.classList.add('hymns-hidden');
    setLoading(false);
    frameWrap.classList.add('hymns-error');
    setStatus('Unable to load the hymn list. Please try again.');
  }

  function loadHymns() {
    setLoading(true);
    setStatus('Loading hymns...');
    retry.classList.add('hymns-hidden');
    frameWrap.classList.remove('hymns-error');

    fetchManifestWithBackoff(0).then(function(manifest) {
      hymns = normalizeHymns(manifest.hymns);
      if (!hymns.length) throw new Error('Manifest has no safe hymn entries.');
      populateSelect();
      showHymn(0);
    }).catch(showError);
  }

  select.addEventListener('change', function() {
    showHymn(Number(select.value));
  });

  viewer.addEventListener('load', function() {
    finishShowing();
  });

  retry.addEventListener('click', loadHymns);

  loadHymns();
})();
</script>
