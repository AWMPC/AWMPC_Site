<style>
  .hymns-viewer {
    display: grid;
    gap: 14px;
  }

  .hymns-toolbar,
  .hymns-controls {
    display: flex;
    flex-wrap: wrap;
    align-items: end;
    gap: 12px;
  }

  .hymns-field {
    display: grid;
    gap: 6px;
    flex: 1 1 260px;
    min-width: 0;
  }

  .hymns-label {
    color: var(--ds-label-color, #5C6B7A);
    font-size: 13px;
    font-weight: 700;
  }

  .hymns-select {
    width: 100%;
    min-height: 44px;
    border: 1px solid rgba(0, 0, 0, 0.22);
    border-radius: 8px;
    background: #fff;
    color: var(--ds-text, #212121);
    font: inherit;
    padding: 8px 12px;
  }

  .hymns-button,
  .hymns-open-link,
  .hymns-retry-button {
    min-height: 44px;
    border-radius: 8px;
    border: 1px solid rgba(0, 0, 0, 0.22);
    background: #fff;
    color: var(--ds-text, #212121);
    cursor: pointer;
    font: inherit;
    font-weight: 700;
    line-height: 1.2;
    padding: 10px 14px;
    text-decoration: none;
  }

  .hymns-button:disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }

  .hymns-page-status,
  .hymns-status {
    min-height: 22px;
    color: var(--ds-text-secondary, #656565);
    font-size: 14px;
  }

  .hymns-page-status {
    align-self: center;
    font-weight: 700;
  }

  .hymns-stage {
    position: relative;
    display: grid;
    place-items: center;
    min-height: 72vh;
    overflow: auto;
    border: 1px solid rgba(0, 0, 0, 0.18);
    border-radius: 8px;
    background: #111;
  }

  .hymns-stage:fullscreen {
    border: 0;
    border-radius: 0;
    background: #000;
  }

  .hymns-viewer:fullscreen {
    grid-template-rows: auto auto auto minmax(0, 1fr);
    width: 100vw;
    height: 100vh;
    padding: 12px;
    background: #000;
  }

  .hymns-viewer:fullscreen .hymns-label,
  .hymns-viewer:fullscreen .hymns-page-status,
  .hymns-viewer:fullscreen .hymns-status {
    color: #fff;
  }

  .hymns-viewer:fullscreen .hymns-stage {
    min-height: 0;
    height: 100%;
    border: 0;
    border-radius: 0;
  }

  .hymns-stage.is-loading::before {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(110deg, #222 25%, #333 45%, #222 65%);
    background-size: 220% 100%;
    animation: hymns-shimmer 1.5s ease-in-out infinite;
    z-index: 1;
  }

  .hymns-stage.is-loading::after {
    content: "Loading hymnal PDF...";
    position: absolute;
    left: 50%;
    top: 50%;
    z-index: 2;
    transform: translate(-50%, -50%);
    color: #fff;
    font-size: 15px;
    font-weight: 700;
  }

  .hymns-canvas {
    display: block;
    max-width: 100%;
    height: auto;
    background: #000;
  }

  .hymns-error {
    padding: 18px;
    border: 1px solid rgba(204, 0, 0, 0.28);
    border-radius: 8px;
    background: rgba(204, 0, 0, 0.06);
    color: var(--ds-text, #212121);
  }

  .hymns-hidden {
    display: none !important;
  }

  @keyframes hymns-shimmer {
    0% { background-position: 180% 0; }
    100% { background-position: -80% 0; }
  }

  @media (max-width: 640px) {
    .hymns-stage {
      min-height: 68vh;
    }

    .hymns-button,
    .hymns-open-link,
    .hymns-retry-button {
      flex: 1 1 auto;
      text-align: center;
    }
  }
</style>

<div class="hymns-viewer" data-manifest-url="documents/hymns/index.json">
  <div class="hymns-toolbar">
    <label class="hymns-field" for="hymnPdfSelect">
      <span class="hymns-label">Hymn PDF</span>
      <select class="hymns-select" id="hymnPdfSelect" disabled>
        <option>Loading hymns...</option>
      </select>
    </label>
    <a class="hymns-open-link hymns-hidden" id="hymnPdfFallback" href="#" target="_blank" rel="noopener">Open PDF</a>
    <button class="hymns-retry-button hymns-hidden" id="hymnPdfRetry" type="button">Retry</button>
  </div>
  <div class="hymns-controls" aria-label="Hymn PDF controls">
    <button class="hymns-button" id="hymnPdfPrev" type="button" disabled>Previous</button>
    <span class="hymns-page-status" id="hymnPdfPageStatus">Page - / -</span>
    <button class="hymns-button" id="hymnPdfNext" type="button" disabled>Next</button>
    <button class="hymns-button" id="hymnPdfFullscreen" type="button" disabled>Present</button>
  </div>
  <p class="hymns-status" id="hymnPdfStatus" role="status" aria-live="polite">Loading hymns...</p>
  <div class="hymns-stage is-loading" id="hymnPdfStage">
    <canvas class="hymns-canvas" id="hymnPdfCanvas"></canvas>
  </div>
</div>

<script src="resources/vendor/pdfjs/pdf.min.js"></script>
<script>
(function() {
  var root = document.querySelector('.hymns-viewer');
  if (!root) return;

  var manifestUrl = root.getAttribute('data-manifest-url');
  var select = document.getElementById('hymnPdfSelect');
  var fallback = document.getElementById('hymnPdfFallback');
  var retry = document.getElementById('hymnPdfRetry');
  var status = document.getElementById('hymnPdfStatus');
  var pageStatus = document.getElementById('hymnPdfPageStatus');
  var previousButton = document.getElementById('hymnPdfPrev');
  var nextButton = document.getElementById('hymnPdfNext');
  var fullscreenButton = document.getElementById('hymnPdfFullscreen');
  var stage = document.getElementById('hymnPdfStage');
  var canvas = document.getElementById('hymnPdfCanvas');
  var canvasContext = canvas.getContext('2d');
  var hymns = [];
  var pdfDoc = null;
  var renderTask = null;
  var pageNumber = 1;
  var renderQueued = false;
  var resizeTimer = null;

  function cleanupLegacyServiceWorker() {
    if (!('serviceWorker' in navigator)) return Promise.resolve();

    return navigator.serviceWorker.getRegistrations().then(function(registrations) {
      return Promise.all(registrations.map(function(registration) {
        return registration.unregister();
      }));
    }).then(function() {
      if (!window.caches) return Promise.resolve();
      return caches.keys().then(function(keys) {
        return Promise.all(keys.filter(function(key) {
          return key.indexOf('bible-') === 0;
        }).map(function(key) {
          return caches.delete(key);
        }));
      });
    }).catch(function() {
      return undefined;
    });
  }

  function setLoading(isLoading) {
    stage.classList.toggle('is-loading', isLoading);
  }

  function setStatus(message) {
    status.textContent = message;
  }

  function setControlsEnabled(enabled) {
    previousButton.disabled = !enabled || pageNumber <= 1;
    nextButton.disabled = !enabled || !pdfDoc || pageNumber >= pdfDoc.numPages;
    fullscreenButton.disabled = !enabled;
  }

  function updatePageStatus() {
    pageStatus.textContent = pdfDoc ? 'Page ' + pageNumber + ' / ' + pdfDoc.numPages : 'Page - / -';
  }

  function clearCanvas() {
    canvasContext.clearRect(0, 0, canvas.width, canvas.height);
    canvas.width = 0;
    canvas.height = 0;
    canvas.style.width = '';
    canvas.style.height = '';
  }

  function isSafeHymnFile(file) {
    return typeof file === 'string' &&
      /^documents\/hymns\/[^?#]+\.pdf$/i.test(file) &&
      file.indexOf('..') === -1 &&
      !/^[a-z][a-z0-9+.-]*:/i.test(file);
  }

  function normalizeHymns(items) {
    if (!Array.isArray(items)) return [];

    return items.filter(function(item) {
      return item &&
        typeof item.title === 'string' &&
        item.title.trim() &&
        isSafeHymnFile(item.file);
    }).map(function(item) {
      return {
        title: item.title.trim(),
        file: item.file
      };
    });
  }

  function delay(ms) {
    return new Promise(function(resolve) {
      window.setTimeout(resolve, ms);
    });
  }

  function fetchManifestWithBackoff(attempt) {
    return fetch(manifestUrl, { cache: 'no-store' }).then(function(response) {
      if (!response.ok) throw new Error('Manifest request failed: ' + response.status);
      return response.json();
    }).catch(function(error) {
      if (attempt >= 2) throw error;
      return delay(300 * Math.pow(3, attempt)).then(function() {
        return fetchManifestWithBackoff(attempt + 1);
      });
    });
  }

  function populateSelect() {
    var options = document.createDocumentFragment();

    hymns.forEach(function(hymn, index) {
      var option = document.createElement('option');
      option.value = String(index);
      option.textContent = hymn.title;
      options.appendChild(option);
    });

    select.textContent = '';
    select.appendChild(options);
    select.disabled = hymns.length === 0;
  }

  function hymnUrl(hymn) {
    var url = new URL(hymn.file, window.location.href);
    url.searchParams.set('embed', '1');
    return encodeURI(url.href);
  }

  function renderPage() {
    if (!pdfDoc) return Promise.resolve();

    if (renderTask) {
      renderQueued = true;
      renderTask.cancel();
      return Promise.resolve();
    }

    renderQueued = false;
    setLoading(true);
    setControlsEnabled(false);
    updatePageStatus();

    return pdfDoc.getPage(pageNumber).then(function(page) {
      var baseViewport = page.getViewport({ scale: 1 });
      var maxCssWidth = Math.max(stage.clientWidth - 24, 320);
      var fullscreenElement = document.fullscreenElement || document.webkitFullscreenElement;
      var maxCssHeight = fullscreenElement === root ? Math.max(stage.clientHeight - 24, 320) : Infinity;
      var fitScale = Math.min(maxCssWidth / baseViewport.width, maxCssHeight / baseViewport.height);
      var pixelRatio = Math.min(window.devicePixelRatio || 1, 3);
      var renderViewport = page.getViewport({ scale: fitScale * pixelRatio });
      var displayViewport = page.getViewport({ scale: fitScale });

      canvas.width = Math.floor(renderViewport.width);
      canvas.height = Math.floor(renderViewport.height);
      canvas.style.width = Math.floor(displayViewport.width) + 'px';
      canvas.style.height = Math.floor(displayViewport.height) + 'px';

      renderTask = page.render({
        canvasContext: canvasContext,
        viewport: renderViewport
      });

      return renderTask.promise.then(function() {
        renderTask = null;
        setLoading(false);
        updatePageStatus();
        setControlsEnabled(true);
        setStatus('Showing ' + hymns[Number(select.value)].title + '.');
      }).catch(function(error) {
        renderTask = null;
        if (error && error.name === 'RenderingCancelledException' && renderQueued) {
          return renderPage();
        }
        throw error;
      });
    }).catch(function() {
      setLoading(false);
      setControlsEnabled(Boolean(pdfDoc));
      setStatus('Unable to render this page. Open the PDF directly if the problem continues.');
    });
  }

  function destroyCurrentPdf() {
    if (renderTask) {
      renderTask.cancel();
      renderTask = null;
    }
    if (pdfDoc) {
      pdfDoc.destroy();
      pdfDoc = null;
    }
    clearCanvas();
    pageNumber = 1;
    updatePageStatus();
    setControlsEnabled(false);
  }

  function showHymn(index) {
    var hymn = hymns[index];
    if (!hymn) return;

    var encodedFile = hymnUrl(hymn);
    destroyCurrentPdf();
    setLoading(true);
    setStatus('Loading ' + hymn.title + '...');
    fallback.href = encodedFile;
    fallback.classList.remove('hymns-hidden');

    window.pdfjsLib.getDocument({ url: encodedFile }).promise.then(function(loadedPdf) {
      pdfDoc = loadedPdf;
      pageNumber = 1;
      return renderPage();
    }).catch(function() {
      showError('Unable to load this PDF. Open it directly or try another hymn.');
    });
  }

  function showError(message) {
    select.disabled = hymns.length === 0;
    retry.classList.remove('hymns-hidden');
    setLoading(false);
    setControlsEnabled(false);
    stage.classList.add('hymns-error');
    setStatus(message || 'Unable to load the hymn list. Please try again.');
  }

  function loadHymns() {
    if (!window.pdfjsLib) {
      showError('Unable to load the PDF viewer library. Open the PDF directly or try again.');
      return;
    }

    window.pdfjsLib.GlobalWorkerOptions.workerSrc =
      'resources/vendor/pdfjs/pdf.worker.min.js';

    setLoading(true);
    setStatus('Loading hymns...');
    retry.classList.add('hymns-hidden');
    stage.classList.remove('hymns-error');

    fetchManifestWithBackoff(0).then(function(manifest) {
      hymns = normalizeHymns(manifest.hymns);
      if (!hymns.length) throw new Error('Manifest has no safe hymn entries.');
      populateSelect();
      showHymn(0);
    }).catch(function() {
      showError('Unable to load the hymn list. Please try again.');
    });
  }

  select.addEventListener('change', function() {
    showHymn(Number(select.value));
  });

  previousButton.addEventListener('click', function() {
    if (!pdfDoc || pageNumber <= 1) return;
    pageNumber -= 1;
    renderPage();
  });

  nextButton.addEventListener('click', function() {
    if (!pdfDoc || pageNumber >= pdfDoc.numPages) return;
    pageNumber += 1;
    renderPage();
  });

  fullscreenButton.addEventListener('click', function() {
    if (document.fullscreenElement) {
      document.exitFullscreen();
      return;
    }
    if (document.webkitFullscreenElement && document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
      return;
    }
    if (root.requestFullscreen) {
      root.requestFullscreen();
    } else if (root.webkitRequestFullscreen) {
      root.webkitRequestFullscreen();
    }
  });

  document.addEventListener('fullscreenchange', function() {
    fullscreenButton.textContent = document.fullscreenElement === root ? 'Exit' : 'Present';
    renderPage();
  });

  document.addEventListener('webkitfullscreenchange', function() {
    fullscreenButton.textContent = document.webkitFullscreenElement === root ? 'Exit' : 'Present';
    renderPage();
  });

  window.addEventListener('resize', function() {
    if (!pdfDoc) return;
    window.clearTimeout(resizeTimer);
    resizeTimer = window.setTimeout(renderPage, 150);
  });

  cleanupLegacyServiceWorker().then(loadHymns);
})();
</script>
