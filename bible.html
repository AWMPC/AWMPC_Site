<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AWMPC Bible">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="resources/images/bible-icon-192.png">
<title>AWMPC Bible</title>
<style>
  :root {
    --reader-font-size: 20px;
    --reader-line-height: 1.8;
    --display-control-font-size: 20px;
    --display-control-height: 48px;
    --display-icon-button-size: 48px;
    --display-control-pad-y: 8px;
    --display-control-pad-x: 12px;
    --display-segment-height: 48px;
    --display-panel-padding: 12px;
    --display-panel-gap: 8px;
    --display-nav-padding: 6px;
    --oneui-font: 'One UI Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    --bg: #f4f7fb; --bg2: #ffffff; --bg3: #f8fbff; --bg4: #eef3f9;
    --surface: #ffffff;
    --surface-hi: #eef3f9;
    --fg: #172033; --fg2: #40506a; --fg3: #617089; --fg4: #7d899c;
    --verse-num: #0b63ce;
    --border: rgba(34,49,75,.14); --border2: rgba(34,49,75,.18); --border3: rgba(34,49,75,.28);
    --accent: #0b63ce; --accent-fg: #fff;
    --accent-glow: rgba(11,99,206,.22);
    --note-bg: rgba(11,99,206,.08); --note-border: #0b63ce;
    --err-bg: rgba(196,56,50,.12); --err-fg: #9f211d;
    --fab-bg: #ffffff; --fab-fg: #0b63ce;
    --float-nav-bg: rgba(255,255,255,.64);
    --float-nav-fg: #172033;
    --float-nav-shadow: 0 8px 22px rgba(26,40,63,.12);
    --oneui-radius: 20px;
    --oneui-inset-radius: calc(var(--oneui-radius) - max(4px, calc(var(--display-panel-padding) / 3)));
    --radius-xs: max(12px, var(--oneui-inset-radius));
    --radius-sm: var(--oneui-radius);
    --radius-md: var(--oneui-radius);
    --radius-pill: 100px;
    --shadow: 0 2px 12px rgba(26,40,63,.12);
    --card-bg: linear-gradient(175deg, rgba(255,255,255,.92) 0%, rgba(246,249,253,.88) 100%);
    --card-border: 1px solid var(--border);
    --hdr-blur: blur(14px);
    --menu-bg: var(--surface-hi);
    --menu-shadow: 0 12px 32px rgba(26,40,63,.18);
    --hover-bg: rgba(11,99,206,.08);
    --pill-bg: rgba(11,99,206,.08);
    --btn-active-text: #ffffff;
    --bottom-chrome-clearance: calc(var(--display-control-height) + (var(--display-nav-padding) * 2) + 20px);
  }
  html.dark {
    --bg: #0d1017; --bg2: #171c28; --bg3: #111722; --bg4: #1e2538;
    --surface: #171c28;
    --surface-hi: #1e2538;
    --fg: #edf0f7; --fg2: #c7cfdd; --fg3: #aeb7c7; --fg4: #929bad;
    --verse-num: #8bb9ff;
    --border: rgba(255,255,255,.08); --border2: rgba(255,255,255,.12); --border3: rgba(255,255,255,.22);
    --accent: #5b9bf4; --accent-fg: #0d1017;
    --accent-glow: rgba(91,155,244,.35);
    --note-bg: rgba(91,155,244,.12); --note-border: #5b9bf4;
    --err-bg: rgba(244,96,90,.16); --err-fg: #ff9c98;
    --fab-bg: #1e2538; --fab-fg: #8bb9ff;
    --float-nav-bg: rgba(13,16,23,.52);
    --float-nav-fg: #edf0f7;
    --float-nav-shadow: 0 8px 22px rgba(0,0,0,.32);
    --shadow: 0 2px 12px rgba(0,0,0,.35);
    --card-bg: linear-gradient(175deg, rgba(23,28,40,.8) 0%, rgba(30,37,56,.75) 100%);
    --card-border: 1px solid var(--border);
    --hdr-blur: blur(12px);
    --menu-bg: var(--surface-hi);
    --menu-shadow: 0 8px 32px rgba(0,0,0,.5);
    --hover-bg: rgba(255,255,255,.05);
    --pill-bg: rgba(255,255,255,.05);
    --btn-active-text: #0d1017;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  body {
    font-family: var(--oneui-font);
    background: var(--bg); color: var(--fg); line-height: 1.6;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }
  button,
  .dd-item,
  .book-btn,
  .chapter-btn {
    -webkit-tap-highlight-color: transparent;
    transition:
      background 180ms ease,
      border-color 180ms ease,
      box-shadow 180ms ease,
      color 180ms ease,
      transform 120ms ease;
  }
  button:hover,
  button:focus-visible,
  .dd-item:hover,
  .dd-item:focus-visible,
  .book-btn:hover,
  .book-btn:focus-visible,
  .chapter-btn:hover,
  .chapter-btn:focus-visible {
    transition-duration: 220ms;
  }
  button:active,
  .dd-item:active,
  .book-btn:active,
  .chapter-btn:active {
    transform: scale(.975);
    transition-duration: 80ms;
  }
  button:disabled {
    transform: none;
  }

  /* Bottom chrome: chapter bar + FAB (single row, shared safe-area) */
  .bottom-chrome {
    position: fixed;
    left: 12px;
    right: 12px;
    bottom: calc(8px + env(safe-area-inset-bottom, 0px));
    z-index: 125;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: stretch;
    gap: var(--display-panel-gap);
    padding: var(--display-nav-padding);
    min-height: calc(var(--display-control-height) + (var(--display-nav-padding) * 2));
    overflow: visible;
    pointer-events: none;
    background: var(--float-nav-bg);
    color: var(--float-nav-fg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    transform: translateY(0);
    opacity: 1;
    transition: transform 220ms ease, opacity 220ms ease;
  }
  .bottom-chrome.scroll-hidden {
    transform: translateY(calc(100% + 18px + env(safe-area-inset-bottom, 0px)));
    opacity: 0;
  }
  .bottom-chrome > * { pointer-events: auto; }

  /* Floating chapter nav */
  .floating-nav {
    display: flex; align-items: center; justify-content: flex-start; gap: 6px;
    position: relative;
    left: auto;
    transform: none;
    flex: 1 1 0;
    width: auto;
    max-width: none;
    min-width: 0;
    min-height: var(--display-control-height);
    margin-right: 0;
    z-index: 120;
    background: transparent; color: inherit;
    border: 0;
    border-radius: var(--radius-sm); padding: 0;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .floating-nav.hidden { display: none; }
  .floating-nav button {
    background: var(--surface); border: 1px solid var(--border);
    color: inherit; font-size: var(--display-control-font-size); font-family: inherit; border-radius: var(--radius-xs);
    padding: var(--display-control-pad-y) var(--display-control-pad-x); cursor: pointer; min-height: var(--display-control-height);
    box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; line-height: 1.15;
  }
  .floating-nav button:hover,
  .floating-nav button:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--hover-bg);
    outline: none;
  }
  .floating-nav button:disabled {
    opacity: 0.35; cursor: not-allowed;
  }
  .floating-nav .fn-book {
    font-weight: 600; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .floating-nav .fn-chapter,
  .floating-nav .fn-verse {
    font-weight: 600; min-width: 44px;
  }
  .bottom-actions {
    display: flex; align-items: center; justify-content: center; gap: var(--display-panel-gap);
    position: relative;
    flex: 0 0 auto;
    min-height: var(--display-control-height);
    z-index: 121;
    background: transparent; color: inherit;
    border: 0; border-radius: var(--radius-sm); padding: 0;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .bottom-action-button {
    min-height: var(--display-control-height); border-radius: var(--radius-xs); border: 1px solid var(--border);
    background: var(--surface); color: inherit; font: inherit; font-size: var(--display-control-font-size);
    padding: var(--display-control-pad-y) var(--display-control-pad-x); cursor: pointer; box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; line-height: 1.15;
  }
  .bottom-action-button:hover,
  .bottom-action-button:focus-visible {
    color: var(--accent); border-color: var(--accent); background: var(--hover-bg); outline: none;
  }
  .bottom-history-menu {
    position: fixed;
    right: 0;
    bottom: calc(var(--bottom-chrome-clearance) - 8px);
    width: min(280px, calc(100vw - 24px));
    max-height: min(360px, calc(100dvh - 120px));
    display: grid;
    gap: var(--display-panel-gap);
    overflow-y: auto;
    padding: var(--display-panel-padding);
    background: var(--float-nav-bg);
    border: var(--card-border);
    border-radius: var(--radius-sm);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    isolation: isolate;
    z-index: 132;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(6px) scale(.98);
    transition: opacity 180ms ease, transform 180ms ease, visibility 0s linear 180ms;
  }
  .bottom-history-menu.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
    transition: opacity 180ms ease, transform 180ms ease, visibility 0s;
  }
  .bottom-history-menu .dd-item {
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: color-mix(in srgb, var(--surface) 72%, transparent);
    box-shadow: var(--shadow);
    backdrop-filter: inherit;
    -webkit-backdrop-filter: inherit;
  }

  @media (max-width: 640px) {
    .bottom-chrome {
      display: grid;
      grid-template-columns: minmax(0, 1fr) var(--display-icon-button-size);
      grid-template-rows: auto auto;
      gap: var(--display-panel-gap);
      align-items: center;
    }
    .floating-nav { grid-column: 1 / -1; grid-row: 1; width: 100%; }
    .floating-nav .fn-book { flex: 1 1 auto; max-width: none; }
    .bottom-actions { grid-column: 1; grid-row: 2; justify-content: flex-start; }
    .bottom-actions .bottom-action-button { flex: 1 1 0; }
    .fab-root { grid-column: 2; grid-row: 2; align-self: center; }
    .fab-main { width: var(--display-icon-button-size); height: var(--display-control-height); min-height: var(--display-control-height); }
  }

  /* FAB */
  .fab-root {
    position: relative;
    right: auto;
    bottom: auto;
    flex-shrink: 0;
    margin-left: auto;
    z-index: 130;
    overflow: visible;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 0;
    min-height: var(--display-control-height);
  }
  .fab-main {
    width: var(--display-icon-button-size); height: var(--display-control-height); border-radius: var(--radius-xs);
    background: var(--fab-bg); color: var(--fab-fg);
    border: 1px solid var(--border);
    font-size: 22px; cursor: pointer;
    position: relative;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow);
    padding: 0;
    overflow: hidden;
  }
  .fab-main:hover,
  .fab-main:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--hover-bg);
    outline: none;
  }
  .fab-panel {
    display: flex;
    position: fixed;
    right: 12px;
    bottom: var(--bottom-chrome-clearance);
    z-index: 131;
    width: min(360px, calc(100vw - 24px));
    max-height: calc(100dvh - var(--bottom-chrome-clearance) - 12px);
    overflow: hidden;
    flex-direction: column;
    gap: var(--display-panel-gap);
    padding: var(--display-panel-padding);
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(6px);
    background: var(--float-nav-bg); border: var(--card-border); border-radius: var(--radius-md);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    isolation: isolate;
    transition: opacity 180ms ease, transform 180ms ease, visibility 0s linear 180ms;
  }
  .fab-panel.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0);
    transition: opacity 180ms ease, transform 180ms ease, visibility 0s;
  }
  .fab-card {
    margin: 0;
    padding: var(--display-panel-padding);
    border-radius: var(--radius-sm);
    background: var(--card-bg);
    border: var(--card-border);
    box-shadow: 0 1px 8px rgba(26,40,63,.08);
  }
  .profile-card {
    --profile-photo-height: 92px;
    position: relative;
    overflow: hidden;
    min-height: 92px;
    padding: 0 12px 0 0;
  }
  .fab-card-title {
    font-size: 12px; font-weight: 700; color: var(--fg3); text-transform: uppercase;
    letter-spacing: 0.5px; padding: 0 2px 8px;
  }
  .fab-card .dd-item {
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: var(--surface);
    box-shadow: var(--shadow);
  }
  .fab-history-menu { flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; gap: 6px; }
  .fab-section-label {
    font-size: 12px; font-weight: 600; color: var(--fg3); text-transform: uppercase;
    letter-spacing: 0.5px; padding: 8px 16px 4px;
  }

  /* Dropdown menus (shared) */
  .dd-wrap { position: relative; flex-shrink: 0; }
  .dd-menu {
    display: none; position: absolute; top: 100%; margin-top: 6px;
    background: var(--menu-bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
    box-shadow: var(--menu-shadow); min-width: 220px; max-height: 380px;
    overflow-y: auto; z-index: 110;
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
  }
  .dd-menu.open { display: block; }
  .dd-menu.right { right: 0; }
  .dd-menu.left { left: 0; }
  .dd-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--border);
    padding: var(--display-control-pad-y) var(--display-control-pad-x); text-align: left; font-size: var(--display-control-font-size); font-family: inherit;
    color: var(--fg); cursor: pointer;
  }
  .dd-item:last-child { border-bottom: none; }
  .dd-item:hover { background: var(--bg4); }
  .dd-item .dd-icon { flex-shrink: 0; width: 24px; text-align: center; }
  .dd-item .dd-label { flex: 1; }
  .dd-item .dd-value { color: var(--fg3); font-size: 14px; flex-shrink: 0; }
  .dd-empty { padding: 16px; color: var(--fg3); font-size: 15px; text-align: center; }
  .theme-mode-wrap { display: grid; gap: var(--display-panel-gap); }
  .theme-mode-label { font-size: 17px; color: var(--fg); }
  .theme-mode-control {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: max(4px, calc(var(--display-panel-gap) / 2));
    padding: max(4px, calc(var(--display-panel-padding) / 3)); border: 1px solid var(--border2); border-radius: var(--radius-sm); background: var(--pill-bg);
    transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
  }
  .theme-mode-button {
    min-height: var(--display-segment-height); border: 0; border-radius: var(--radius-xs); background: transparent;
    color: var(--fg2); font: inherit; font-size: var(--display-control-font-size); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; line-height: 1.15; padding: 0 var(--display-control-pad-x);
    transition: background 180ms ease, color 180ms ease, box-shadow 180ms ease, transform 120ms ease;
  }
  .theme-mode-button:hover,
  .theme-mode-button:focus-visible {
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
    outline: none;
  }
  .theme-mode-button.active {
    background: var(--accent); color: var(--btn-active-text); box-shadow: 0 1px 6px var(--accent-glow);
    transform: none;
  }
  .theme-mode-button.active:hover,
  .theme-mode-button.active:focus-visible {
    background: var(--accent);
    color: var(--btn-active-text);
  }
  .theme-mode-button:active {
    transform: scale(.97);
  }
  .theme-mode-button.active:active {
    transform: scale(.985);
  }
  .display-size-wrap { display: grid; gap: var(--display-panel-gap); }
  .app-version {
    flex: 0 0 auto;
    padding: 12px 16px 0;
    color: var(--fg4);
    font-size: 12px;
    text-align: center;
  }

  /* Shell view area */
  #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
  .view-inner {
    max-width: 960px; margin: 0 auto;
    padding: 16px 12px;
    padding-bottom: calc(16px + var(--bottom-chrome-clearance));
    opacity: 1;
    transition: opacity 364ms ease-in-out;
  }
  .view-inner.chapter-transition-ready { opacity: 0; transition: none; }
  .view-inner.chapter-transition-ready.chapter-transition-in { opacity: 1; transition: opacity 364ms ease-in-out; }
  .view-inner.chapter-transition-retiring {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 2;
    opacity: 1;
    pointer-events: none;
  }
  .view-inner.chapter-transition-retiring.chapter-transition-out { opacity: 0; }

  /* Books view */
  .testaments { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .testament h2 {
    font-size: var(--display-control-font-size); font-weight: 600; color: var(--fg2);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid var(--border2);
  }
  .testament { min-width: 0; }
  .testament ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .book-btn {
    display: block; width: 100%;
    background: var(--card-bg); border: var(--card-border); border-radius: var(--radius-sm);
    padding: 10px 12px; font-family: inherit;
    color: var(--fg); cursor: pointer; text-align: left;
    transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, color 180ms ease, transform 120ms ease;
    box-shadow: var(--shadow);
  }
  .book-btn:hover { border-color: var(--accent); box-shadow: 0 1px 6px var(--accent-glow); background: var(--hover-bg); }
  .book-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .book-name-en { font-size: var(--display-control-font-size); line-height: 1.3; }
  .book-name-ko { font-size: max(13px, calc(var(--display-control-font-size) - 3px)); color: var(--fg3); line-height: 1.3; }
  .book-btn.active .book-name-ko { color: #bbb; }

  /* Chapters view */
  .chapters-header { font-size: calc(var(--display-control-font-size) + 2px); margin-bottom: 14px; color: var(--fg); }
  .chapter-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px;
  }
  .chapter-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--card-bg); border: var(--card-border); border-radius: var(--radius-sm);
    min-height: var(--display-control-height); padding: var(--display-control-pad-y) var(--display-control-pad-x); font-size: var(--display-control-font-size); font-family: inherit; color: var(--fg);
    cursor: pointer; transition: background 180ms ease, border-color 180ms ease, box-shadow 180ms ease, color 180ms ease, transform 120ms ease;
    box-shadow: var(--shadow);
  }
  .chapter-btn:hover { background: var(--hover-bg); border-color: var(--accent); }
  .chapter-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .verse-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px;
  }

  /* Verses view */
  .verse {
    margin-bottom: 12px; font-size: var(--reader-font-size); line-height: var(--reader-line-height); position: relative;
    border-radius: var(--radius-sm); padding: 8px 10px; border: 2px solid transparent;
    transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease, padding 0.2s ease, border-width 0.2s ease;
  }
  .verse.footnotes-open {
    border-width: 3px;
    padding: 10px 12px;
    background: color-mix(in srgb, var(--pill-bg) 72%, transparent);
  }
  .verse.active {
    background: var(--pill-bg);
    border-color: color-mix(in srgb, var(--accent) 55%, transparent);
    box-shadow: 0 8px 28px var(--accent-glow);
  }
  .verse.highlight {
    background: rgba(197, 160, 50, 0.18);
    border-color: rgba(197, 160, 50, 0.6);
    box-shadow: 0 0 18px rgba(197, 160, 50, 0.35), inset 0 0 8px rgba(197, 160, 50, 0.1);
  }
  .verse.highlight-fade {
    transition: background 1.5s ease-out, border-color 1.5s ease-out, box-shadow 1.5s ease-out;
    background: transparent; border-color: transparent; box-shadow: none;
  }
  html.dark .verse.highlight {
    background: rgba(224, 192, 48, 0.15);
    border-color: rgba(224, 192, 48, 0.5);

  // ===================== FOOTNOTES =====================
  // Bracket label is manuscript / editor scope: digits, ranges (6-8), etc. — not only the current verse number.
  var footnoteRe = /\{\[([^\]]+)\]\s*(.*?)\}/g;
  var footnoteStripRe = /\{\[[^\]]+\]\s*.*?\}/g;
  function parseVerse(raw) {
    var segments = [];
    var last = 0;
    var m;
    footnoteRe.lastIndex = 0;
    while ((m = footnoteRe.exec(raw)) !== null) {
      if (m.index > last) {
        segments.push({ type: 'text', value: raw.slice(last, m.index).replace(/  +/g, ' ') });
      }
      segments.push({ type: 'note', ref: m[1], text: m[2] });
      last = footnoteRe.lastIndex;
    }
    if (last < raw.length) {
      segments.push({ type: 'text', value: raw.slice(last).replace(/  +/g, ' ') });
    }
    return segments;
  }

    var idx = chList.indexOf(String(ch));
    if (idx > 0) {
      return { book: book, chapter: parseInt(chList[idx - 1], 10) };
    }
    if (bi <= 0) return null;
    var prevBook = books[bi - 1];
    var prevCh = sortedChapterKeys(prevBook);
    return { book: prevBook, chapter: parseInt(prevCh[prevCh.length - 1], 10) };
  }

  function nextChapterNav(book, ch) {
    var books = Object.keys(bibleData);
    var bi = books.indexOf(book);
    if (bi === -1) return null;
    var chList = sortedChapterKeys(book);
    var idx = chList.indexOf(String(ch));
    if (idx >= 0 && idx < chList.length - 1) {
      return { book: book, chapter: parseInt(chList[idx + 1], 10) };
    }
    if (bi >= books.length - 1) return null;
    var nextBook = books[bi + 1];

  function readingViewportMetrics() {
    var viewRect = viewEl.getBoundingClientRect();

    var dt = Math.min(2.4, Math.max(0.6, (ts - verseChaseLastTs) / 16.67));

  function directionalDistance(currentRect, rect, key) {
    var currentX = currentRect.left + (currentRect.width / 2);
    var currentY = currentRect.top + (currentRect.height / 2);
    var x = rect.left + (rect.width / 2);
    var y = rect.top + (rect.height / 2);
    var dx = x - currentX;
    var dy = y - currentY;
    var primary;
    var cross;
    if (key === 'ArrowLeft') {
      if (dx >= -1) return Infinity;
      primary = Math.abs(dx);
      cross = Math.abs(dy);
    } else if (key === 'ArrowRight') {
      if (dx <= 1) return Infinity;
      primary = Math.abs(dx);
      cross = Math.abs(dy);
    } else if (key === 'ArrowUp') {
      if (dy >= -1) return Infinity;
      primary = Math.abs(dy);
      cross = Math.abs(dx);
    } else if (key === 'ArrowDown') {
      if (dy <= 1) return Infinity;
      primary = Math.abs(dy);
      cross = Math.abs(dx);
    } else {
      return Infinity;
    }
    return (primary * primary) + (cross * cross * 2);
  }

  function focusClosestGridItem(items, current, key) {
    if (!items.length) return false;
    if (!current || items.indexOf(current) === -1) {
      items[0].focus();
      return true;
    }
    var currentRect = current.getBoundingClientRect();
    var best = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i] === current || items[i].disabled) continue;
      var rect = items[i].getBoundingClientRect();
      if (!rect.width || !rect.height) continue;
      var candidate = { el: items[i], score: Infinity };
      candidate.score = directionalDistance(currentRect, rect, key);
      if (candidate.score < Infinity && (!best || candidate.score < best.score)) {
        best = candidate;
      }
    }
    if (!best) return false;
    best.el.focus();
    return true;
  }

    var items = getSelectionGridItems();

  function handleReadingEnterKey() {
    var active = viewInner.querySelector('.verse.active');
    if (!active) return false;
    var noteButtons = active.querySelectorAll('.footnote-toggle');
    var noteBodies = active.querySelectorAll('.footnote-body');
    if (!noteButtons.length || !noteBodies.length) return false;
    var shouldOpen = false;
    for (var i = 0; i < noteBodies.length; i++) {
      if (noteBodies[i].className.indexOf('visible') === -1) {
        shouldOpen = true;
        break;
      }
    }
    for (i = 0; i < noteBodies.length; i++) {
      noteBodies[i].className = shouldOpen ? 'footnote-body visible' : 'footnote-body';
    }
    for (i = 0; i < noteButtons.length; i++) {
      noteButtons[i].className = shouldOpen ? 'footnote-toggle open' : 'footnote-toggle';
    }
    active.classList.toggle('footnotes-open', shouldOpen);
    return true;
  }

  function syncFootnoteVerseState(verseEl) {
    if (!verseEl) return;

  function handleKeyboardBack() {
    if (fabPanel.classList.contains('open') || openMenu) {
      closeMenus();
      return true;
    }
    if (uiView === 'verses') { showVersePickerViewWithTransition(navBook, navChapter); return true; }
    if (uiView === 'verse-picker') { showChaptersViewWithTransition(navBook); return true; }
    if (uiView === 'chapters') { showBooksViewWithTransition(); return true; }
    if (uiView === 'search') { showBooksViewWithTransition(); return true; }
    return false;

  function showAdjacentChapter(direction) {
    if (!bibleData || navBook == null || navChapter == null) return false;
    var next = direction < 0 ? prevChapterNav(navBook, navChapter) : nextChapterNav(navBook, navChapter);
    if (!next) return false;
    showVersesViewWithTransition(next.book, next.chapter);
    return true;
  }

  function showAdjacentVerse(direction) {
    if (uiView !== 'verses') return false;
    var verses = Array.prototype.slice.call(viewInner.querySelectorAll('.verse'));
    if (!verses.length) return false;
    var current = viewInner.querySelector('.verse.active');
    var idx = current ? verses.indexOf(current) : -1;
    if (idx === -1) idx = direction < 0 ? verses.length : -1;
    var next = verses[idx + direction];
    if (!next) return false;
    var verse = next.getAttribute('data-v');
    setActiveVerse(verse, false);
    var target = viewInner.querySelector('[data-v="' + verse + '"]');
    scrollVerseToCenter(target);
    return true;
  }

  function handleReadingArrowKey(key) {
    if (key === 'ArrowLeft') return showAdjacentChapter(-1);
    if (key === 'ArrowRight') return showAdjacentChapter(1);
    if (key === 'ArrowUp') return showAdjacentVerse(-1);
    if (key === 'ArrowDown') return showAdjacentVerse(1);
    return false;
  }

  function handleBibleKeyboardNavigation(e) {
    if (shouldIgnoreBibleShortcut(e)) return;
    var key = e.key;
    var handled = false;
    if (key === 'Enter') handled = uiView === 'verses' ? handleReadingEnterKey() : handleSelectionEnterKey();
    if (key === 'Escape' || key === 'Backspace' || key === 'Delete') handled = handleKeyboardBack();
    if (!handled && (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown')) {
      handled = uiView === 'verses' ? handleReadingArrowKey(key) : handleSelectionArrowKey(key);
    }
    if (handled) e.preventDefault();
  }

  // ===================== VIEW: SEARCH =====================
  function normalizeSearchText(raw) {
    var t = String(raw).replace(footnoteStripRe, '').replace(/  +/g, ' ');
    t = t.toLowerCase();
    try {
      return t.replace(/[^\p{L}\p{N}]+/gu, '');
    } catch (e) {
      return t.replace(/[^a-z0-9]+/gi, '');
    }
  }

  /** Map first normalized match of qn in raw (footnote-stripped) to [start,end) indices in that same string. */
  function findNormMatchInRaw(raw, qn) {
    var stripped = String(raw).replace(footnoteStripRe, '').replace(/  +/g, ' ');
    var normFull = normalizeSearchText(stripped);
    var pos = normFull.indexOf(qn);
    if (pos === -1) return null;
    var lower = stripped.toLowerCase();
    var built = 0;
    var rawStart = -1;
    var i = 0;
    while (i < lower.length) {
      var cp = lower.codePointAt(i);
      var w = cp > 0xffff ? 2 : 1;
      var ch = String.fromCodePoint(cp);
      var isWord = false;
      try {
        isWord = /^[\p{L}\p{N}]$/u.test(ch);
      } catch (e) {
        isWord = /[a-z0-9]/i.test(ch);
      }
      if (isWord) {
        if (built === pos) rawStart = i;
        built++;
        if (built === pos + qn.length) {
          return { start: rawStart, end: i + w };
        }
      }
      i += w;
    }
    return null;
  }

  function buildSearchIndex() {
    if (searchIndex) return;
    searchIndex = [];
    var books = Object.keys(bibleData);
    for (var b = 0; b < books.length; b++) {
      var chs = bibleData[books[b]];
      var chKeys = Object.keys(chs);
      for (var c = 0; c < chKeys.length; c++) {
        var vs = chs[chKeys[c]];
        var vKeys = Object.keys(vs);
        for (var v = 0; v < vKeys.length; v++) {
          var txt = vs[vKeys[v]];
          searchIndex.push({
            book: books[b], ch: chKeys[c], v: vKeys[v],
            text: txt,
            lower: txt.toLowerCase(),
            norm: normalizeSearchText(txt)
          });
        }
      }
    }
  }

    viewInner.appendChild(resultsEl);

    var histEl = document.createElement('div');
    viewInner.appendChild(histEl);
    renderSearchHistory(histEl, input, countEl, resultsEl);

    var debounce = null;
    var lastCommitted = '';
    input.addEventListener('input', function () {
      clearTimeout(debounce);
      var q = input.value.trim();
      if (q.length < 2) {
        countEl.textContent = '';
        resultsEl.textContent = '';
        histEl.style.display = '';
        renderSearchHistory(histEl, input, countEl, resultsEl);
        return;
      }
      histEl.style.display = 'none';
      debounce = setTimeout(function () { runSearch(q, countEl, resultsEl); }, 250);
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var q = input.value.trim();
        if (q.length >= 2 && q !== lastCommitted) {
          lastCommitted = q;
          State.pushSearchHistory(q);
        }
      }
    });

    input.addEventListener('blur', function () {
      var q = input.value.trim();
      if (q.length >= 2 && q !== lastCommitted) {
        lastCommitted = q;
        State.pushSearchHistory(q);
      }
    });

    setTimeout(function () { input.focus(); }, 100);
  }

  function runSearch(query, countEl, resultsEl) {
    resultsEl.textContent = '';
    var q = query.trim();
    if (q.length < 2) { countEl.textContent = ''; return; }
    var qn = normalizeSearchText(q);
    if (qn.length < 2) { countEl.textContent = ''; return; }

    var results = [];
    var max = 200;
    for (var i = 0; i < searchIndex.length && results.length < max; i++) {
      if (searchIndex[i].norm.indexOf(qn) !== -1) results.push(searchIndex[i]);
    }

    countEl.textContent = results.length >= max ? max + '+ results' : results.length + ' result' + (results.length !== 1 ? 's' : '');

    var qLow = q.toLowerCase();
    for (var r = 0; r < results.length; r++) {
      var item = results[r];
      var div = document.createElement('div');
      div.className = 'search-result';

      var ref = document.createElement('span');
      ref.className = 'search-ref';
      ref.textContent = item.book + ' ' + item.ch + ':' + item.v;
      div.appendChild(ref);

      var text = document.createElement('div');
      text.className = 'search-text';
      var raw = item.text.replace(footnoteStripRe, '').replace(/  +/g, ' ');
      var range = findNormMatchInRaw(raw, qn);
      var idx = range ? range.start : 0;
      var markLen = range ? (range.end - range.start) : Math.min(20, raw.length);
      if (!range && raw.length) {
        var rawLower = raw.toLowerCase();
        var words = qLow.split(/\s+/).filter(Boolean);
        if (words.length) {
          var wi = rawLower.indexOf(words[0]);
          if (wi >= 0) {
            idx = wi;
            markLen = words[0].length;
          }
        }
      }
      var start = Math.max(0, idx - 40);
      var end = Math.min(raw.length, idx + markLen + 40);
      var snippet = (start > 0 ? '\u2026' : '') + raw.slice(start, end) + (end < raw.length ? '\u2026' : '');
      var rel = idx - start + (start > 0 ? 1 : 0);
      var before = snippet.slice(0, rel);
      var match = snippet.slice(rel, rel + markLen);
      var after = snippet.slice(rel + markLen);
      text.appendChild(document.createTextNode(before));
      var mark = document.createElement('mark');
      mark.textContent = match;
      text.appendChild(mark);
      text.appendChild(document.createTextNode(after));
      div.appendChild(text);

      div.addEventListener('click', (function (book, ch, verse) {
        return function () { showVersesView(book, parseInt(ch, 10), verse); };
      })(item.book, item.ch, item.v));
      resultsEl.appendChild(div);
    }
  }

    navFromPop = false;
  };

  xhr.onerror = function () {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Network error loading bible.json.';
  };

  xhr.send();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
