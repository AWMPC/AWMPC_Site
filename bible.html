<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AWMPC Bible">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="resources/images/bible-icon-192.png">
<title>AWMPC Bible</title>
<style>
  :root {
    --bg: #f5f5f5; --bg2: #fff; --bg3: #fafaf8; --bg4: #f0f0f0;
    --fg: #222; --fg2: #555; --fg3: #707070; --fg4: #6b6b6b;
    --verse-num: #8a8a8a;
    --border: #e0e0e0; --border2: #ddd; --border3: #ccc;
    --accent: #1a1a2e; --accent-fg: #fff;
    --note-bg: #f0efe8; --note-border: #c5b358;
    --err-bg: #ffeaea; --err-fg: #a00;
    --fab-bg: #1a1a2e; --fab-fg: #e0e0e0;
    --float-nav-bg: rgba(26, 26, 46, 0.94);
    --float-nav-fg: #fff;
  }
  html.dark {
    --bg: #121212; --bg2: #1e1e1e; --bg3: #1a1a1a; --bg4: #2a2a2a;
    --fg: #e0e0e0; --fg2: #aaa; --fg3: #959595; --fg4: #929292;
    --verse-num: #777;
    --border: #333; --border2: #444; --border3: #555;
    --accent: #3a3a5e; --accent-fg: #fff;
    --note-bg: #2a2820; --note-border: #8a7a30;
    --err-bg: #3a1010; --err-fg: #f88;
    --fab-bg: #0a0a18; --fab-fg: #ccc;
    --float-nav-bg: rgba(10, 10, 24, 0.94);
    --float-nav-fg: #e8e8e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    display: flex; flex-direction: column;
  }

  /* Floating chapter nav */
  .floating-nav {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(68px + env(safe-area-inset-bottom, 0px));
    z-index: 120;
    background: var(--float-nav-bg); color: var(--float-nav-fg);
    border-radius: 12px; padding: 6px 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.22);
    max-width: calc(100vw - 24px);
  }
  .floating-nav.hidden { display: none; }
  .floating-nav button {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
    color: inherit; font-size: 15px; font-family: inherit; border-radius: 8px;
    padding: 8px 10px; cursor: pointer; min-height: 40px;
  }
  .floating-nav button:disabled {
    opacity: 0.35; cursor: not-allowed;
  }
  .floating-nav .fn-book {
    font-weight: 600; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .floating-nav .fn-chapter {
    font-weight: 600; min-width: 36px;
  }

  /* FAB */
  .fab-root {
    position: fixed; right: calc(12px + env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    z-index: 130;
    display: flex; flex-direction: column; align-items: flex-end; gap: 8px;
  }
  .fab-main {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--fab-bg); color: var(--fab-fg);
    border: 2px solid rgba(255,255,255,0.25);
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .fab-main:hover { filter: brightness(1.08); }
  .fab-panel {
    display: none; width: min(320px, calc(100vw - 24px));
    max-height: min(70vh, 480px); overflow-y: auto;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.2);
  }
  .fab-panel.open { display: block; }
  .fab-history-menu { max-height: 200px; overflow-y: auto; }
  .fab-section-label {
    font-size: 12px; font-weight: 600; color: var(--fg3); text-transform: uppercase;
    letter-spacing: 0.5px; padding: 8px 16px 4px;
  }

  /* Dropdown menus (shared) */
  .dd-wrap { position: relative; flex-shrink: 0; }
  .dd-menu {
    display: none; position: absolute; top: 100%; margin-top: 6px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); min-width: 220px; max-height: 380px;
    overflow-y: auto; z-index: 110;
  }
  .dd-menu.open { display: block; }
  .dd-menu.right { right: 0; }
  .dd-menu.left { left: 0; }
  .dd-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--border);
    padding: 12px 16px; text-align: left; font-size: 17px; font-family: inherit;
    color: var(--fg); cursor: pointer; transition: background 0.1s;
  }
  .dd-item:last-child { border-bottom: none; }
  .dd-item:hover { background: var(--bg4); }
  .dd-item .dd-icon { flex-shrink: 0; width: 24px; text-align: center; }
  .dd-item .dd-label { flex: 1; }
  .dd-item .dd-value { color: var(--fg3); font-size: 14px; flex-shrink: 0; }
  .dd-empty { padding: 16px; color: var(--fg3); font-size: 15px; text-align: center; }

  /* Shell view area */
  #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view-inner {
    max-width: 960px; margin: 0 auto;
    padding: 16px 12px;
    padding-bottom: calc(100px + env(safe-area-inset-bottom, 0px));
  }

  /* Books view */
  .testaments { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .testament h2 {
    font-size: 18px; font-weight: 600; color: var(--fg2);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid var(--border2);
  }
  .testament { min-width: 0; }
  .testament ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .book-btn {
    display: block; width: 100%;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: inherit;
    color: var(--fg); cursor: pointer; text-align: left;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .book-btn:hover { border-color: var(--border3); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .book-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .book-name-en { font-size: 18px; line-height: 1.3; }
  .book-name-ko { font-size: 15px; color: var(--fg3); line-height: 1.3; }
  .book-btn.active .book-name-ko { color: #bbb; }

  /* Chapters view */
  .chapters-header { font-size: 22px; margin-bottom: 14px; color: var(--fg); }
  .chapter-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px;
  }
  .chapter-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 8px;
    padding: 14px 0; font-size: 19px; font-family: inherit; color: var(--fg);
    cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .chapter-btn:hover { background: var(--border2); border-color: var(--border3); }
  .chapter-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  /* Verses view */
  .verse {
    margin-bottom: 12px; font-size: 20px; line-height: 1.8; position: relative;
    border-radius: 8px; padding: 4px 6px; border: 2px solid transparent;
    transition: none;
  }
  .verse.highlight {
    background: rgba(197, 160, 50, 0.18);
    border-color: rgba(197, 160, 50, 0.6);
    box-shadow: 0 0 18px rgba(197, 160, 50, 0.35), inset 0 0 8px rgba(197, 160, 50, 0.1);
  }
  .verse.highlight-fade {
    transition: background 1.5s ease-out, border-color 1.5s ease-out, box-shadow 1.5s ease-out;
    background: transparent; border-color: transparent; box-shadow: none;
  }
  html.dark .verse.highlight {
    background: rgba(224, 192, 48, 0.15);
    border-color: rgba(224, 192, 48, 0.5);
    box-shadow: 0 0 22px rgba(224, 192, 48, 0.3), inset 0 0 8px rgba(224, 192, 48, 0.08);
  }
  .verse-num { font-size: 14px; font-weight: 700; color: var(--verse-num); vertical-align: super; margin-right: 4px; }
  .footnote-toggle {
    display: inline-block; background: none; border: 1px solid var(--border3);
    border-radius: 4px; color: var(--fg3); font-size: 13px; font-family: inherit;
    padding: 1px 7px; margin-left: 4px; cursor: pointer; vertical-align: middle;
    transition: background 0.12s, color 0.12s;
  }
  .footnote-toggle:hover { background: var(--bg4); color: var(--fg2); }
  .footnote-toggle.open { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .footnote-body {
    display: none; margin: 6px 0 4px 20px; padding: 8px 12px;
    background: var(--note-bg); border-left: 3px solid var(--note-border);
    border-radius: 0 6px 6px 0; font-size: 17px; color: var(--fg2); line-height: 1.6;
  }
  .footnote-body.visible { display: block; }

  /* Search view */
  .search-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .search-input {
    flex: 1; font-size: 18px; font-family: inherit; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg2); color: var(--fg); outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--fg4); }
  .search-count { font-size: 15px; color: var(--fg3); margin-bottom: 12px; }
  .search-hist-label {
    font-size: 14px; font-weight: 600; color: var(--fg3); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .search-hist-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 5px; cursor: pointer; transition: background 0.1s;
  }
  .search-hist-item:hover { background: var(--bg4); }
  .search-hist-item .sh-query { flex: 1; font-size: 17px; color: var(--fg); }
  .search-hist-item .sh-remove {
    background: none; border: none; color: var(--fg4); font-size: 16px;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  .search-hist-item .sh-remove:hover { color: var(--err-fg); }
  .search-hist-clear {
    display: inline-block; font-size: 14px; color: var(--fg3); cursor: pointer;
    margin-top: 8px; padding: 4px 0; border: none; background: none; font-family: inherit;
  }
  .search-hist-clear:hover { color: var(--err-fg); }
  .search-result {
    padding: 12px; margin-bottom: 8px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    transition: background 0.1s;
  }
  .search-result:hover { background: var(--bg4); }
  .search-ref { font-size: 14px; font-weight: 600; color: var(--accent-fg); background: var(--accent);
    display: inline-block; padding: 2px 8px; border-radius: 4px; margin-bottom: 4px; }
  html.dark .search-ref { color: var(--accent-fg); background: var(--accent); }
  .search-text { font-size: 16px; color: var(--fg2); }
  .search-text mark { background: #fff3a8; color: #222; border-radius: 2px; padding: 0 1px; }
  html.dark .search-text mark { background: #5a4a00; color: #e0e0e0; }

  #error {
    display: none; background: var(--err-bg); color: var(--err-fg);
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
  }
  #loading { color: var(--fg3); font-size: 15px; padding: 40px 20px; text-align: center; }

  /* Large font overrides */
  html.large-font .dd-item { font-size: 20px; padding: 14px 18px; }
  html.large-font .dd-empty { font-size: 19px; }
  html.large-font .book-btn { padding: 12px 14px; }
  html.large-font .book-name-en { font-size: 22px; }
  html.large-font .book-name-ko { font-size: 18px; }
  html.large-font .testament h2 { font-size: 22px; }
  html.large-font .chapters-header { font-size: 26px; }
  html.large-font .chapter-btn { font-size: 23px; padding: 18px 0; }
  html.large-font .verse { font-size: 24px; line-height: 1.9; }
  html.large-font .verse-num { font-size: 17px; }
  html.large-font .footnote-toggle { font-size: 16px; }
  html.large-font .footnote-body { font-size: 20px; }
  html.large-font .search-input { font-size: 21px; }
  html.large-font .search-ref { font-size: 17px; }
  html.large-font .search-text { font-size: 19px; }
  html.large-font .search-count { font-size: 18px; }
  html.large-font .search-hist-item .sh-query { font-size: 20px; }
  html.large-font .search-hist-label { font-size: 17px; }
  /* Auth UI */
  .profile-avatar {
    width: 28px; height: 28px; border-radius: 50%; vertical-align: middle;
    border: 1.5px solid rgba(255,255,255,0.4);
  }
  .fab-main .profile-avatar {
    width: 36px; height: 36px; border-color: rgba(255,255,255,0.35);
  }
  .dd-user {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .dd-user-photo { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
  .dd-user-info { flex: 1; min-width: 0; }
  .dd-user-name { font-size: 15px; font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-user-email { font-size: 12px; color: var(--fg3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-sync-status { font-size: 12px; color: var(--fg4); padding: 4px 16px 8px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div id="floating-nav" class="floating-nav hidden" role="navigation" aria-label="Chapter">
  <button type="button" id="fn-prev" aria-label="Previous chapter">←</button>
  <button type="button" class="fn-book" id="fn-book" aria-label="Choose book"></button>
  <button type="button" class="fn-chapter" id="fn-chapter" aria-label="Choose chapter"></button>
  <button type="button" id="fn-next" aria-label="Next chapter">→</button>
</div>

<div class="fab-root">
  <div id="fab-panel" class="fab-panel">
    <div id="auth-area"></div>
    <button class="dd-item" id="dd-dark" type="button">
      <span class="dd-icon" id="dd-dark-icon">🌙</span>
      <span class="dd-label">Dark Mode</span>
      <span class="dd-value" id="dd-dark-val">Off</span>
    </button>
    <button class="dd-item" id="dd-font" type="button">
      <span class="dd-icon">Aa</span>
      <span class="dd-label">Large Text</span>
      <span class="dd-value" id="dd-font-val">Off</span>
    </button>
    <button class="dd-item" id="btn-search" type="button">
      <span class="dd-icon">🔍</span>
      <span class="dd-label">Search</span>
    </button>
    <div class="fab-section-label">Recent reading</div>
    <div id="history-menu" class="fab-history-menu"></div>
  </div>
  <button type="button" id="fab-main" class="fab-main" aria-label="Menu" aria-expanded="false" aria-controls="fab-panel">☰</button>
</div>

<div id="view">
  <div class="view-inner" id="view-inner">
    <div id="error"></div>
    <p id="loading">Loading&hellip;</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore-compat.js"></script>
<script>
(function () {
  // ===================== FIREBASE =====================
  var fbApp = firebase.initializeApp({
    apiKey: "AIzaSyBQy2RroDHDnUxfOs4aDCmS4nOEC_3j9Ac",
    authDomain: "awmpc-bible.firebaseapp.com",
    projectId: "awmpc-bible",
    storageBucket: "awmpc-bible.firebasestorage.app",
    messagingSenderId: "1073608844887",
    appId: "1:1073608844887:web:40700e236dc26d11286512"
  });
  var auth = fbApp.auth();
  var db = fbApp.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

  // ===================== STATE WRAPPER =====================
  var _syncTimer = null;
  var _currentUid = null;

  function _userDoc() {
    return _currentUid ? db.collection('users').doc(_currentUid) : null;
  }

  var _syncStatusEl = null;
  function _setSyncStatus(text) {
    if (_syncStatusEl) _syncStatusEl.textContent = text;
  }

  function _scheduleSync() {
    if (!_currentUid) return;
    clearTimeout(_syncTimer);
    _setSyncStatus('Pending\u2026');
    _syncTimer = setTimeout(function () {
      var doc = _userDoc();
      if (!doc) return;
      _setSyncStatus('Syncing\u2026');
      doc.set({
        dark: State.getDark(),
        font: State.getFont(),
        history: State.getHistory(),
        searchHistory: State.getSearchHistory(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true }).then(function () {
        _setSyncStatus('Synced \u2713');
      }).catch(function () {
        _setSyncStatus('Offline \u2014 will sync later');
      });
    }, 1500);
  }

  var State = {
    _get: function (k, fallback) {
      try { var v = localStorage.getItem(k); return v !== null ? JSON.parse(v) : fallback; }
      catch(e) { return fallback; }
    },
    _set: function (k, v) {
      try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {}
      _scheduleSync();
    },

    getDark: function () { return this._get('bible_dark', false); },
    setDark: function (v) { this._set('bible_dark', v); },

    getFont: function () { return this._get('bible_large_font', false); },
    setFont: function (v) { this._set('bible_large_font', v); },

    getHistory: function () { return this._get('bible_history', []); },
    pushHistory: function (book, ch) {
      var list = this.getHistory();
      var key = book + '|' + ch;
      list = list.filter(function (x) { return x !== key; });
      list.unshift(key);
      if (list.length > 30) list = list.slice(0, 30);
      this._set('bible_history', list);
    },

    getSearchHistory: function () { return this._get('bible_search_hist', []); },
    pushSearchHistory: function (q) {
      var list = this.getSearchHistory();
      list = list.filter(function (x) { return x !== q; });
      list.unshift(q);
      if (list.length > 20) list = list.slice(0, 20);
      this._set('bible_search_hist', list);
    },
    removeSearchHistory: function (q) {
      var list = this.getSearchHistory().filter(function (x) { return x !== q; });
      this._set('bible_search_hist', list);
    },
    clearSearchHistory: function () { this._set('bible_search_hist', []); },

    applyCloudData: function (data) {
      if (!data) return;
      if (typeof data.dark === 'boolean') { try { localStorage.setItem('bible_dark', JSON.stringify(data.dark)); } catch(e) {} }
      if (typeof data.font === 'boolean') { try { localStorage.setItem('bible_large_font', JSON.stringify(data.font)); } catch(e) {} }
      if (Array.isArray(data.history)) { try { localStorage.setItem('bible_history', JSON.stringify(data.history)); } catch(e) {} }
      if (Array.isArray(data.searchHistory)) { try { localStorage.setItem('bible_search_hist', JSON.stringify(data.searchHistory)); } catch(e) {} }
    }
  };

  // ===================== CONSTANTS =====================
  var OT_COUNT = 39;
  var KO = {
    'Genesis':'\uCC3D\uC138\uAE30','Exodus':'\uCD9C\uC560\uAD7D\uAE30','Leviticus':'\uB808\uC704\uAE30',
    'Numbers':'\uBBFC\uC218\uAE30','Deuteronomy':'\uC2E0\uBA85\uAE30','Joshua':'\uC5EC\uD638\uC218\uC544',
    'Judges':'\uC0AC\uC0AC\uAE30','Ruth':'\uB8FF\uAE30','1 Samuel':'\uC0AC\uBB34\uC5D8\uC0C1',
    '2 Samuel':'\uC0AC\uBB34\uC5D8\uD558','1 Kings':'\uC5F4\uC655\uAE30\uC0C1','2 Kings':'\uC5F4\uC655\uAE30\uD558',
    '1 Chronicles':'\uC5ED\uB300\uC0C1','2 Chronicles':'\uC5ED\uB300\uD558','Ezra':'\uC5D0\uC2A4\uB77C',
    'Nehemiah':'\uB290\uD5E4\uBBF8\uC57C','Esther':'\uC5D0\uC2A4\uB354','Job':'\uC695\uAE30',
    'Psalms':'\uC2DC\uD3B8','Proverbs':'\uC7A0\uC5B8','Ecclesiastes':'\uC804\uB3C4\uC11C',
    'Song of Solomon':'\uC544\uAC00','Isaiah':'\uC774\uC0AC\uC57C','Jeremiah':'\uC608\uB808\uBBF8\uC57C',
    'Lamentations':'\uC608\uB808\uBBF8\uC57C \uC560\uAC00','Ezekiel':'\uC5D0\uC2A4\uACA4',
    'Daniel':'\uB2E4\uB2C8\uC5D8','Hosea':'\uD638\uC138\uC544','Joel':'\uC694\uC5D8',

  // ===================== FOOTNOTES =====================
  var footnoteRe = /\{\[(\d+)\]\s*(.*?)\}/g;
  function parseVerse(raw) {
    var segments = [];
    var last = 0;
    var m;
    footnoteRe.lastIndex = 0;
    while ((m = footnoteRe.exec(raw)) !== null) {
      if (m.index > last) {
        segments.push({ type: 'text', value: raw.slice(last, m.index).replace(/  +/g, ' ') });
      }
      segments.push({ type: 'note', num: m[1], text: m[2] });
      last = footnoteRe.lastIndex;
    }
    if (last < raw.length) {
      segments.push({ type: 'text', value: raw.slice(last).replace(/  +/g, ' ') });
    }
    return segments;
  }

  // ===================== NAV STATE =====================
  function sortedChapterKeys(bookName) {
    return Object.keys(bibleData[bookName]).sort(function (a, b) {
      return parseInt(a, 10) - parseInt(b, 10);
    });
  }

  function prevChapterNav(book, ch) {
    var books = Object.keys(bibleData);
    var bi = books.indexOf(book);
    if (bi === -1) return null;
    var chList = sortedChapterKeys(book);
    var idx = chList.indexOf(String(ch));
    if (idx > 0) {
      return { book: book, chapter: parseInt(chList[idx - 1], 10) };
    }
    if (bi <= 0) return null;
    var prevBook = books[bi - 1];
    var prevCh = sortedChapterKeys(prevBook);
    return { book: prevBook, chapter: parseInt(prevCh[prevCh.length - 1], 10) };
  }

  function nextChapterNav(book, ch) {
    var books = Object.keys(bibleData);
    var bi = books.indexOf(book);
    if (bi === -1) return null;
    var chList = sortedChapterKeys(book);
    var idx = chList.indexOf(String(ch));
    if (idx >= 0 && idx < chList.length - 1) {
      return { book: book, chapter: parseInt(chList[idx + 1], 10) };
    }
    if (bi >= books.length - 1) return null;
    var nextBook = books[bi + 1];
    var nextCh = sortedChapterKeys(nextBook);
    return { book: nextBook, chapter: parseInt(nextCh[0], 10) };
  }

  function updateNav() {
    if (uiView !== 'verses' || !currentBook || currentChapter == null || !bibleData) {
      floatingNav.classList.add('hidden');
      return;
    }
    floatingNav.classList.remove('hidden');
    fnBook.textContent = currentBook;
    fnChapter.textContent = String(currentChapter);
    var p = prevChapterNav(currentBook, currentChapter);
    var n = nextChapterNav(currentBook, currentChapter);
    fnPrev.disabled = !p;
    fnNext.disabled = !n;
  }

  var navFromPop = false;

  window.addEventListener('popstate', function (e) {
    if (!bibleData) return;
    var s = e.state;
    navFromPop = true;
    if (s && s.view === 'verses' && s.book && s.chapter) showVersesView(s.book, s.chapter);
    else if (s && s.view === 'chapters' && s.book) showChaptersView(s.book);
    else if (s && s.view === 'search') showSearchView();
    else showBooksView();
    navFromPop = false;
  });

  // ===================== VIEW: VERSES =====================
  function showVersesView(bookName, chapterNum, scrollToVerse) {
    viewEl.scrollTop = 0;
    viewInner.textContent = '';
    currentBook = bookName;
    currentChapter = chapterNum;
    uiView = 'verses';
    updateNav();
    pushNav({ view: 'verses', book: bookName, chapter: chapterNum });
    State.pushHistory(bookName, chapterNum);

    var chapters = bibleData[bookName];
    var verses = chapters[String(chapterNum)];
    var keys = Object.keys(verses);

    for (var i = 0; i < keys.length; i++) {
      var segments = parseVerse(verses[keys[i]]);
      var div = document.createElement('div');
      div.className = 'verse';
      div.setAttribute('data-v', keys[i]);

      var p = document.createElement('p');
      var sup = document.createElement('span');
      sup.className = 'verse-num';
      sup.textContent = keys[i];
      p.appendChild(sup);

      var noteBodies = [];
      for (var s = 0; s < segments.length; s++) {
        var seg = segments[s];
        if (seg.type === 'text') {
          p.appendChild(document.createTextNode(seg.value));
        } else {
          var noteBtn = document.createElement('button');
          noteBtn.type = 'button';
          noteBtn.className = 'footnote-toggle';
          noteBtn.textContent = '\u2020' + seg.num;
          var noteBody = document.createElement('div');
          noteBody.className = 'footnote-body';
          noteBody.textContent = '[' + seg.num + '] ' + seg.text;
          noteBtn.addEventListener('click', (function (b, bd) {
            return function () {
              var on = bd.className.indexOf('visible') !== -1;
              bd.className = on ? 'footnote-body' : 'footnote-body visible';
              b.className = on ? 'footnote-toggle' : 'footnote-toggle open';
            };
          })(noteBtn, noteBody));
          p.appendChild(noteBtn);
          noteBodies.push(noteBody);
        }
      }

      div.appendChild(p);
      for (var nb = 0; nb < noteBodies.length; nb++) div.appendChild(noteBodies[nb]);
      viewInner.appendChild(div);
    }

    if (scrollToVerse) {
      requestAnimationFrame(function () {
        var target = viewInner.querySelector('[data-v="' + scrollToVerse + '"]');
        if (target) {
          target.scrollIntoView({ behavior: 'smooth', block: 'center' });
          target.classList.add('highlight');
          setTimeout(function () {
            target.classList.add('highlight-fade');
            target.classList.remove('highlight');
          }, 1800);
          setTimeout(function () {
            target.classList.remove('highlight-fade');
          }, 3500);
        }
      });
    }
  }

  // ===================== VIEW: SEARCH =====================
  function normalizeSearchText(raw) {
    var t = String(raw).replace(/\{\[\d+\]\s*.*?\}/g, '').replace(/  +/g, ' ');
    t = t.toLowerCase();
    try {
      return t.replace(/[^\p{L}\p{N}]+/gu, '');
    } catch (e) {
      return t.replace(/[^a-z0-9]+/gi, '');
    }
  }

  function buildSearchIndex() {
    if (searchIndex) return;
    searchIndex = [];
    var books = Object.keys(bibleData);
    for (var b = 0; b < books.length; b++) {
      var chs = bibleData[books[b]];
      var chKeys = Object.keys(chs);
      for (var c = 0; c < chKeys.length; c++) {
        var vs = chs[chKeys[c]];
        var vKeys = Object.keys(vs);
        for (var v = 0; v < vKeys.length; v++) {
          var txt = vs[vKeys[v]];
          searchIndex.push({
            book: books[b], ch: chKeys[c], v: vKeys[v],
            text: txt,
            lower: txt.toLowerCase(),
            norm: normalizeSearchText(txt)
          });
        }
      }
    }
  }

  function renderSearchHistory(histEl, input, countEl, resultsEl) {
    histEl.textContent = '';
    var hist = State.getSearchHistory();
    if (hist.length === 0) return;

    var label = document.createElement('div');
    label.className = 'search-hist-label';
    label.textContent = 'Recent Searches';
    histEl.appendChild(label);

    for (var i = 0; i < hist.length; i++) {
      var row = document.createElement('div');
      row.className = 'search-hist-item';

      var qSpan = document.createElement('span');
      qSpan.className = 'sh-query';
      qSpan.textContent = hist[i];
      row.appendChild(qSpan);

      var rm = document.createElement('button');
      rm.type = 'button';
      rm.className = 'sh-remove';
      rm.textContent = '\u2715';
      rm.addEventListener('click', (function (q) {
        return function (e) {
          e.stopPropagation();
          State.removeSearchHistory(q);
          renderSearchHistory(histEl, input, countEl, resultsEl);
        };
      })(hist[i]));
      row.appendChild(rm);

      row.addEventListener('click', (function (q) {
        return function () {
          input.value = q;
          histEl.style.display = 'none';
          runSearch(q, countEl, resultsEl);
        };
      })(hist[i]));
      histEl.appendChild(row);
    }

    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'search-hist-clear';
    clearBtn.textContent = 'Clear search history';
    clearBtn.addEventListener('click', function () {
      State.clearSearchHistory();
      renderSearchHistory(histEl, input, countEl, resultsEl);
    });
    histEl.appendChild(clearBtn);
  }

  function showSearchView() {
    viewEl.scrollTop = 0;
    viewInner.textContent = '';
    currentBook = null;
    currentChapter = null;
    uiView = 'search';
    updateNav();
    pushNav({ view: 'search' });
    buildSearchIndex();

    var bar = document.createElement('div');
    bar.className = 'search-bar';
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'search-input';
    input.placeholder = 'Search the Bible\u2026';
    input.setAttribute('autocomplete', 'off');
    bar.appendChild(input);
    viewInner.appendChild(bar);

    var countEl = document.createElement('div');
    countEl.className = 'search-count';
    viewInner.appendChild(countEl);

    var resultsEl = document.createElement('div');
    viewInner.appendChild(resultsEl);

    var histEl = document.createElement('div');
    viewInner.appendChild(histEl);
    renderSearchHistory(histEl, input, countEl, resultsEl);

    var debounce = null;
    var lastCommitted = '';
    input.addEventListener('input', function () {
      clearTimeout(debounce);
      var q = input.value.trim();
      if (q.length < 2) {
        countEl.textContent = '';
        resultsEl.textContent = '';
        histEl.style.display = '';
        renderSearchHistory(histEl, input, countEl, resultsEl);
        return;
      }
      histEl.style.display = 'none';
      debounce = setTimeout(function () { runSearch(q, countEl, resultsEl); }, 250);
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var q = input.value.trim();
        if (q.length >= 2 && q !== lastCommitted) {
          lastCommitted = q;
          State.pushSearchHistory(q);
        }
      }
    });

    input.addEventListener('blur', function () {
      var q = input.value.trim();
      if (q.length >= 2 && q !== lastCommitted) {
        lastCommitted = q;
        State.pushSearchHistory(q);
      }
    });

    setTimeout(function () { input.focus(); }, 100);
  }

  function runSearch(query, countEl, resultsEl) {
    resultsEl.textContent = '';
    var q = query.trim();
    if (q.length < 2) { countEl.textContent = ''; return; }
    var qn = normalizeSearchText(q);
    if (qn.length < 2) { countEl.textContent = ''; return; }

    var results = [];
    var max = 200;
    for (var i = 0; i < searchIndex.length && results.length < max; i++) {
      if (searchIndex[i].norm.indexOf(qn) !== -1) results.push(searchIndex[i]);
    }

    countEl.textContent = results.length >= max ? max + '+ results' : results.length + ' result' + (results.length !== 1 ? 's' : '');

    var qLow = q.toLowerCase();
    for (var r = 0; r < results.length; r++) {
      var item = results[r];
      var div = document.createElement('div');
      div.className = 'search-result';

      var ref = document.createElement('span');
      ref.className = 'search-ref';
      ref.textContent = item.book + ' ' + item.ch + ':' + item.v;
      div.appendChild(ref);

      var text = document.createElement('div');
      text.className = 'search-text';
      var raw = item.text.replace(/\{\[\d+\]\s*.*?\}/g, '').replace(/  +/g, ' ');
      var rawLower = raw.toLowerCase();
      var idx = rawLower.indexOf(qLow);
      var markLen = q.length;
      if (idx < 0) {
        var words = qLow.split(/\s+/).filter(Boolean);
        if (words.length) {
          idx = rawLower.indexOf(words[0]);
          markLen = words[0].length;
        }
      }
      if (idx < 0) {
        idx = 0;
        markLen = Math.min(20, raw.length);
      }
      var start = Math.max(0, idx - 40);
      var end = Math.min(raw.length, idx + markLen + 40);
      var snippet = (start > 0 ? '\u2026' : '') + raw.slice(start, end) + (end < raw.length ? '\u2026' : '');
      var rel = idx - start + (start > 0 ? 1 : 0);
      var before = snippet.slice(0, rel);
      var match = snippet.slice(rel, rel + markLen);
      var after = snippet.slice(rel + markLen);
      text.appendChild(document.createTextNode(before));
      var mark = document.createElement('mark');
      mark.textContent = match;
      text.appendChild(mark);
      text.appendChild(document.createTextNode(after));
      div.appendChild(text);

      div.addEventListener('click', (function (book, ch, verse) {
        return function () { showVersesView(book, parseInt(ch, 10), verse); };
      })(item.book, item.ch, item.v));
      resultsEl.appendChild(div);
    }
  }


  // ===================== BOOK BUTTON FACTORY =====================
  function createBookButton(bookName, index, list) {
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.type = 'button';

    var enSpan = document.createElement('div');
    enSpan.className = 'book-name-en';
    enSpan.textContent = bookName;
    btn.appendChild(enSpan);

    var ko = koName(bookName);
    if (ko) {
      var koSpan = document.createElement('div');
      koSpan.className = 'book-name-ko';
      koSpan.textContent = ko;
      btn.appendChild(koSpan);
    }

    btn.addEventListener('click', function () { showChaptersView(bookName); });
    li.appendChild(btn);
    list.appendChild(li);
  }
  // ===================== NAV HANDLERS =====================
  fnPrev.addEventListener('click', function () {
    if (!bibleData || !currentBook || !currentChapter) return;
    var p = prevChapterNav(currentBook, currentChapter);
    if (p) showVersesView(p.book, p.chapter);
  });
  fnNext.addEventListener('click', function () {
    if (!bibleData || !currentBook || !currentChapter) return;
    var n = nextChapterNav(currentBook, currentChapter);
    if (n) showVersesView(n.book, n.chapter);
  });
  fnBook.addEventListener('click', function () {
    if (bibleData) showBooksView();
  });
  fnChapter.addEventListener('click', function () {
    if (bibleData && currentBook) showChaptersView(currentBook);
  });
  document.getElementById('btn-search').addEventListener('click', function (e) {
    e.stopPropagation();
    if (bibleData) {
      closeMenus();
      showSearchView();
    }
  });

  // ===================== LOAD DATA =====================
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'bible.json', true);
  xhr.responseType = 'json';

  xhr.onload = function () {
    loadingEl.style.display = 'none';
    if (xhr.status !== 200 || !xhr.response) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Failed to load bible.json (status ' + xhr.status + ').';
      return;
    }
    bibleData = xhr.response;
    history.replaceState({ view: 'books' }, '');
    navFromPop = true;
    showBooksView();
    navFromPop = false;
  };

  xhr.onerror = function () {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Network error loading bible.json.';
  };

  xhr.send();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
