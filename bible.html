<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible - Books</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    line-height: 1.6;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  h1 {
    font-size: 28px;
    margin-bottom: 8px;
    color: #1a1a1a;
  }
  .subtitle {
    font-size: 15px;
    color: #666;
    margin-bottom: 24px;
  }
  #book-list {
    list-style: none;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
  }
  #book-list li {
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 16px;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  #book-list li:hover {
    border-color: #bbb;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }
  .book-number {
    display: inline-block;
    width: 28px;
    color: #999;
    font-size: 13px;
    text-align: right;
    margin-right: 8px;
  }
  .chapter-count {
    float: right;
    font-size: 13px;
    color: #999;
  }
  #error {
    display: none;
    background: #ffeaea;
    color: #a00;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  #loading {
    color: #888;
    font-size: 15px;
  }
</style>
</head>
<body>
<div class="container">
  <h1>Bible</h1>
  <p class="subtitle">Books of the Bible</p>
  <div id="error"></div>
  <p id="loading">Loading&hellip;</p>
  <ul id="book-list"></ul>
</div>
<script>
(function () {
  var list = document.getElementById('book-list');
  var loading = document.getElementById('loading');
  var errorEl = document.getElementById('error');

  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'bible.json', true);
  xhr.responseType = 'json';

  xhr.onload = function () {
    loading.style.display = 'none';
    if (xhr.status !== 200 || !xhr.response) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Failed to load bible.json (status ' + xhr.status + ').';
      return;
    }
    var data = xhr.response;
    var books = Object.keys(data);
    for (var i = 0; i < books.length; i++) {
      var li = document.createElement('li');
      var numSpan = document.createElement('span');
      numSpan.className = 'book-number';
      numSpan.textContent = (i + 1) + '.';
      li.appendChild(numSpan);

      var nameNode = document.createTextNode(books[i]);
      li.appendChild(nameNode);

      var chapters = Object.keys(data[books[i]]).length;
      var chapSpan = document.createElement('span');
      chapSpan.className = 'chapter-count';
      chapSpan.textContent = chapters + (chapters === 1 ? ' ch' : ' chs');
      li.appendChild(chapSpan);

      list.appendChild(li);
    }
  };

  xhr.onerror = function () {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Network error loading bible.json.';
  };

  xhr.send();
})();
</script>
</body>
</html>
