  * { margin: 0; padding: 0; box-sizing: border-box; }
  .bottom-history-menu[hidden],
  .fab-panel[hidden],
  .verse-actions[hidden] { display: none !important; }
  html, body { height: 100%; max-width: 100%; overflow-x: hidden; overflow-y: hidden; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  body {
    font-family: var(--oneui-font);
    font-size: var(--text-16);
    background: var(--bg); color: var(--fg); line-height: 1.6;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    white-space: nowrap;
  }
  button,
  .dd-item,
  .book-btn,
  .chapter-btn {
    -webkit-tap-highlight-color: transparent;
    transition-property: background, border-color, box-shadow, color, transform;
    transition-duration: 180ms, 180ms, 180ms, 180ms, 120ms;
    transition-timing-function: var(--motion-ease);
  }
  .verse-btn {
    -webkit-tap-highlight-color: transparent;
    transition-property: background, border-color, box-shadow, color, transform;
    transition-duration: 180ms, 180ms, 180ms, 180ms, 120ms;
    transition-timing-function: var(--motion-ease);
  }
  button,
  input,
  select,
  [role="button"] {
    min-width: 24px;
    min-height: 24px;
  }
  button:hover,
  button:focus-visible,
  .dd-item:hover,
  .dd-item:focus-visible,
  .book-btn:hover,
  .book-btn:focus-visible,
  .chapter-btn:hover,
  .chapter-btn:focus-visible {
    transition-duration: 220ms;
  }
  .verse-btn:hover, .verse-btn:focus-visible { transition-duration: 220ms; }
  html.theme-transitioning,
  html.theme-transitioning body,
  html.theme-transitioning .bottom-chrome,
  html.theme-transitioning .floating-nav,
  html.theme-transitioning .action-chrome,
  html.theme-transitioning .fab-panel,
  html.theme-transitioning .fab-card,
  html.theme-transitioning .bottom-history-menu,
  html.theme-transitioning .dd-item,
  html.theme-transitioning .setting-select,
  html.theme-transitioning .book-btn,
  html.theme-transitioning .chapter-btn,
  html.theme-transitioning .verse,
  html.theme-transitioning .search-result {
    transition-property: background, background-color, border-color, box-shadow, color, opacity, transform;
    transition-duration: 200ms;
    transition-timing-function: var(--motion-ease);
  }
  html.theme-transitioning .verse-btn {
    transition-property: background, background-color, border-color, box-shadow, color, opacity, transform;
    transition-duration: 200ms;
    transition-timing-function: var(--motion-ease);
  }
  .press-ripple-host {
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  .press-ripple {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    pointer-events: none;
    background: color-mix(in srgb, var(--accent) 32%, transparent);
    transform: translate(-50%, -50%) scale(0);
    animation: press-ripple 320ms var(--motion-ease) forwards;
  }
  @keyframes press-ripple {
    0% { opacity: .42; transform: translate(-50%, -50%) scale(0); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(var(--ripple-scale, 16)); }
  }
  .marquee-line {
    display: block;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
  }
  .marquee-text {
    display: inline-block;
    max-width: none;
    white-space: nowrap;
    will-change: transform;
  }
  .marquee-line.is-marquee .marquee-text {
    animation: marquee-sway 3s var(--motion-ease) infinite alternate;
  }
  @keyframes marquee-sway {
    0%, 18% { transform: translateX(0); }
    82%, 100% { transform: translateX(calc(var(--marquee-distance, 0px) * -1)); }
  }
  button:active,
  .dd-item:active,
  .book-btn:active,
  .chapter-btn:active {
    transform: scale(.975);
    transition-duration: 80ms;
  }
  .verse-btn:active { transform: scale(.975); transition-duration: 80ms; }
  button:disabled {
    transform: none;
  }

  /* Responsive chrome viewport layer */
  .bottom-chrome {
    position: fixed;
    inset: 0;
    z-index: 125;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--display-panel-gap);
    padding: 0 12px calc(8px + env(safe-area-inset-bottom, 0px));
    overflow: visible;
    pointer-events: none;
    color: var(--float-nav-fg);
  }
  .bottom-chrome.scroll-hidden .floating-nav {
    transform: translateY(calc(100% + 18px + env(safe-area-inset-bottom, 0px)));
    opacity: 0;
  }
  .bottom-chrome.scroll-hidden .action-chrome {
    transform: translateY(calc(100% + 18px + env(safe-area-inset-bottom, 0px)));
    opacity: 0;
  }

  /* Floating chapter nav */
  .floating-nav {
    display: flex; align-items: center; justify-content: flex-start; gap: min(6px, var(--display-nav-padding));
    position: static;
    transform: translateY(0);
    width: auto;
    max-width: min(720px, calc(100% - 180px));
    min-width: 0;
    flex: 0 1 auto;
    min-height: var(--display-control-height);
    z-index: 120;
    pointer-events: auto;
    background: var(--float-nav-bg); color: inherit;
    border: var(--card-border);
    border-radius: var(--radius-md); padding: var(--display-nav-padding);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    transition-property: transform, opacity;
    transition-duration: var(--chrome-motion);
    transition-timing-function: var(--motion-ease);
  }
  .floating-nav.hidden { display: none; }
  .floating-nav button {
    background: var(--surface); border: 1px solid var(--border);
    color: inherit; font-size: var(--display-control-font-size); font-family: inherit; border-radius: var(--radius-xs);
    padding: var(--display-control-pad-y) var(--display-control-pad-x); cursor: pointer;
    height: var(--display-control-height); min-height: var(--display-control-height); box-sizing: border-box;
    box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; line-height: 1.15; white-space: nowrap; overflow: hidden;
  }
  .floating-nav button:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--hover-bg);
    outline: none;
  }
  .floating-nav button:disabled {
    opacity: 0.35; cursor: not-allowed;
  }
  .floating-nav .fn-book {
    flex: 0 1 auto; flex-basis: var(--floating-nav-book-width); width: var(--floating-nav-book-width); max-width: var(--floating-nav-book-width);
    font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap;
  }
  .floating-nav .fn-book.is-marquee { justify-content: flex-start; }
  .floating-nav .fn-book .marquee-line { width: 100%; }
  .floating-nav .fn-chapter,
  .floating-nav .fn-verse {
    font-weight: 600; min-width: 44px;
  }
  .bottom-actions {
    display: flex; align-items: center; justify-content: center; gap: var(--display-panel-gap);
    position: relative;
    flex: 0 0 auto;
    min-height: var(--display-control-height);
    z-index: 121;
    background: transparent; color: inherit;
    border: 0; border-radius: var(--radius-sm); padding: 0;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .action-chrome {
    position: static;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--display-panel-gap);
    min-height: calc(var(--display-control-height) + (var(--display-nav-padding) * 2));
    padding: var(--display-nav-padding);
    pointer-events: auto;
    background: var(--float-nav-bg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    transform: translateY(0);
    transition-property: transform, opacity;
    transition-duration: var(--chrome-motion);
    transition-timing-function: var(--motion-ease);
  }
  .bottom-action-button {
    height: var(--display-control-height); min-height: var(--display-control-height); box-sizing: border-box;
    border-radius: var(--radius-xs); border: 1px solid var(--border);
    background: var(--surface); color: inherit; font: inherit; font-size: var(--display-control-font-size);
    padding: var(--display-control-pad-y) var(--display-control-pad-x); cursor: pointer; box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; line-height: 1.15; white-space: nowrap; overflow: hidden;
  }
  .bottom-action-button:focus-visible {
    color: var(--accent); border-color: var(--accent); background: var(--hover-bg); outline: none;
  }
  .bottom-history-menu {
    position: fixed;
    right: 12px;
    bottom: var(--bottom-chrome-clearance);
    width: min(420px, calc(100vw - 24px));
    max-width: 100%;
    max-height: calc(100dvh - var(--bottom-chrome-clearance) - 12px);
    display: grid;
    grid-auto-rows: minmax(0, auto);
    gap: var(--display-panel-gap);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: var(--display-panel-padding);
    background: var(--float-nav-bg);
    border: var(--card-border);
    border-radius: var(--radius-sm);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    isolation: isolate;
    z-index: 132;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(6px) scale(.98);
    transition-property: opacity, transform, visibility;
    transition-duration: 180ms, 180ms, 0s;
    transition-delay: 0s, 0s, 180ms;
    transition-timing-function: var(--motion-ease);
  }
  .bottom-history-menu.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
    transition-property: opacity, transform, visibility;
    transition-duration: 180ms, 180ms, 0s;
    transition-delay: 0s;
    transition-timing-function: var(--motion-ease);
  }
  .bottom-history-menu .dd-item {
    min-width: 0;
    min-height: 24px;
    align-items: center;
    padding: min(7px, calc(var(--display-control-pad-y) * .875)) min(10px, calc(var(--display-control-pad-x) / 1.2));
    border: 1px solid var(--border);
    border-radius: var(--radius-xs);
    background: color-mix(in srgb, var(--surface) 72%, transparent);
    box-shadow: var(--shadow);
    backdrop-filter: inherit;
    -webkit-backdrop-filter: inherit;
  }
  .bottom-history-menu .dd-icon {

  // ===================== VIEW: SEARCH =====================
  function normalizeSearchText(raw) {
    var t = String(raw).replace(footnoteStripRe, '').replace(/  +/g, ' ');
    t = t.toLowerCase();
    try {
      return t.replace(/[^\p{L}\p{N}]+/gu, '');
    } catch (e) {
      return t.replace(/[^a-z0-9]+/gi, '');
    }
  }

  /* SEARCH SHEET PURE HELPERS START */
  function boundedSearchQuery(value) {
    return String(value == null ? '' : value).trim().slice(0, 160);
  }
  function normalizeSearchHistory(values) {
    if (!Array.isArray(values)) return [];
    var normalized = [];
    var seen = Object.create(null);
    for (var i = 0; i < values.length && normalized.length < 20; i++) {
      if (typeof values[i] !== 'string') continue;
      var query = boundedSearchQuery(values[i]);
      if (query.length < 2 || seen[query]) continue;
      seen[query] = true;
      normalized.push(query);
    }
    return normalized;
  }
  /* SEARCH SHEET PURE HELPERS END */

  /** Map first normalized match of qn in raw (footnote-stripped) to [start,end) indices in that same string. */
  function findNormMatchInRaw(raw, qn) {
    var stripped = String(raw).replace(footnoteStripRe, '').replace(/  +/g, ' ');
    var normFull = normalizeSearchText(stripped);
    var pos = normFull.indexOf(qn);
    if (pos === -1) return null;
    var lower = stripped.toLowerCase();
    var built = 0;
    var rawStart = -1;
    var i = 0;
    while (i < lower.length) {
      var cp = lower.codePointAt(i);
      var w = cp > 0xffff ? 2 : 1;
      var ch = String.fromCodePoint(cp);
      var isWord = false;
      try {
        isWord = /^[\p{L}\p{N}]$/u.test(ch);
      } catch (e) {
        isWord = /[a-z0-9]/i.test(ch);
      }
      if (isWord) {
        if (built === pos) rawStart = i;
        built++;
        if (built === pos + qn.length) {
          return { start: rawStart, end: i + w };
        }
      }
      i += w;
    }
    return null;
  }

  function scheduleSearchIndexChunk(callback) {
    if (typeof window.requestIdleCallback === 'function') {
      searchIndexChunkHandle = window.requestIdleCallback(callback, { timeout: 120 });
    } else {
      searchIndexChunkHandle = window.setTimeout(function () {
        callback({ didTimeout: true, timeRemaining: function () { return 0; } });
      }, 0);
    }
  }

  function buildSearchIndexInChunks() {
    if (!bibleData || searchIndexReady || searchIndexChunkHandle !== null) return;
    searchIndexBuildGeneration++;
    var generation = searchIndexBuildGeneration;
    searchIndex = [];
    var books = Object.keys(bibleData);
    var b = 0;
    var c = 0;
    var v = 0;
    var chKeys = books.length ? Object.keys(bibleData[books[0]]) : [];
    var vKeys = chKeys.length ? Object.keys(bibleData[books[0]][chKeys[0]]) : [];

    function buildChunk(deadline) {
      searchIndexChunkHandle = null;
      if (generation !== searchIndexBuildGeneration) return;
      var processed = 0;
      while (b < books.length && processed < SEARCH_INDEX_CHUNK_SIZE &&
          (processed === 0 || deadline.didTimeout || deadline.timeRemaining() > 1)) {
        var vs = bibleData[books[b]][chKeys[c]];
        if (v < vKeys.length) {
          var txt = resolvedVerseSource(vs, vKeys[v]);
          searchIndex.push({
            book: books[b], ch: chKeys[c], v: vKeys[v],
            text: txt,
            lower: txt.toLowerCase(),
            norm: normalizeSearchText(txt)
          });
          v++;
          processed++;
          continue;
        }
        c++;
        v = 0;
        if (c < chKeys.length) {
          vKeys = Object.keys(bibleData[books[b]][chKeys[c]]);
          continue;
        }
        b++;
        c = 0;
        if (b < books.length) {
          chKeys = Object.keys(bibleData[books[b]]);
          vKeys = chKeys.length ? Object.keys(bibleData[books[b]][chKeys[0]]) : [];
        }
      }
      if (b < books.length) scheduleSearchIndexChunk(buildChunk);
      else searchIndexReady = true;
    }

    scheduleSearchIndexChunk(buildChunk);
  }

  function renderSearchHistory(histEl, input, countEl, resultsEl) {
    histEl.textContent = '';
    var hist = State.getSearchHistory();
    if (hist.length === 0) return;

    var label = document.createElement('div');
    label.className = 'search-hist-label';

    for (var i = 0; i < hist.length; i++) {

      if (!boundedHistoryQuery) continue;
      qSpan.textContent = boundedHistoryQuery;

      rm.className = 'sh-remove';

      rm.addEventListener('click', (function (q) {
        return function (e) {

          renderSearchHistory(histEl, input, countEl, resultsEl);
        };
      })(boundedHistoryQuery));
      row.appendChild(rm);

      qSpan.addEventListener('click', (function (q) {
        return function () {
          input.value = q;

      })(boundedHistoryQuery));
      histEl.appendChild(row);
    }

    var clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'search-hist-clear';

    });
    histEl.appendChild(clearBtn);
  }

  function runSearch(query, countEl, resultsEl) {
    resultsEl.textContent = '';
    var q = boundedSearchQuery(query);
    if (q.length < 2) { countEl.textContent = ''; return; }
    if (!searchIndexReady) {
      countEl.textContent = 'Preparing search…';
      renderSearchSkeleton(resultsEl);
      return;
    }
    var qn = normalizeSearchText(q);
    if (qn.length < 2) { countEl.textContent = ''; return; }

    var results = [];
    var max = 200;
    for (var i = 0; i < searchIndex.length && results.length < max; i++) {
      if (searchIndex[i].norm.indexOf(qn) !== -1) results.push(searchIndex[i]);
    }

    countEl.textContent = results.length >= max ? max + '+ results' : results.length + ' result' + (results.length !== 1 ? 's' : '');

    var qLow = q.toLowerCase();
    for (var r = 0; r < results.length; r++) {
      var item = results[r];
      var div = document.createElement('button');
      div.type = 'button';
      div.className = 'search-result';

      var ref = document.createElement('span');
      ref.className = 'search-ref';
      ref.textContent = item.book + ' ' + item.ch + ':' + item.v;
      div.appendChild(ref);

      var text = document.createElement('span');
      text.className = 'search-text';
      var raw = item.text.replace(footnoteStripRe, '').replace(/  +/g, ' ');
      var range = findNormMatchInRaw(raw, qn);
      var idx = range ? range.start : 0;
      var markLen = range ? (range.end - range.start) : Math.min(20, raw.length);
      if (!range && raw.length) {
        var rawLower = raw.toLowerCase();
        var words = qLow.split(/\s+/).filter(Boolean);
        if (words.length) {
          var wi = rawLower.indexOf(words[0]);
          if (wi >= 0) {
            idx = wi;
            markLen = words[0].length;
          }
        }
      }
      var start = Math.max(0, idx - 40);
      var end = Math.min(raw.length, idx + markLen + 40);
      var snippet = (start > 0 ? '\u2026' : '') + raw.slice(start, end) + (end < raw.length ? '\u2026' : '');
      var rel = idx - start + (start > 0 ? 1 : 0);
      var before = snippet.slice(0, rel);
      var match = snippet.slice(rel, rel + markLen);
      var after = snippet.slice(rel + markLen);
      text.appendChild(document.createTextNode(before));
      var mark = document.createElement('mark');
      mark.textContent = match;
      text.appendChild(mark);
      text.appendChild(document.createTextNode(after));
      div.appendChild(text);

      div.addEventListener('click', (function (book, ch, verse) {
        return function () { commitSearchResult(book, ch, verse); };
      })(item.book, item.ch, item.v));
      resultsEl.appendChild(div);
    }
  }

  function renderSearchSkeleton(target) {
    target.textContent = '';
    var skeleton = document.createElement('div');
    skeleton.className = 'loading-skeleton search-sheet-skeleton';
    skeleton.setAttribute('role', 'status');
    skeleton.setAttribute('aria-label', 'Preparing Bible search');
    for (var i = 0; i < 4; i++) skeleton.appendChild(document.createElement('span'));
    target.appendChild(skeleton);
  }

  function commitSearchResult(book, chapter, verse) {
    var reference = normalizeVerseReference(book, chapter, verse);
    if (!reference || !bibleData || !bibleData[reference.book]) return false;
    var readerState = {
      view: 'verses', book: reference.book,
      chapter: reference.chapter, verse: reference.verse,
      readerRouteScope: typeof readerRouteScope === 'number' ? readerRouteScope : 0
    };
    history.replaceState(readerState, '', canonicalVerseUrl(reference.book, reference.chapter, reference.verse));
    finishCloseAppSheet();
    navFromPop = true;
    try {
      showVersesViewWithTransition(reference.book, reference.chapter, reference.verse);
    } finally {
      navFromPop = false;
    }
    return true;
  }

  function renderVerseActionsSheet(target) {
    var token = verseActionGeneration;
    var payload = currentVerseAction(token);
    if (!payload) {
      target.textContent = 'Select an active verse first.';
      return function () { verseActionGeneration++; };
    }
    var root = document.createElement('div');
    root.className = 'verse-actions is-open';
    var form = document.createElement('form');
    form.addEventListener('submit', function (event) { event.preventDefault(); });
    var reference = document.createElement('h3');
    reference.textContent = payload.reference;
    form.appendChild(reference);

    function actionButton(icon, label, action) {
      var button = document.createElement('button');
      button.type = 'button';
      var symbol = document.createElement('span');
      symbol.className = 'setting-emoji';
      symbol.setAttribute('aria-hidden', 'true');
      symbol.textContent = icon;
      button.appendChild(symbol);
      button.appendChild(document.createTextNode(label));
      button.addEventListener('click', action);
      form.appendChild(button);
      return button;
    }

    actionButton('📋', 'Copy Verse Text', function () {
      if (verseActionInFlight || !currentVerseAction(token)) return;
      verseActionInFlight = true;
      writeClipboardText(payload.copyText).then(function () {
        finishVerseAction(token, 'Verse copied.', true);
      }).catch(function () {
        finishVerseAction(token, 'Unable to copy the verse. Try again.', false);
      });
    });
    actionButton('🔗', 'Copy Verse Link', function () {
      if (verseActionInFlight || !currentVerseAction(token)) return;
      verseActionInFlight = true;
      writeClipboardText(payload.copyLink).then(function () {
        finishVerseAction(token, 'Verse link copied.', true);
      }).catch(function () {
        finishVerseAction(token, 'Unable to copy the verse link. Try again.', false);
      });
    });
    actionButton('📤', 'Share Verse', function () {
      if (verseActionInFlight || !currentVerseAction(token)) return;
      verseActionInFlight = true;
      if (typeof navigator.share === 'function') {
        var sharePromise;
        try {
          sharePromise = navigator.share({ title: payload.reference, text: payload.copyText, url: payload.url });
        } catch (error) {
          finishVerseAction(token, 'Unable to share the verse. Try again.', false);
          return;
        }
        Promise.resolve(sharePromise).then(function () {
          finishVerseAction(token, 'Verse shared.', true);
        }).catch(function (error) {
          if (error && error.name === 'AbortError') finishVerseAction(token, '', true);
          else finishVerseAction(token, 'Unable to share the verse. Try again.', false);
        });
        return;
      }
      writeClipboardText(payload.combined).then(function () {
        finishVerseAction(token, 'Verse text and link copied.', true);
      }).catch(function () {
        finishVerseAction(token, 'Unable to copy the verse and link. Try again.', false);
      });

    };

    xhr.onerror = function () {
      if (generation !== bibleLoadGeneration || bibleLoadRequest !== xhr) return;
      bibleLoadRequest = null;
      showLoadError('Network error while loading Bible data.');
    };

    xhr.ontimeout = function () {
      if (generation !== bibleLoadGeneration || bibleLoadRequest !== xhr) return;
      bibleLoadRequest = null;
      showLoadError('Bible data took too long to load.');
    };

    xhr.onabort = function () {
      if (generation !== bibleLoadGeneration || bibleLoadRequest !== xhr) return;
      bibleLoadRequest = null;
      showLoadError('Bible data loading was interrupted.');
    };

    xhr.send();
  }

  loadBibleData();

  if (refreshBibleTextButton) refreshBibleTextButton.addEventListener('click', refreshBibleText);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
