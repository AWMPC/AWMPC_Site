<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bible">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="resources/images/bible-icon-192.png">
<title>Bible</title>
<style>
  :root {
    --bg: #f5f5f5; --bg2: #fff; --bg3: #fafaf8; --bg4: #f0f0f0;
    --fg: #222; --fg2: #555; --fg3: #707070; --fg4: #6b6b6b;
    --border: #e0e0e0; --border2: #ddd; --border3: #ccc;
    --accent: #1a1a2e; --accent-fg: #fff;
    --note-bg: #f0efe8; --note-border: #c5b358;
    --err-bg: #ffeaea; --err-fg: #a00;
    --toolbar-bg: #1a1a2e; --toolbar-fg: #e0e0e0;
  }
  html.dark {
    --bg: #121212; --bg2: #1e1e1e; --bg3: #1a1a1a; --bg4: #2a2a2a;
    --fg: #e0e0e0; --fg2: #aaa; --fg3: #959595; --fg4: #929292;
    --border: #333; --border2: #444; --border3: #555;
    --accent: #3a3a5e; --accent-fg: #fff;
    --note-bg: #2a2820; --note-border: #8a7a30;
    --err-bg: #3a1010; --err-fg: #f88;
    --toolbar-bg: #0a0a18; --toolbar-fg: #ccc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    display: flex; flex-direction: column;
  }

  /* Toolbar */
  .toolbar {
    display: flex; flex-direction: column; gap: 0;
    padding: 0; background: var(--toolbar-bg);
    flex-shrink: 0; z-index: 100;
  }
  .toolbar-row {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 10px;
  }
  .toolbar-row + .toolbar-row {
    padding-top: 0; padding-bottom: 8px;
  }
  .toolbar-btn {
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.35);
    color: var(--toolbar-fg); font-size: 16px; font-family: inherit;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; transition: background 0.12s, border-color 0.12s; flex-shrink: 0;
  }
  .toolbar-btn:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.5); }
  .toolbar-title { color: #fff; font-size: 19px; font-weight: 600; flex-shrink: 0; }
  .toolbar-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.15); flex-shrink: 0; }
  .toolbar-spacer { flex: 1; min-width: 4px; }
  .nav-btn {
    background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.45);
    color: #fff; font-size: 16px; font-family: inherit;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; transition: background 0.12s, border-color 0.12s;
    max-width: 140px; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.6); }
  .nav-btn.hidden { display: none; }

  /* History dropdown */
  .history-wrap { position: relative; flex-shrink: 0; }
  .history-menu {
    display: none; position: absolute; top: 100%; right: 0; margin-top: 6px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); min-width: 200px; max-height: 320px;
    overflow-y: auto; z-index: 110;
  }
  .history-menu.open { display: block; }
  .history-menu .hm-empty { padding: 14px 16px; color: var(--fg3); font-size: 16px; }
  .history-item {
    display: block; width: 100%; background: none; border: none; border-bottom: 1px solid var(--border);
    padding: 10px 16px; text-align: left; font-size: 17px; font-family: inherit;
    color: var(--fg); cursor: pointer; transition: background 0.1s;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: var(--bg4); }

  /* Shell view area */
  #view {
    flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
  }
  .view-inner { max-width: 960px; margin: 0 auto; padding: 16px 12px; }

  /* Books view */
  .testaments { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .testament h2 {
    font-size: 18px; font-weight: 600; color: var(--fg2);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid var(--border2);
  }
  .testament { min-width: 0; }
  .testament ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .book-btn {
    display: block; width: 100%;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: inherit;
    color: var(--fg); cursor: pointer; text-align: left;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .book-btn:hover { border-color: var(--border3); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .book-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .book-name-en { font-size: 18px; line-height: 1.3; }
  .book-name-ko { font-size: 15px; color: var(--fg3); line-height: 1.3; }
  .book-btn.active .book-name-ko { color: #bbb; }

  /* Chapters view */
  .chapters-header { font-size: 22px; margin-bottom: 14px; color: var(--fg); }
  .chapter-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px;
  }
  .chapter-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 8px;
    padding: 14px 0; font-size: 19px; font-family: inherit; color: var(--fg);
    cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .chapter-btn:hover { background: var(--border2); border-color: var(--border3); }
  .chapter-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  /* Verses view */
  .verse { margin-bottom: 12px; font-size: 20px; line-height: 1.8; }
  .verse-num { font-size: 14px; font-weight: 700; color: var(--fg3); vertical-align: super; margin-right: 4px; }
  .footnote-toggle {
    display: inline-block; background: none; border: 1px solid var(--border3);
    border-radius: 4px; color: var(--fg3); font-size: 13px; font-family: inherit;
    padding: 1px 7px; margin-left: 4px; cursor: pointer; vertical-align: middle;
    transition: background 0.12s, color 0.12s;
  }
  .footnote-toggle:hover { background: var(--bg4); color: var(--fg2); }
  .footnote-toggle.open { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .footnote-body {
    display: none; margin: 6px 0 4px 20px; padding: 8px 12px;
    background: var(--note-bg); border-left: 3px solid var(--note-border);
    border-radius: 0 6px 6px 0; font-size: 17px; color: var(--fg2); line-height: 1.6;
  }
  .footnote-body.visible { display: block; }

  #error {
    display: none; background: var(--err-bg); color: var(--err-fg);
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
  }
  #loading { color: var(--fg3); font-size: 15px; padding: 40px 20px; text-align: center; }

  html.large-font .toolbar-title { font-size: 23px; }
  html.large-font .toolbar-btn { font-size: 19px; padding: 7px 14px; }
  html.large-font .nav-btn { font-size: 19px; padding: 7px 14px; }
  html.large-font .book-btn { padding: 12px 14px; }
  html.large-font .book-name-en { font-size: 22px; }
  html.large-font .book-name-ko { font-size: 18px; }
  html.large-font .testament h2 { font-size: 22px; }
  html.large-font .chapters-header { font-size: 26px; }
  html.large-font .chapter-btn { font-size: 23px; padding: 18px 0; }
  html.large-font .verse { font-size: 24px; line-height: 1.9; }
  html.large-font .verse-num { font-size: 17px; }
  html.large-font .footnote-toggle { font-size: 16px; }
  html.large-font .footnote-body { font-size: 20px; }
  html.large-font .history-item { font-size: 20px; padding: 12px 18px; }
  html.large-font .history-menu .hm-empty { font-size: 19px; }

</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-row">
    <span class="toolbar-title" id="nav-home" style="cursor:pointer;">📖 The Holy Bible</span>
    <span class="toolbar-spacer"></span>
    <button class="toolbar-btn" id="dark-btn" type="button">🌙</button>
    <button class="toolbar-btn" id="font-btn" type="button">Aa</button>
  </div>
  <div class="toolbar-row" id="toolbar-nav">
    <button class="nav-btn" id="nav-book" type="button">Books</button>
    <button class="nav-btn hidden" id="nav-chapter" type="button"></button>
    <span class="toolbar-spacer"></span>
    <div class="history-wrap">
      <button class="toolbar-btn" id="history-btn" type="button">📑</button>
      <div class="history-menu" id="history-menu"></div>
    </div>
  </div>
</div>

<div id="view">
  <div class="view-inner" id="view-inner">
    <div id="error"></div>
    <p id="loading">Loading&hellip;</p>
  </div>
</div>

<script>
(function () {
  var OT_COUNT = 39;
  var HISTORY_KEY = 'bible_history';
  var DARK_KEY = 'bible_dark';
  var FONT_KEY = 'bible_large_font';
  var MAX_HISTORY = 20;

  var viewEl = document.getElementById('view');
  var viewInner = document.getElementById('view-inner');
  var errorEl = document.getElementById('error');
  var loadingEl = document.getElementById('loading');
  var darkBtn = document.getElementById('dark-btn');
  var historyBtn = document.getElementById('history-btn');
  var historyMenu = document.getElementById('history-menu');
  var fontBtn = document.getElementById('font-btn');
  var navBookBtn = document.getElementById('nav-book');
  var navChapterBtn = document.getElementById('nav-chapter');

  var bibleData = null;
  var currentBook = null;
  var currentChapter = null;
  var booksHTML = null;

  var KO = {
    'Genesis':'\uCC3D\uC138\uAE30','Exodus':'\uCD9C\uC560\uAD7D\uAE30','Leviticus':'\uB808\uC704\uAE30',
    'Numbers':'\uBBFC\uC218\uAE30','Deuteronomy':'\uC2E0\uBA85\uAE30','Joshua':'\uC5EC\uD638\uC218\uC544',
    'Judges':'\uC0AC\uC0AC\uAE30','Ruth':'\uB8FF\uAE30','1 Samuel':'\uC0AC\uBB34\uC5D8\uC0C1',
    '2 Samuel':'\uC0AC\uBB34\uC5D8\uD558','1 Kings':'\uC5F4\uC655\uAE30\uC0C1','2 Kings':'\uC5F4\uC655\uAE30\uD558',
    '1 Chronicles':'\uC5ED\uB300\uC0C1','2 Chronicles':'\uC5ED\uB300\uD558','Ezra':'\uC5D0\uC2A4\uB77C',
    'Nehemiah':'\uB290\uD5E4\uBBF8\uC57C','Esther':'\uC5D0\uC2A4\uB354','Job':'\uC695\uAE30',
    'Psalms':'\uC2DC\uD3B8','Proverbs':'\uC7A0\uC5B8','Ecclesiastes':'\uC804\uB3C4\uC11C',
    'Song of Solomon':'\uC544\uAC00','Isaiah':'\uC774\uC0AC\uC57C','Jeremiah':'\uC608\uB808\uBBF8\uC57C',
    'Lamentations':'\uC608\uB808\uBBF8\uC57C \uC560\uAC00','Ezekiel':'\uC5D0\uC2A4\uACA4',
    'Daniel':'\uB2E4\uB2C8\uC5D8','Hosea':'\uD638\uC138\uC544','Joel':'\uC694\uC5D8',
    'Amos':'\uC544\uBAA8\uC2A4','Obadiah':'\uC624\uBC14\uB55C','Jonah':'\uC694\uB098',
    'Micah':'\uBBF8\uAC00','Nahum':'\uB098\uD6C8','Habakkuk':'\uD558\uBC15\uAD6D',
    'Zephaniah':'\uC2A4\uBC14\uB0D0','Haggai':'\uD559\uAC1C','Zechariah':'\uC2A4\uAC00\uB8CC',
    'Malachi':'\uB9D0\uB77C\uAE30',
    'Matthew':'\uB9C8\uD0DC\uBCF5\uC74C','Mark':'\uB9C8\uAC00\uBCF5\uC74C','Luke':'\uB204\uAC00\uBCF5\uC74C',
    'John':'\uC694\uD55C\uBCF5\uC74C','Acts':'\uC0AC\uB3C4\uD589\uC804','Romans':'\uB85C\uB9C8\uC11C',
    '1 Corinthians':'\uACE0\uB9B0\uB3C4\uC804\uC11C','2 Corinthians':'\uACE0\uB9B0\uB3C4\uD6C4\uC11C',
    'Galatians':'\uAC08\uB77C\uB514\uC544\uC11C','Ephesians':'\uC5D0\uBCA0\uC18C\uC11C',
    'Philippians':'\uBE4C\uB9BD\uBCF4\uC11C','Colossians':'\uACE8\uB85C\uC0C8\uC11C',
    '1 Thessalonians':'\uB370\uC0B4\uB85C\uB2C8\uAC00\uC804\uC11C','2 Thessalonians':'\uB370\uC0B4\uB85C\uB2C8\uAC00\uD6C4\uC11C',
    '1 Timothy':'\uB514\uBAA8\uB370\uC804\uC11C','2 Timothy':'\uB514\uBAA8\uB370\uD6C4\uC11C',
    'Titus':'\uB514\uB3C4\uC11C','Philemon':'\uBE4C\uB808\uBAAC\uC11C','Hebrews':'\uD788\uBE0C\uB9AC\uC11C',
    'James':'\uC57C\uACE0\uBCF4\uC11C','1 Peter':'\uBCA0\uB4DC\uB85C\uC804\uC11C','2 Peter':'\uBCA0\uB4DC\uB85C\uD6C4\uC11C',
    '1 John':'\uC694\uD55C1\uC11C','2 John':'\uC694\uD55C2\uC11C','3 John':'\uC694\uD55C3\uC11C',
    'Jude':'\uC720\uB2E4\uC11C','Revelation':'\uC694\uD55C\uACC4\uC2DC\uB85D'
  };
  function koName(en) { return KO[en] || ''; }

  // --- Dark mode ---
  function applyDark(on) {
    document.documentElement.classList.toggle('dark', on);
    darkBtn.textContent = on ? '☀\uFE0F' : '🌙';
    try { localStorage.setItem(DARK_KEY, on ? '1' : '0'); } catch(e) {}
  }
  var initDark = false;
  try { initDark = localStorage.getItem(DARK_KEY) === '1'; } catch(e) {}
  applyDark(initDark);
  darkBtn.addEventListener('click', function () {
    applyDark(!document.documentElement.classList.contains('dark'));
  });

  // --- Font size toggle ---
  function applyFont(large) {
    document.documentElement.classList.toggle('large-font', large);
    fontBtn.textContent = large ? 'Aa\u2013' : 'Aa+';
    try { localStorage.setItem(FONT_KEY, large ? '1' : '0'); } catch(e) {}
  }
  var initFont = false;
  try { initFont = localStorage.getItem(FONT_KEY) === '1'; } catch(e) {}
  applyFont(initFont);
  fontBtn.addEventListener('click', function () {
    applyFont(!document.documentElement.classList.contains('large-font'));
  });

  // --- History ---
  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch(e) {}
  }
  function pushHistory(book, ch) {
    var list = getHistory();
    var key = book + '|' + ch;
    list = list.filter(function (x) { return x !== key; });
    list.unshift(key);
    if (list.length > MAX_HISTORY) list = list.slice(0, MAX_HISTORY);
    saveHistory(list);
  }
  function renderHistoryMenu() {
    historyMenu.textContent = '';
    var list = getHistory();
    if (list.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'hm-empty';
      empty.textContent = 'No history yet';
      historyMenu.appendChild(empty);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      var parts = list[i].split('|');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'history-item';
      btn.textContent = parts[0] + ' ' + parts[1];
      btn.addEventListener('click', (function (book, ch) {
        return function () {
          historyMenu.classList.remove('open');
          if (bibleData && bibleData[book]) {
            showVersesView(book, parseInt(ch, 10));
          }
        };
      })(parts[0], parts[1]));
      historyMenu.appendChild(btn);
    }
  }
  historyBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    renderHistoryMenu();
    historyMenu.classList.toggle('open');
  });
  document.addEventListener('click', function () { historyMenu.classList.remove('open'); });
  historyMenu.addEventListener('click', function (e) { e.stopPropagation(); });

  // --- Footnotes ---
  var footnoteRe = /\{\[(\d+)\]\s*(.*?)\}/g;
  function parseVerse(raw) {
    var segments = [];
    var last = 0;
    var m;
    footnoteRe.lastIndex = 0;
    while ((m = footnoteRe.exec(raw)) !== null) {
      if (m.index > last) {
        segments.push({ type: 'text', value: raw.slice(last, m.index).replace(/  +/g, ' ') });
      }
      segments.push({ type: 'note', num: m[1], text: m[2] });
      last = footnoteRe.lastIndex;
    }
    if (last < raw.length) {
      segments.push({ type: 'text', value: raw.slice(last).replace(/  +/g, ' ') });
    }
    return segments;
  }

  // --- Update nav buttons ---
  function updateNav() {
    if (currentBook) {
      navBookBtn.textContent = currentBook;
      navBookBtn.classList.remove('hidden');
    } else {
      navBookBtn.classList.add('hidden');
    }
    if (currentBook && currentChapter) {
      navChapterBtn.textContent = currentChapter;
      navChapterBtn.classList.remove('hidden');
    } else {
      navChapterBtn.classList.add('hidden');
    }
  }

  // --- Browser history ---
  var navFromPop = false;

  function pushNav(state) {
    if (!navFromPop) {
      history.pushState(state, '');
    }
  }

  window.addEventListener('popstate', function (e) {
    if (!bibleData) return;
    var s = e.state;
    navFromPop = true;
    if (s && s.view === 'verses' && s.book && s.chapter) {
      showVersesView(s.book, s.chapter);
    } else if (s && s.view === 'chapters' && s.book) {
      showChaptersView(s.book);
    } else {
      showBooksView();
    }
    navFromPop = false;
  });

  // --- View: Books ---
  function showBooksView() {
    viewEl.scrollTop = 0;
    viewInner.textContent = '';
    currentBook = null;
    currentChapter = null;
    updateNav();
    pushNav({ view: 'books' });

    if (booksHTML) {
      viewInner.appendChild(booksHTML);
      return;
    }

    var data = bibleData;
    var books = Object.keys(data);
    var wrap = document.createElement('div');
    wrap.className = 'testaments';

    var otDiv = document.createElement('div');
    otDiv.className = 'testament';
    var otH = document.createElement('h2');
    otH.textContent = 'Old Testament';
    otDiv.appendChild(otH);
    var otUl = document.createElement('ul');
    otDiv.appendChild(otUl);

    var ntDiv = document.createElement('div');
    ntDiv.className = 'testament';
    var ntH = document.createElement('h2');
    ntH.textContent = 'New Testament';
    ntDiv.appendChild(ntH);
    var ntUl = document.createElement('ul');
    ntDiv.appendChild(ntUl);

    for (var i = 0; i < books.length; i++) {
      var bookName = books[i];
      var chapterCount = Object.keys(data[bookName]).length;
      var ul = i < OT_COUNT ? otUl : ntUl;
      createBookButton(bookName, i, chapterCount, ul);
    }

    wrap.appendChild(otDiv);
    wrap.appendChild(ntDiv);
    booksHTML = wrap;
    viewInner.appendChild(wrap);
  }

  // --- View: Chapters ---
  function showChaptersView(bookName) {
    viewEl.scrollTop = 0;
    viewInner.textContent = '';
    currentBook = bookName;
    currentChapter = null;
    updateNav();
    pushNav({ view: 'chapters', book: bookName });

    var chapterCount = Object.keys(bibleData[bookName]).length;
    var header = document.createElement('div');
    header.className = 'chapters-header';
    var ko = koName(bookName);
    header.textContent = (ko ? '(' + ko + ') ' : '') + bookName;
    viewInner.appendChild(header);

    var grid = document.createElement('div');
    grid.className = 'chapter-grid';
    for (var c = 1; c <= chapterCount; c++) {
      var btn = document.createElement('div');
      btn.className = 'chapter-btn';
      btn.textContent = c;
      btn.addEventListener('click', (function (book, ch) {
        return function () { showVersesView(book, ch); };
      })(bookName, c));
      grid.appendChild(btn);
    }
    viewInner.appendChild(grid);
  }

  // --- View: Verses ---
  function showVersesView(bookName, chapterNum) {
    viewEl.scrollTop = 0;
    viewInner.textContent = '';
    currentBook = bookName;
    currentChapter = chapterNum;
    updateNav();
    pushNav({ view: 'verses', book: bookName, chapter: chapterNum });
    pushHistory(bookName, chapterNum);

    var chapters = bibleData[bookName];
    var verses = chapters[String(chapterNum)];
    var keys = Object.keys(verses);

    for (var i = 0; i < keys.length; i++) {
      var segments = parseVerse(verses[keys[i]]);
      var div = document.createElement('div');
      div.className = 'verse';

      var p = document.createElement('p');
      var sup = document.createElement('span');
      sup.className = 'verse-num';
      sup.textContent = keys[i];
      p.appendChild(sup);

      var noteBodies = [];
      for (var s = 0; s < segments.length; s++) {
        var seg = segments[s];
        if (seg.type === 'text') {
          p.appendChild(document.createTextNode(seg.value));
        } else {
          var noteBtn = document.createElement('button');
          noteBtn.type = 'button';
          noteBtn.className = 'footnote-toggle';
          noteBtn.textContent = '\u2020' + seg.num;

          var noteBody = document.createElement('div');
          noteBody.className = 'footnote-body';
          noteBody.textContent = '[' + seg.num + '] ' + seg.text;

          noteBtn.addEventListener('click', (function (btn, body) {
            return function () {
              var open = body.className.indexOf('visible') !== -1;
              body.className = open ? 'footnote-body' : 'footnote-body visible';
              btn.className = open ? 'footnote-toggle' : 'footnote-toggle open';
            };
          })(noteBtn, noteBody));

          p.appendChild(noteBtn);
          noteBodies.push(noteBody);
        }
      }

      div.appendChild(p);
      for (var nb = 0; nb < noteBodies.length; nb++) {
        div.appendChild(noteBodies[nb]);
      }
      viewInner.appendChild(div);
    }
  }

  // --- Book button factory ---
  function createBookButton(bookName, index, chapterCount, list) {
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.type = 'button';

    var enSpan = document.createElement('div');
    enSpan.className = 'book-name-en';
    enSpan.textContent = bookName;
    btn.appendChild(enSpan);

    var ko = koName(bookName);
    if (ko) {
      var koSpan = document.createElement('div');
      koSpan.className = 'book-name-ko';
      koSpan.textContent = ko;
      btn.appendChild(koSpan);
    }

    btn.addEventListener('click', function () {
      showChaptersView(bookName);
    });

    li.appendChild(btn);
    list.appendChild(li);
  }

  // --- Nav button handlers ---
  document.getElementById('nav-home').addEventListener('click', function () {
    if (bibleData) showBooksView();
  });
  navBookBtn.addEventListener('click', function () {
    if (bibleData && currentBook) showChaptersView(currentBook);
  });

  // --- Load data ---
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'bible.json', true);
  xhr.responseType = 'json';

  xhr.onload = function () {
    loadingEl.style.display = 'none';
    if (xhr.status !== 200 || !xhr.response) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Failed to load bible.json (status ' + xhr.status + ').';
      return;
    }
    bibleData = xhr.response;
    history.replaceState({ view: 'books' }, '');
    navFromPop = true;
    showBooksView();
    navFromPop = false;
  };

  xhr.onerror = function () {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Network error loading bible.json.';
  };

  xhr.send();

  // --- Register Service Worker ---
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
