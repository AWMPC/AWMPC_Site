  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; max-width: 100%; overflow-x: hidden; overflow-y: hidden; }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  body {
    font-family: var(--oneui-font);
    font-size: var(--text-16);
    background: var(--bg); color: var(--fg); line-height: 1.6;
    display: flex; flex-direction: column;
    -webkit-font-smoothing: antialiased;
    white-space: nowrap;
  }
  button,
  .dd-item,
  .book-btn,
  .chapter-btn {
    -webkit-tap-highlight-color: transparent;
    transition-property: background, border-color, box-shadow, color, transform;
    transition-duration: 180ms, 180ms, 180ms, 180ms, 120ms;
    transition-timing-function: var(--motion-ease);
  }
  button,
  input,
  select,
  [role="button"] {
    min-width: 24px;
    min-height: 24px;
  }
  button:hover,
  button:focus-visible,
  .dd-item:hover,
  .dd-item:focus-visible,
  .book-btn:hover,
  .book-btn:focus-visible,
  .chapter-btn:hover,
  .chapter-btn:focus-visible {
    transition-duration: 220ms;
  }
  html.theme-transitioning,
  html.theme-transitioning body,
  html.theme-transitioning .bottom-chrome,
  html.theme-transitioning .floating-nav,
  html.theme-transitioning .action-chrome,
  html.theme-transitioning .fab-panel,
  html.theme-transitioning .fab-card,
  html.theme-transitioning .bottom-history-menu,
  html.theme-transitioning .dd-item,
  html.theme-transitioning .setting-select,
  html.theme-transitioning .book-btn,
  html.theme-transitioning .chapter-btn,
  html.theme-transitioning .verse,
  html.theme-transitioning .search-result {
    transition-property: background, background-color, border-color, box-shadow, color, opacity, transform;
    transition-duration: 200ms;
    transition-timing-function: var(--motion-ease);
  }
  .press-ripple-host {
    position: relative;
    overflow: hidden;
    isolation: isolate;
  }
  .press-ripple {
    position: absolute;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    pointer-events: none;
    background: color-mix(in srgb, var(--accent) 32%, transparent);
    transform: translate(-50%, -50%) scale(0);
    animation: press-ripple 320ms var(--motion-ease) forwards;
  }
  @keyframes press-ripple {
    0% { opacity: .42; transform: translate(-50%, -50%) scale(0); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(var(--ripple-scale, 16)); }
  }
  .marquee-line {
    display: block;
    min-width: 0;
    max-width: 100%;
    overflow: hidden;
    white-space: nowrap;
  }
  @property --marquee-left-fade {
    syntax: '<length>';
    inherits: false;
    initial-value: 14px;
  }
  @property --marquee-right-fade {
    syntax: '<length>';
    inherits: false;
    initial-value: 14px;
  }
  .marquee-line.is-marquee {
    --marquee-left-fade: 0px;
    --marquee-right-fade: 14px;
    mask-image: linear-gradient(90deg, transparent 0, #000 var(--marquee-left-fade), #000 calc(100% - var(--marquee-right-fade)), transparent 100%);
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 var(--marquee-left-fade), #000 calc(100% - var(--marquee-right-fade)), transparent 100%);
    animation: marquee-mask-breathe 3s var(--motion-ease) infinite alternate;
  }
  .marquee-text {
    display: inline-block;
    max-width: none;
    white-space: nowrap;
    will-change: transform;
  }
  .marquee-line.is-marquee .marquee-text {
    animation: marquee-sway 3s var(--motion-ease) infinite alternate;
  }
  @keyframes marquee-mask-breathe {
    0%, 18% {
      --marquee-left-fade: 0px;
      --marquee-right-fade: 14px;
    }
    44%, 56% {
      --marquee-left-fade: 14px;
      --marquee-right-fade: 14px;
    }
    82%, 100% {
      --marquee-left-fade: 14px;
      --marquee-right-fade: 0px;
    }
  }
  @keyframes marquee-sway {
    from { transform: translateX(0); }
    to { transform: translateX(calc(var(--marquee-distance, 0px) * -1)); }
  }
  button:active,
  .dd-item:active,
  .book-btn:active,
  .chapter-btn:active {
    transform: scale(.975);
    transition-duration: 80ms;
  }
  button:disabled {
    transform: none;
  }

  /* Responsive chrome viewport layer */
  .bottom-chrome {
    position: fixed;
    inset: 0;
    z-index: 125;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: var(--display-panel-gap);
    padding: 0 12px calc(8px + env(safe-area-inset-bottom, 0px));
    overflow: visible;
    pointer-events: none;
    color: var(--float-nav-fg);
  }
  .bottom-chrome.scroll-hidden .floating-nav {
    transform: translateY(calc(100% + 18px + env(safe-area-inset-bottom, 0px)));
    opacity: 0;
  }
  .bottom-chrome.scroll-hidden .action-chrome {
    transform: translateY(calc(100% + 18px + env(safe-area-inset-bottom, 0px)));
    opacity: 0;
  }

  /* Floating chapter nav */
  .floating-nav {
    display: flex; align-items: center; justify-content: flex-start; gap: min(6px, var(--display-nav-padding));
    position: static;
    transform: translateY(0);
    width: auto;
    max-width: min(720px, calc(100% - 180px));
    min-width: 0;
    flex: 0 1 auto;
    min-height: var(--display-control-height);
    z-index: 120;
    pointer-events: auto;
    background: var(--float-nav-bg); color: inherit;
    border: var(--card-border);
    border-radius: var(--radius-md); padding: var(--display-nav-padding);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    transition-property: transform, opacity;
    transition-duration: var(--chrome-motion);
    transition-timing-function: var(--motion-ease);
  }
  .floating-nav.hidden { display: none; }
  .floating-nav button {
    background: var(--surface); border: 1px solid var(--border);
    color: inherit; font-size: var(--display-control-font-size); font-family: inherit; border-radius: var(--radius-xs);
    padding: var(--display-control-pad-y) var(--display-control-pad-x); cursor: pointer;
    height: var(--display-control-height); min-height: var(--display-control-height); box-sizing: border-box;
    box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; line-height: 1.15; white-space: nowrap; overflow: hidden;
  }
  .floating-nav button:hover,
  .floating-nav button:focus-visible {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--hover-bg);
    outline: none;
  }
  .floating-nav button:disabled {
    opacity: 0.35; cursor: not-allowed;
  }
  .floating-nav .fn-book {
    flex: 0 1 auto; flex-basis: var(--floating-nav-book-width); width: var(--floating-nav-book-width); max-width: var(--floating-nav-book-width);
    font-weight: 600; min-width: 0; overflow: hidden; white-space: nowrap;
  }
  .floating-nav .fn-book .marquee-line { width: 100%; }
  .floating-nav .fn-chapter,
  .floating-nav .fn-verse {
    font-weight: 600; min-width: 44px;
  }
  .bottom-actions {
    display: flex; align-items: center; justify-content: center; gap: var(--display-panel-gap);
    position: relative;
    flex: 0 0 auto;
    min-height: var(--display-control-height);
    z-index: 121;
    background: transparent; color: inherit;
    border: 0; border-radius: var(--radius-sm); padding: 0;
    box-shadow: none;
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }
  .action-chrome {
    position: static;
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: var(--display-panel-gap);
    min-height: calc(var(--display-control-height) + (var(--display-nav-padding) * 2));
    padding: var(--display-nav-padding);
    pointer-events: auto;
    background: var(--float-nav-bg);
    border: var(--card-border);
    border-radius: var(--radius-md);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    transform: translateY(0);
    transition-property: transform, opacity;
    transition-duration: var(--chrome-motion);
    transition-timing-function: var(--motion-ease);
  }
  .bottom-action-button {
    height: var(--display-control-height); min-height: var(--display-control-height); box-sizing: border-box;
    border-radius: var(--radius-xs); border: 1px solid var(--border);
    background: var(--surface); color: inherit; font: inherit; font-size: var(--display-control-font-size);
    padding: var(--display-control-pad-y) var(--display-control-pad-x); cursor: pointer; box-shadow: var(--shadow);
    display: inline-flex; align-items: center; justify-content: center; line-height: 1.15; white-space: nowrap; overflow: hidden;
  }
  .bottom-action-button:hover,
  .bottom-action-button:focus-visible {
    color: var(--accent); border-color: var(--accent); background: var(--hover-bg); outline: none;
  }
  .bottom-history-menu {
    position: fixed;
    right: 12px;
    bottom: var(--bottom-chrome-clearance);
    width: min(420px, calc(100vw - 24px));
    max-width: 100%;
    max-height: calc(100dvh - var(--bottom-chrome-clearance) - 12px);
    display: grid;
    grid-auto-rows: minmax(0, auto);
    gap: var(--display-panel-gap);
    overflow-y: auto;
    overscroll-behavior: contain;
    padding: var(--display-panel-padding);
    background: var(--float-nav-bg);
    border: var(--card-border);
    border-radius: var(--radius-sm);
    box-shadow: var(--float-nav-shadow);
    backdrop-filter: var(--hdr-blur);
    -webkit-backdrop-filter: var(--hdr-blur);
    isolation: isolate;
    z-index: 132;
    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transform: translateY(6px) scale(.98);
    transition-property: opacity, transform, visibility;
    transition-duration: 180ms, 180ms, 0s;
    transition-delay: 0s, 0s, 180ms;
    transition-timing-function: var(--motion-ease);
  }
  .bottom-history-menu.open {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
    transform: translateY(0) scale(1);
    transition-property: opacity, transform, visibility;
    transition-duration: 180ms, 180ms, 0s;
    transition-delay: 0s;
    transition-timing-function: var(--motion-ease);
  }
  .bottom-history-menu .dd-item {
    min-width: 0;
    min-height: 24px;
    align-items: center;

  function cubicVerseEase(progress) {
    var targetX = Math.min(1, Math.max(0, progress));
    if (targetX === 0 || targetX === 1) return targetX;
    var lower = 0;
    var upper = 1;
    var t = .5;
    for (var iteration = 0; iteration < 20; iteration += 1) {
      t = (lower + upper) / 2;
      var inverseT = 1 - t;
      var x = (3 * inverseT * inverseT * t * .64) + (3 * inverseT * t * t * .36) + (t * t * t);
      if (x === targetX) break;
      if (x < targetX) lower = t;
      else upper = t;
    }
    var inverseT = 1 - t;
    return (3 * inverseT * t * t) + (t * t * t);
  }

  function verseChaseDurationForDistance(distance) {
    return Math.min(820, Math.max(350, 300 + Math.abs(distance) * 0.85));
  }

  function stopVerseChase() {
    if (verseChaseFrame !== null) cancelAnimationFrame(verseChaseFrame);
    verseChaseFrame = null;

    verseChaseStartTop = 0;
    verseChaseDestinationTop = 0;
    verseChaseStartTime = null;
    verseChaseDuration = 0;

  function setVerseChaseTarget(target) {
    if (!target) return;

      viewEl.scrollTop = desiredVerseScrollTop(target);
      stopVerseChase();
      return;
    }
    keepVerseChaseTargetVisible(target);
    verseChaseTarget = target;
    verseChaseStartTop = viewEl.scrollTop;
    verseChaseDestinationTop = desiredVerseScrollTop(target);
    var distance = verseChaseDestinationTop - verseChaseStartTop;
    if (Math.abs(distance) < 0.5) {
      viewEl.scrollTop = verseChaseDestinationTop;
      stopVerseChase();
      return;
    }
    verseChaseStartTime = null;
    verseChaseDuration = verseChaseDurationForDistance(distance);

  }

    var progress = Math.min(1, Math.max(0, (ts - verseChaseStartTime) / verseChaseDuration));
    var eased = cubicVerseEase(progress);
    viewEl.scrollTop = verseChaseStartTop + ((verseChaseDestinationTop - verseChaseStartTop) * eased);

    var metrics = readingViewportMetrics();

    var bestDist = Infinity;
    for (var i = 0; i < verses.length; i++) {

  function directionalDistance(currentRect, rect, key) {
    var currentX = currentRect.left + (currentRect.width / 2);
    var currentY = currentRect.top + (currentRect.height / 2);
    var x = rect.left + (rect.width / 2);
    var y = rect.top + (rect.height / 2);
    var dx = x - currentX;
    var dy = y - currentY;
    var primary;
    var cross;
    if (key === 'ArrowLeft') {
      if (dx >= -1) return Infinity;
      primary = Math.abs(dx);
      cross = Math.abs(dy);
    } else if (key === 'ArrowRight') {
      if (dx <= 1) return Infinity;
      primary = Math.abs(dx);
      cross = Math.abs(dy);
    } else if (key === 'ArrowUp') {
      if (dy >= -1) return Infinity;
      primary = Math.abs(dy);
      cross = Math.abs(dx);
    } else if (key === 'ArrowDown') {
      if (dy <= 1) return Infinity;
      primary = Math.abs(dy);
      cross = Math.abs(dx);

    return (primary * primary) + (cross * cross * 2);

    var currentRect = current.getBoundingClientRect();
    var best = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i] === current || items[i].disabled) continue;
      var rect = items[i].getBoundingClientRect();
      if (!rect.width || !rect.height) continue;
      var candidate = { el: items[i], score: Infinity };
      candidate.score = directionalDistance(currentRect, rect, key);
      if (candidate.score < Infinity && (!best || candidate.score < best.score)) {
        best = candidate;
      }

    if (!best) return false;
    best.el.focus();
    return true;
  }

  function normalizeSearchText(raw) {
    var t = String(raw).replace(footnoteStripRe, '').replace(/  +/g, ' ');
    t = t.toLowerCase();
    try {
      return t.replace(/[^\p{L}\p{N}]+/gu, '');
    } catch (e) {
      return t.replace(/[^a-z0-9]+/gi, '');
    }
  }

  /** Map first normalized match of qn in raw (footnote-stripped) to [start,end) indices in that same string. */
  function findNormMatchInRaw(raw, qn) {
    var stripped = String(raw).replace(footnoteStripRe, '').replace(/  +/g, ' ');
    var normFull = normalizeSearchText(stripped);
    var pos = normFull.indexOf(qn);
    if (pos === -1) return null;
    var lower = stripped.toLowerCase();
    var built = 0;
    var rawStart = -1;
    var i = 0;
    while (i < lower.length) {
      var cp = lower.codePointAt(i);
      var w = cp > 0xffff ? 2 : 1;
      var ch = String.fromCodePoint(cp);
      var isWord = false;
      try {
        isWord = /^[\p{L}\p{N}]$/u.test(ch);
      } catch (e) {
        isWord = /[a-z0-9]/i.test(ch);
      }
      if (isWord) {
        if (built === pos) rawStart = i;
        built++;
        if (built === pos + qn.length) {
          return { start: rawStart, end: i + w };
        }
      }
      i += w;
    }
    return null;
  }

  function buildSearchIndex() {
    if (searchIndex) return;
    searchIndex = [];
    var books = Object.keys(bibleData);
    for (var b = 0; b < books.length; b++) {
      var chs = bibleData[books[b]];
      var chKeys = Object.keys(chs);
      for (var c = 0; c < chKeys.length; c++) {
        var vs = chs[chKeys[c]];
        var vKeys = Object.keys(vs);
        for (var v = 0; v < vKeys.length; v++) {
          var txt = resolvedVerseSource(vs, vKeys[v]);
          searchIndex.push({
            book: books[b], ch: chKeys[c], v: vKeys[v],
            text: txt,
            lower: txt.toLowerCase(),
            norm: normalizeSearchText(txt)
          });
        }
      }
    }
  }

    });

        }
      }
    });

  function runSearch(query, countEl, resultsEl) {
    resultsEl.textContent = '';
    var q = query.trim();
    if (q.length < 2) { countEl.textContent = ''; return; }
    var qn = normalizeSearchText(q);
    if (qn.length < 2) { countEl.textContent = ''; return; }

    var results = [];
    var max = 200;
    for (var i = 0; i < searchIndex.length && results.length < max; i++) {
      if (searchIndex[i].norm.indexOf(qn) !== -1) results.push(searchIndex[i]);
    }

    countEl.textContent = results.length >= max ? max + '+ results' : results.length + ' result' + (results.length !== 1 ? 's' : '');

    var qLow = q.toLowerCase();
    for (var r = 0; r < results.length; r++) {
      var item = results[r];
      var div = document.createElement('button');
      div.type = 'button';
      div.className = 'search-result';

      var ref = document.createElement('span');
      ref.className = 'search-ref';
      ref.textContent = item.book + ' ' + item.ch + ':' + item.v;
      div.appendChild(ref);

      var text = document.createElement('span');
      text.className = 'search-text';
      var raw = item.text.replace(footnoteStripRe, '').replace(/  +/g, ' ');
      var range = findNormMatchInRaw(raw, qn);
      var idx = range ? range.start : 0;
      var markLen = range ? (range.end - range.start) : Math.min(20, raw.length);
      if (!range && raw.length) {
        var rawLower = raw.toLowerCase();
        var words = qLow.split(/\s+/).filter(Boolean);
        if (words.length) {
          var wi = rawLower.indexOf(words[0]);
          if (wi >= 0) {
            idx = wi;
            markLen = words[0].length;
          }
        }
      }
      var start = Math.max(0, idx - 40);
      var end = Math.min(raw.length, idx + markLen + 40);
      var snippet = (start > 0 ? '\u2026' : '') + raw.slice(start, end) + (end < raw.length ? '\u2026' : '');
      var rel = idx - start + (start > 0 ? 1 : 0);
      var before = snippet.slice(0, rel);
      var match = snippet.slice(rel, rel + markLen);
      var after = snippet.slice(rel + markLen);
      text.appendChild(document.createTextNode(before));
      var mark = document.createElement('mark');
      mark.textContent = match;
      text.appendChild(mark);
      text.appendChild(document.createTextNode(after));
      div.appendChild(text);

      div.addEventListener('click', (function (book, ch, verse) {
        return function () { showVersesView(book, parseInt(ch, 10), verse); };
      })(item.book, item.ch, item.v));
      resultsEl.appendChild(div);
    }
  }

  function loadBibleData() {
    if (bibleLoadRequest || bibleStartupComplete) return;
    bibleLoadGeneration += 1;

    xhr.timeout = 15000;

    xhr.onload = function () {
      if (generation !== bibleLoadGeneration || bibleLoadRequest !== xhr) return;
      bibleLoadRequest = null;
      if (xhr.status !== 200 || !xhr.response) {
        showLoadError('Unable to load Bible data.');
        return;
      }
      loadingEl.style.display = 'none';
      bibleData = xhr.response;
      initNavAnchor();
      if (bibleStartupComplete) return;
      bibleStartupComplete = true;
      openInitialViewFromUrl();
    };

    xhr.onerror = function () {
      if (generation !== bibleLoadGeneration || bibleLoadRequest !== xhr) return;
      bibleLoadRequest = null;
      showLoadError('Network error while loading Bible data.');
    };

    xhr.ontimeout = function () {
      if (generation !== bibleLoadGeneration || bibleLoadRequest !== xhr) return;
      bibleLoadRequest = null;
      showLoadError('Bible data took too long to load.');
    };

    xhr.onabort = function () {
      if (generation !== bibleLoadGeneration || bibleLoadRequest !== xhr) return;
      bibleLoadRequest = null;
      showLoadError('Bible data loading was interrupted.');
    };

    xhr.send();
  }

  loadBibleData();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
