<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AWMPC Bible">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="resources/images/bible-icon-192.png">
<title>AWMPC Bible</title>
<style>
  :root {
    --reader-font-size: 20px;
    --reader-line-height: 1.8;
    --bg: #f5f5f5; --bg2: #fff; --bg3: #fafaf8; --bg4: #f0f0f0;
    --fg: #222; --fg2: #555; --fg3: #707070; --fg4: #6b6b6b;
    --verse-num: #555;
    --border: #e0e0e0; --border2: #ddd; --border3: #ccc;
    --accent: #1a1a2e; --accent-fg: #fff;
    --note-bg: #f0efe8; --note-border: #c5b358;
    --err-bg: #ffeaea; --err-fg: #a00;
    --fab-bg: #1a1a2e; --fab-fg: #e0e0e0;
    --float-nav-bg: rgba(26, 26, 46, 0.94);
    --float-nav-fg: #fff;
  }
  html.dark {
    --bg: #121212; --bg2: #1e1e1e; --bg3: #1a1a1a; --bg4: #2a2a2a;
    --fg: #e0e0e0; --fg2: #aaa; --fg3: #959595; --fg4: #929292;
    --verse-num: #b8b8b8;
    --border: #333; --border2: #444; --border3: #555;
    --accent: #3a3a5e; --accent-fg: #fff;
    --note-bg: #2a2820; --note-border: #8a7a30;
    --err-bg: #3a1010; --err-fg: #f88;
    --fab-bg: #0a0a18; --fab-fg: #ccc;
    --float-nav-bg: rgba(10, 10, 24, 0.94);
    --float-nav-fg: #e8e8e8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    display: flex; flex-direction: column;
  }

  /* Bottom chrome: chapter bar + FAB (single row, shared safe-area) */
  .bottom-chrome {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 125;
    display: flex;
    flex-direction: row;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 10px;
    padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
    min-height: calc(52px + 16px + env(safe-area-inset-bottom, 0px));
    overflow: visible;
    pointer-events: none;
  }
  .bottom-chrome > * { pointer-events: auto; }

  /* Floating chapter nav */
  .floating-nav {
    display: flex; align-items: center; justify-content: center; gap: 4px;
    position: relative;
    left: auto;
    transform: none;
    flex: 0 1 auto;
    width: max-content;
    max-width: calc(100vw - 24px - 62px);
    min-width: 0;
    min-height: 52px;
    margin-right: auto;
    z-index: 120;
    background: var(--float-nav-bg); color: var(--float-nav-fg);
    border-radius: 12px; padding: 6px 8px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.22);
  }
  .floating-nav.hidden { display: none; }
  .floating-nav button {
    background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.25);
    color: inherit; font-size: 15px; font-family: inherit; border-radius: 8px;
    padding: 8px 10px; cursor: pointer; min-height: 40px;
  }
  .floating-nav button:disabled {
    opacity: 0.35; cursor: not-allowed;
  }
  .floating-nav .fn-book {
    font-weight: 600; max-width: 42vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .floating-nav .fn-chapter {
    font-weight: 600; min-width: 36px;
  }
  .floating-nav .fn-verse {
    font-weight: 600; min-width: 44px;
  }

  /* FAB */
  .fab-root {
    position: relative;
    right: auto;
    bottom: auto;
    flex-shrink: 0;
    z-index: 130;
    overflow: visible;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    justify-content: flex-end;
    gap: 0;
    min-height: 52px;
  }
  .fab-main {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--fab-bg); color: var(--fab-fg);
    border: 2px solid rgba(255,255,255,0.25);
    font-size: 22px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
  }
  .fab-main:hover { filter: brightness(1.08); }
  .fab-panel {
    display: none;
    position: absolute;
    right: 0;
    bottom: calc(100% + 8px);
    z-index: 131;
    width: min(360px, calc(100vw - 24px));
    max-height: calc(100dvh - 96px - env(safe-area-inset-bottom, 0px));
    overflow: hidden;
    flex-direction: column;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.2);
  }
  .fab-panel.open { display: flex; }
  .fab-history-menu { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .fab-section-label {
    font-size: 12px; font-weight: 600; color: var(--fg3); text-transform: uppercase;
    letter-spacing: 0.5px; padding: 8px 16px 4px;
  }

  /* Dropdown menus (shared) */
  .dd-wrap { position: relative; flex-shrink: 0; }
  .dd-menu {
    display: none; position: absolute; top: 100%; margin-top: 6px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); min-width: 220px; max-height: 380px;
    overflow-y: auto; z-index: 110;
  }
  .dd-menu.open { display: block; }
  .dd-menu.right { right: 0; }
  .dd-menu.left { left: 0; }
  .dd-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--border);
    padding: 12px 16px; text-align: left; font-size: 17px; font-family: inherit;
    color: var(--fg); cursor: pointer; transition: background 0.1s;
  }
  .dd-item:last-child { border-bottom: none; }
  .dd-item:hover { background: var(--bg4); }
  .dd-item .dd-icon { flex-shrink: 0; width: 24px; text-align: center; }
  .dd-item .dd-label { flex: 1; }
  .dd-item .dd-value { color: var(--fg3); font-size: 14px; flex-shrink: 0; }
  .dd-empty { padding: 16px; color: var(--fg3); font-size: 15px; text-align: center; }
  .theme-mode-wrap {
    display: grid; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .theme-mode-label { font-size: 17px; color: var(--fg); }
  .theme-mode-control {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    padding: 4px; border: 1px solid var(--border2); border-radius: 8px; background: var(--bg4);
  }
  .theme-mode-button {
    min-height: 36px; border: 0; border-radius: 6px; background: transparent;
    color: var(--fg2); font: inherit; cursor: pointer;
  }
  .theme-mode-button.active {
    background: var(--bg2); color: var(--fg); box-shadow: 0 1px 4px rgba(0,0,0,0.14);
  }
  .font-slider-wrap {
    display: grid; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  .font-slider-row { display: flex; align-items: center; gap: 12px; }
  .font-slider-row label { flex: 1; font-size: 17px; color: var(--fg); }
  .font-slider-row output { min-width: 54px; text-align: right; color: var(--fg3); font-size: 14px; }
  .font-slider {
    width: 100%;
    accent-color: var(--accent);
  }
  .font-slider-track {
    position: relative;
    padding-bottom: 22px;
  }
  .font-slider-ticks {
    position: absolute;
    left: 0;
    right: 0;
    top: 26px;
    height: 20px;
    color: var(--fg4);
    font-size: 12px;
    line-height: 1.2;
    pointer-events: none;
  }
  .font-slider-ticks span {
    position: absolute;
    top: 0;
    transform: translateX(-50%);
    text-align: center;
  }
  .font-slider-ticks span::before {
    content: "";
    display: block;
    width: 1px;
    height: 8px;
    margin: 0 auto 3px;
    background: var(--border3);
  }
  .app-version {
    flex: 0 0 auto;
    padding: 12px 16px 0;
    color: var(--fg4);
    font-size: 12px;
    text-align: center;
  }

  /* Shell view area */
  #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; }
  .view-inner {
    max-width: 960px; margin: 0 auto;
    padding: 16px 12px;
    padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
    opacity: 1;
    transition: opacity 520ms ease-in-out;
  }
  .view-inner.chapter-transition-ready { opacity: 0; transition: none; }
  .view-inner.chapter-transition-ready.chapter-transition-in { opacity: 1; transition: opacity 520ms ease-in-out; }
  .view-inner.chapter-transition-retiring {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 2;
    opacity: 1;
    pointer-events: none;
  }
  .view-inner.chapter-transition-retiring.chapter-transition-out { opacity: 0; }

  /* Books view */
  .testaments { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .testament h2 {
    font-size: 18px; font-weight: 600; color: var(--fg2);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid var(--border2);
  }
  .testament { min-width: 0; }
  .testament ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .book-btn {
    display: block; width: 100%;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: inherit;
    color: var(--fg); cursor: pointer; text-align: left;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .book-btn:hover { border-color: var(--border3); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .book-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .book-name-en { font-size: 18px; line-height: 1.3; }
  .book-name-ko { font-size: 15px; color: var(--fg3); line-height: 1.3; }
  .book-btn.active .book-name-ko { color: #bbb; }

  /* Chapters view */
  .chapters-header { font-size: 22px; margin-bottom: 14px; color: var(--fg); }
  .chapter-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px;
  }
  .chapter-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 8px;
    padding: 14px 0; font-size: 19px; font-family: inherit; color: var(--fg);
    cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .chapter-btn:hover { background: var(--border2); border-color: var(--border3); }
  .chapter-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .verse-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(58px, 1fr)); gap: 8px;
  }

  /* Verses view */
  .verse {
    margin-bottom: 12px; font-size: var(--reader-font-size); line-height: var(--reader-line-height); position: relative;
    border-radius: 8px; padding: 4px 6px; border: 2px solid transparent;
    transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .verse.active {
    background: rgba(26, 26, 46, 0.07);
    border-color: rgba(26, 26, 46, 0.36);
    box-shadow: 0 4px 18px rgba(26, 26, 46, 0.08);
  }
  .verse.highlight {
    background: rgba(197, 160, 50, 0.18);
    border-color: rgba(197, 160, 50, 0.6);
    box-shadow: 0 0 18px rgba(197, 160, 50, 0.35), inset 0 0 8px rgba(197, 160, 50, 0.1);
  }
  .verse.highlight-fade {
    transition: background 1.5s ease-out, border-color 1.5s ease-out, box-shadow 1.5s ease-out;
    background: transparent; border-color: transparent; box-shadow: none;
  }
  html.dark .verse.highlight {
    background: rgba(224, 192, 48, 0.15);
    border-color: rgba(224, 192, 48, 0.5);
    box-shadow: 0 0 22px rgba(224, 192, 48, 0.3), inset 0 0 8px rgba(224, 192, 48, 0.08);
  }
  html.dark .verse.active {
    background: rgba(255, 255, 255, 0.08);
    border-color: rgba(255, 255, 255, 0.28);
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.22);
  }
  .verse-num { font-size: 14px; font-weight: 700; color: var(--verse-num); vertical-align: super; margin-right: 4px; }
  .verse-edge-spacer,
  .verse-head-spacer,
  .verse-tail-spacer { height: 50vh; pointer-events: none; }
  .footnote-toggle {
    display: inline-block; background: none; border: 1px solid var(--border3);
    border-radius: 4px; color: var(--fg3); font-size: 13px; font-family: inherit;
    padding: 1px 7px; margin-left: 4px; cursor: pointer; vertical-align: middle;
    transition: background 0.12s, color 0.12s;
  }
  .footnote-toggle:hover { background: var(--bg4); color: var(--fg2); }
  .footnote-toggle.open { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .footnote-body {
    display: none; margin: 6px 0 4px 20px; padding: 8px 12px;
    background: var(--note-bg); border-left: 3px solid var(--note-border);
    border-radius: 0 6px 6px 0; font-size: 17px; color: var(--fg2); line-height: 1.6;
  }
  .footnote-body.visible { display: block; }

  /* Search view */
  .search-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .search-input {
    flex: 1; font-size: 18px; font-family: inherit; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg2); color: var(--fg); outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--fg4); }
  .search-count { font-size: 15px; color: var(--fg3); margin-bottom: 12px; }
  .search-hist-label {
    font-size: 14px; font-weight: 600; color: var(--fg3); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .search-hist-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 5px; cursor: pointer; transition: background 0.1s;
  }
  .search-hist-item:hover { background: var(--bg4); }
  .search-hist-item .sh-query { flex: 1; font-size: 17px; color: var(--fg); }
  .search-hist-item .sh-remove {
    background: none; border: none; color: var(--fg4); font-size: 16px;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  .search-hist-item .sh-remove:hover { color: var(--err-fg); }
  .search-hist-clear {
    display: inline-block; font-size: 14px; color: var(--fg3); cursor: pointer;
    margin-top: 8px; padding: 4px 0; border: none; background: none; font-family: inherit;
  }
  .search-hist-clear:hover { color: var(--err-fg); }
  .search-result {
    padding: 12px; margin-bottom: 8px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    transition: background 0.1s;
  }
  .search-result:hover { background: var(--bg4); }
  .search-ref { font-size: 14px; font-weight: 600; color: var(--accent-fg); background: var(--accent);
    display: inline-block; padding: 2px 8px; border-radius: 4px; margin-bottom: 4px; }
  html.dark .search-ref { color: var(--accent-fg); background: var(--accent); }
  .search-text { font-size: 16px; color: var(--fg2); }
  .search-text mark { background: #fff3a8; color: #222; border-radius: 2px; padding: 0 1px; }
  html.dark .search-text mark { background: #5a4a00; color: #e0e0e0; }

  #error {
    display: none; background: var(--err-bg); color: var(--err-fg);
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
  }
  #loading { color: var(--fg3); font-size: 15px; padding: 40px 20px; text-align: center; }

  /* Auth UI */
  .profile-avatar {
    width: 28px; height: 28px; border-radius: 50%; vertical-align: middle;
    border: 1.5px solid rgba(255,255,255,0.4);
  }
  .fab-main .profile-avatar {
    width: 36px; height: 36px; border-color: rgba(255,255,255,0.35);
  }
  .dd-user {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .dd-user-photo { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
  .dd-user-info { flex: 1; min-width: 0; }
  .dd-user-name { font-size: 15px; font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-user-email { font-size: 12px; color: var(--fg3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-sync-status { font-size: 12px; color: var(--fg4); padding: 4px 16px 8px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    .view-inner { transition: none; }
  }
</style>
</head>
<body>

<div class="bottom-chrome" id="bottom-chrome">
<div id="floating-nav" class="floating-nav hidden" role="navigation" aria-label="Chapter">
  <button type="button" id="fn-prev" aria-label="Previous chapter">←</button>
  <button type="button" class="fn-book" id="fn-book" aria-label="Choose book"></button>
  <button type="button" class="fn-chapter" id="fn-chapter" aria-label="Choose chapter"></button>
  <button type="button" class="fn-verse" id="fn-verse" aria-label="Choose verse"></button>
  <button type="button" id="fn-next" aria-label="Next chapter">→</button>
</div>

<div class="fab-root">
  <button type="button" id="fab-main" class="fab-main" aria-label="Menu" aria-expanded="false" aria-controls="fab-panel">☰</button>
  <div id="fab-panel" class="fab-panel">
    <div id="auth-area"></div>
    <div class="theme-mode-wrap">
      <div class="theme-mode-label">Color Scheme</div>
      <div class="theme-mode-control" role="group" aria-label="Color scheme">
        <button class="theme-mode-button" type="button" data-theme-mode="light" aria-pressed="true">Light</button>
        <button class="theme-mode-button" type="button" data-theme-mode="dark" aria-pressed="false">Dark</button>
        <button class="theme-mode-button" type="button" data-theme-mode="auto" aria-pressed="false">Auto</button>
      </div>
    </div>
    <div class="font-slider-wrap">
      <div class="font-slider-row">
        <label for="font-size-slider">Text Size</label>
        <output id="dd-font-val" for="font-size-slider">20px</output>
      </div>
      <div class="font-slider-track">
        <input id="font-size-slider" class="font-slider" type="range" min="0" max="4" step="1" value="2" aria-label="Reader text size">
        <div class="font-slider-ticks" aria-hidden="true">
          <span style="left: 0%;">16</span>
          <span style="left: 25%;">18</span>
          <span style="left: 50%;">20</span>
          <span style="left: 75%;">22</span>
          <span style="left: 100%;">24</span>
        </div>
      </div>
    </div>
    <button class="dd-item" id="btn-search" type="button">
      <span class="dd-icon">🔍</span>
      <span class="dd-label">Search</span>
    </button>
    <div class="fab-section-label">Recent reading</div>
    <div id="history-menu" class="fab-history-menu"></div>
    <div class="app-version">Version <span id="app-version">3.0.0</span></div>
  </div>
</div>
</div>

<div id="view">
  <div class="view-inner" id="view-inner">
    <div id="error"></div>
    <p id="loading">Loading&hellip;</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore-compat.js"></script>
<script>
(function () {
  var APP_VERSION = '3.0.0';
  var FONT_STEPS = [16, 18, 20, 22, 24];
  var DEFAULT_FONT_STEP = 2;

  // ===================== FIREBASE =====================
  var fbApp = firebase.initializeApp({
    apiKey: "AIzaSyBQy2RroDHDnUxfOs4aDCmS4nOEC_3j9Ac",
    authDomain: "awmpc-bible.firebaseapp.com",
    projectId: "awmpc-bible",
    storageBucket: "awmpc-bible.firebasestorage.app",
    messagingSenderId: "1073608844887",
    appId: "1:1073608844887:web:40700e236dc26d11286512"
  });
  var auth = fbApp.auth();
  var db = fbApp.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

  // ===================== STATE WRAPPER =====================
  var _syncTimer = null;
  var _currentUid = null;

  function _userDoc() {
    return _currentUid ? db.collection('users').doc(_currentUid) : null;
  }

  var _syncStatusEl = null;
  function _setSyncStatus(text) {
    if (_syncStatusEl) _syncStatusEl.textContent = text;
  }

  function _scheduleSync() {
    if (!_currentUid) return;
    clearTimeout(_syncTimer);
    _setSyncStatus('Pending\u2026');
    _syncTimer = setTimeout(function () {
      var doc = _userDoc();
      if (!doc) return;
      _setSyncStatus('Syncing\u2026');
      doc.set({
        themeMode: State.getThemeMode(),
        font: State.getFontStep(),
        history: State.getHistory(),
        searchHistory: State.getSearchHistory(),

  // Bracket label is manuscript / editor scope: digits, ranges (6-8), etc. — not only the current verse number.
  var footnoteRe = /\{\[([^\]]+)\]\s*(.*?)\}/g;
  var footnoteStripRe = /\{\[[^\]]+\]\s*.*?\}/g;
  function parseVerse(raw) {
    var segments = [];
    var last = 0;
    var m;
    footnoteRe.lastIndex = 0;
    while ((m = footnoteRe.exec(raw)) !== null) {
      if (m.index > last) {
        segments.push({ type: 'text', value: raw.slice(last, m.index).replace(/  +/g, ' ') });
      }
      segments.push({ type: 'note', ref: m[1], text: m[2] });
      last = footnoteRe.lastIndex;
    }
    if (last < raw.length) {
      segments.push({ type: 'text', value: raw.slice(last).replace(/  +/g, ' ') });
    }
    return segments;
  }

    if (idx > 0) {
      return { book: book, chapter: parseInt(chList[idx - 1], 10) };

    if (bi <= 0) return null;
    var prevBook = books[bi - 1];
    var prevCh = sortedChapterKeys(prevBook);
    return { book: prevBook, chapter: parseInt(prevCh[prevCh.length - 1], 10) };
  }

    for (var i = 0; i < verses.length; i++) {
      var rect = verses[i].getBoundingClientRect();
      var verseCenter = rect.top + (rect.height / 2);
      var visible = rect.bottom > viewRect.top && rect.top < viewRect.bottom;
      var dist = Math.abs(verseCenter - centerY);
      if (visible && dist < bestDist) {
        best = verses[i];
        bestDist = dist;
      }
    }
    if (best && best.getAttribute('data-v') !== activeVerse) {
      setActiveVerse(best.getAttribute('data-v'), false);
    }
  }

  function clearChapterCrossfadeTimer() {
    if (!chapterCrossfadeTimer) return;
    window.clearTimeout(chapterCrossfadeTimer);
    chapterCrossfadeTimer = null;
  }

  function clearRetiringChapterViews() {
    var retiring = viewEl.querySelectorAll('.chapter-transition-retiring');
    for (var i = 0; i < retiring.length; i++) retiring[i].remove();
  }

  function shouldReduceChapterMotion() {
    return window.matchMedia &&
      window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function showVersesViewWithTransition(bookName, chapterNum, scrollToVerse) {
    if (uiView !== 'verses' || shouldReduceChapterMotion()) {
      clearChapterCrossfadeTimer();
      clearRetiringChapterViews();
      viewInner.classList.remove('chapter-transition-ready', 'chapter-transition-in');
      showVersesView(bookName, chapterNum, scrollToVerse);
      return;
    }

    clearChapterCrossfadeTimer();
    clearRetiringChapterViews();
    var retiring = viewInner.cloneNode(true);
    retiring.removeAttribute('id');
    retiring.className = 'view-inner chapter-transition-retiring';
    retiring.style.transform = 'translateY(-' + viewEl.scrollTop + 'px)';
    viewEl.appendChild(retiring);

    viewInner.classList.add('chapter-transition-ready');
    preservingChapterCrossfade = true;
    try {
      showVersesView(bookName, chapterNum, scrollToVerse);
    } finally {
      preservingChapterCrossfade = false;
    }
    void viewInner.offsetWidth;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () {
        viewInner.classList.add('chapter-transition-in');
        retiring.classList.add('chapter-transition-out');
      });
    });

    chapterCrossfadeTimer = window.setTimeout(function () {
      retiring.remove();
      viewInner.classList.remove('chapter-transition-ready', 'chapter-transition-in');
      chapterCrossfadeTimer = null;
    }, CHAPTER_CROSSFADE_MS);
  }

  function shouldIgnoreBibleShortcut(e) {
    if (e.metaKey || e.ctrlKey || e.altKey) return true;
    var target = e.target;
    if (!target) return false;
    var tag = target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return true;
    return target.isContentEditable;
  }

  function getSelectionGridItems() {
    if (uiView === 'books') {
      return Array.prototype.slice.call(viewInner.querySelectorAll('.book-btn'));
    }
    if (uiView === 'chapters') {
      return Array.prototype.slice.call(viewInner.querySelectorAll('.chapter-grid .chapter-btn'));
    }
    if (uiView === 'verse-picker') {
      return Array.prototype.slice.call(viewInner.querySelectorAll('.verse-grid .chapter-btn'));
    }
    return [];
  }

  function directionalDistance(currentRect, rect, key) {
    var currentX = currentRect.left + (currentRect.width / 2);
    var currentY = currentRect.top + (currentRect.height / 2);
    var x = rect.left + (rect.width / 2);
    var y = rect.top + (rect.height / 2);
    var dx = x - currentX;
    var dy = y - currentY;
    var primary;
    var cross;
    if (key === 'ArrowLeft') {
      if (dx >= -1) return Infinity;
      primary = Math.abs(dx);
      cross = Math.abs(dy);
    } else if (key === 'ArrowRight') {
      if (dx <= 1) return Infinity;
      primary = Math.abs(dx);
      cross = Math.abs(dy);
    } else if (key === 'ArrowUp') {
      if (dy >= -1) return Infinity;
      primary = Math.abs(dy);
      cross = Math.abs(dx);
    } else if (key === 'ArrowDown') {
      if (dy <= 1) return Infinity;
      primary = Math.abs(dy);
      cross = Math.abs(dx);
    } else {
      return Infinity;
    }
    return (primary * primary) + (cross * cross * 2);
  }

  function focusClosestGridItem(items, current, key) {
    if (!items.length) return false;
    if (!current || items.indexOf(current) === -1) {
      items[0].focus();
      return true;
    }
    var currentRect = current.getBoundingClientRect();
    var best = null;
    for (var i = 0; i < items.length; i++) {
      if (items[i] === current || items[i].disabled) continue;
      var rect = items[i].getBoundingClientRect();
      if (!rect.width || !rect.height) continue;
      var candidate = { el: items[i], score: Infinity };
      candidate.score = directionalDistance(currentRect, rect, key);
      if (candidate.score < Infinity && (!best || candidate.score < best.score)) {
        best = candidate;
      }
    }
    if (!best) return false;
    best.el.focus();
    return true;
  }

  function handleSelectionArrowKey(key) {
    var items = getSelectionGridItems();
    return focusClosestGridItem(items, document.activeElement, key);
  }

  function handleSelectionEnterKey() {
    var items = getSelectionGridItems();
    if (items.indexOf(document.activeElement) === -1) return false;
    document.activeElement.click();
    return true;
  }

  function handleReadingEnterKey() {
    var active = viewInner.querySelector('.verse.active');
    if (!active) return false;
    var noteButtons = active.querySelectorAll('.footnote-toggle');
    var noteBodies = active.querySelectorAll('.footnote-body');
    if (!noteButtons.length || !noteBodies.length) return false;
    var shouldOpen = false;
    for (var i = 0; i < noteBodies.length; i++) {
      if (noteBodies[i].className.indexOf('visible') === -1) {
        shouldOpen = true;
        break;
      }
    }
    for (i = 0; i < noteBodies.length; i++) {
      noteBodies[i].className = shouldOpen ? 'footnote-body visible' : 'footnote-body';
    }
    for (i = 0; i < noteButtons.length; i++) {
      noteButtons[i].className = shouldOpen ? 'footnote-toggle open' : 'footnote-toggle';
    }
    return true;
  }

  function handleKeyboardBack() {
    if (fabPanel.classList.contains('open') || openMenu) {
      closeMenus();
      return true;
    }
    if (uiView === 'verses') { showVersePickerView(navBook, navChapter); return true; }
    if (uiView === 'verse-picker') { showChaptersView(navBook); return true; }
    if (uiView === 'chapters') { showBooksView(); return true; }
    if (uiView === 'search') { showBooksView(); return true; }
    return false;
  }

  function showAdjacentChapter(direction) {
    if (!bibleData || navBook == null || navChapter == null) return false;
    var next = direction < 0 ? prevChapterNav(navBook, navChapter) : nextChapterNav(navBook, navChapter);
    if (!next) return false;
    showVersesViewWithTransition(next.book, next.chapter);
    return true;
  }

  function showAdjacentVerse(direction) {
    if (uiView !== 'verses') return false;
    var verses = Array.prototype.slice.call(viewInner.querySelectorAll('.verse'));
    if (!verses.length) return false;
    var current = viewInner.querySelector('.verse.active');
    var idx = current ? verses.indexOf(current) : -1;
    if (idx === -1) idx = direction < 0 ? verses.length : -1;
    var next = verses[idx + direction];
    if (!next) return false;
    var verse = next.getAttribute('data-v');
    setActiveVerse(verse, false);
    var target = viewInner.querySelector('[data-v="' + verse + '"]');
    scrollVerseToCenter(target);
    return true;
  }

  function handleReadingArrowKey(key) {
    if (key === 'ArrowLeft') return showAdjacentChapter(-1);
    if (key === 'ArrowRight') return showAdjacentChapter(1);
    if (key === 'ArrowUp') return showAdjacentVerse(-1);
    if (key === 'ArrowDown') return showAdjacentVerse(1);
    return false;
  }

  function handleBibleKeyboardNavigation(e) {
    if (shouldIgnoreBibleShortcut(e)) return;
    var key = e.key;
    var handled = false;
    if (key === 'Enter') handled = uiView === 'verses' ? handleReadingEnterKey() : handleSelectionEnterKey();
    if (key === 'Escape' || key === 'Backspace' || key === 'Delete') handled = handleKeyboardBack();
    if (!handled && (key === 'ArrowLeft' || key === 'ArrowRight' || key === 'ArrowUp' || key === 'ArrowDown')) {
      handled = uiView === 'verses' ? handleReadingArrowKey(key) : handleSelectionArrowKey(key);
    }
    if (handled) e.preventDefault();
  }

    navFromPop = false;

  // ===================== VIEW: SEARCH =====================
  function normalizeSearchText(raw) {
    var t = String(raw).replace(footnoteStripRe, '').replace(/  +/g, ' ');
    t = t.toLowerCase();
    try {
      return t.replace(/[^\p{L}\p{N}]+/gu, '');
    } catch (e) {
      return t.replace(/[^a-z0-9]+/gi, '');
    }
  }

  /** Map first normalized match of qn in raw (footnote-stripped) to [start,end) indices in that same string. */
  function findNormMatchInRaw(raw, qn) {
    var stripped = String(raw).replace(footnoteStripRe, '').replace(/  +/g, ' ');
    var normFull = normalizeSearchText(stripped);
    var pos = normFull.indexOf(qn);
    if (pos === -1) return null;
    var lower = stripped.toLowerCase();
    var built = 0;
    var rawStart = -1;
    var i = 0;
    while (i < lower.length) {
      var cp = lower.codePointAt(i);
      var w = cp > 0xffff ? 2 : 1;
      var ch = String.fromCodePoint(cp);
      var isWord = false;
      try {
        isWord = /^[\p{L}\p{N}]$/u.test(ch);
      } catch (e) {
        isWord = /[a-z0-9]/i.test(ch);
      }
      if (isWord) {
        if (built === pos) rawStart = i;
        built++;
        if (built === pos + qn.length) {
          return { start: rawStart, end: i + w };
        }
      }
      i += w;
    }
    return null;
  }

  function buildSearchIndex() {
    if (searchIndex) return;
    searchIndex = [];
    var books = Object.keys(bibleData);
    for (var b = 0; b < books.length; b++) {
      var chs = bibleData[books[b]];
      var chKeys = Object.keys(chs);
      for (var c = 0; c < chKeys.length; c++) {
        var vs = chs[chKeys[c]];
        var vKeys = Object.keys(vs);
        for (var v = 0; v < vKeys.length; v++) {
          var txt = vs[vKeys[v]];
          searchIndex.push({
            book: books[b], ch: chKeys[c], v: vKeys[v],
            text: txt,
            lower: txt.toLowerCase(),
            norm: normalizeSearchText(txt)
          });
        }
      }
    }
  }

  function renderSearchHistory(histEl, input, countEl, resultsEl) {
    histEl.textContent = '';

    var label = document.createElement('div');
    label.className = 'search-hist-label';

        return function (e) {

          State.removeSearchHistory(q);
          renderSearchHistory(histEl, input, countEl, resultsEl);
        };
      })(hist[i]));
      row.appendChild(rm);

      row.addEventListener('click', (function (q) {
        return function () {

      })(hist[i]));

    var clearBtn = document.createElement('button');

    clearBtn.className = 'search-hist-clear';

  function showSearchView() {
    viewEl.scrollTop = 0;

    currentBook = null;
    currentChapter = null;
    activeVerse = null;
    uiView = 'search';
    updateNav();
    pushNav({ view: 'search' });
    buildSearchIndex();

    var bar = document.createElement('div');
    bar.className = 'search-bar';
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'search-input';
    input.placeholder = 'Search the Bible\u2026';
    input.setAttribute('autocomplete', 'off');
    bar.appendChild(input);
    viewInner.appendChild(bar);

    var countEl = document.createElement('div');
    countEl.className = 'search-count';
    viewInner.appendChild(countEl);

    var resultsEl = document.createElement('div');
    viewInner.appendChild(resultsEl);

    var histEl = document.createElement('div');
    viewInner.appendChild(histEl);
    renderSearchHistory(histEl, input, countEl, resultsEl);

    var debounce = null;
    var lastCommitted = '';
    input.addEventListener('input', function () {
      clearTimeout(debounce);
      var q = input.value.trim();
      if (q.length < 2) {
        countEl.textContent = '';
        resultsEl.textContent = '';
        histEl.style.display = '';
        renderSearchHistory(histEl, input, countEl, resultsEl);
        return;
      }
      histEl.style.display = 'none';
      debounce = setTimeout(function () { runSearch(q, countEl, resultsEl); }, 250);
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var q = input.value.trim();
        if (q.length >= 2 && q !== lastCommitted) {
          lastCommitted = q;
          State.pushSearchHistory(q);
        }
      }
    });

    input.addEventListener('blur', function () {
      var q = input.value.trim();
      if (q.length >= 2 && q !== lastCommitted) {
        lastCommitted = q;
        State.pushSearchHistory(q);
      }
    });

    setTimeout(function () { input.focus(); }, 100);
  }

  function runSearch(query, countEl, resultsEl) {
    resultsEl.textContent = '';
    var q = query.trim();
    if (q.length < 2) { countEl.textContent = ''; return; }
    var qn = normalizeSearchText(q);
    if (qn.length < 2) { countEl.textContent = ''; return; }

    var results = [];
    var max = 200;
    for (var i = 0; i < searchIndex.length && results.length < max; i++) {
      if (searchIndex[i].norm.indexOf(qn) !== -1) results.push(searchIndex[i]);
    }

    countEl.textContent = results.length >= max ? max + '+ results' : results.length + ' result' + (results.length !== 1 ? 's' : '');

    var qLow = q.toLowerCase();
    for (var r = 0; r < results.length; r++) {
      var item = results[r];
      var div = document.createElement('div');
      div.className = 'search-result';

      var ref = document.createElement('span');
      ref.className = 'search-ref';
      ref.textContent = item.book + ' ' + item.ch + ':' + item.v;
      div.appendChild(ref);

      var text = document.createElement('div');
      text.className = 'search-text';
      var raw = item.text.replace(footnoteStripRe, '').replace(/  +/g, ' ');
      var range = findNormMatchInRaw(raw, qn);
      var idx = range ? range.start : 0;
      var markLen = range ? (range.end - range.start) : Math.min(20, raw.length);
      if (!range && raw.length) {
        var rawLower = raw.toLowerCase();
        var words = qLow.split(/\s+/).filter(Boolean);
        if (words.length) {
          var wi = rawLower.indexOf(words[0]);
          if (wi >= 0) {
            idx = wi;
            markLen = words[0].length;
          }
        }
      }
      var start = Math.max(0, idx - 40);
      var end = Math.min(raw.length, idx + markLen + 40);
      var snippet = (start > 0 ? '\u2026' : '') + raw.slice(start, end) + (end < raw.length ? '\u2026' : '');
      var rel = idx - start + (start > 0 ? 1 : 0);
      var before = snippet.slice(0, rel);
      var match = snippet.slice(rel, rel + markLen);
      var after = snippet.slice(rel + markLen);
      text.appendChild(document.createTextNode(before));
      var mark = document.createElement('mark');
      mark.textContent = match;
      text.appendChild(mark);
      text.appendChild(document.createTextNode(after));
      div.appendChild(text);

      div.addEventListener('click', (function (book, ch, verse) {
        return function () { showVersesView(book, parseInt(ch, 10), verse); };
      })(item.book, item.ch, item.v));
      resultsEl.appendChild(div);
    }
  }


  // ===================== BOOK BUTTON FACTORY =====================
  function createBookButton(bookName, index, list) {
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.type = 'button';

    var enSpan = document.createElement('div');
    enSpan.className = 'book-name-en';
    enSpan.textContent = bookName;
    btn.appendChild(enSpan);

    var ko = koName(bookName);
    if (ko) {
      var koSpan = document.createElement('div');
      koSpan.className = 'book-name-ko';
      koSpan.textContent = ko;
      btn.appendChild(koSpan);
    }

    btn.addEventListener('click', function () { showChaptersView(bookName); });
    li.appendChild(btn);
    list.appendChild(li);
  }
  // ===================== NAV HANDLERS =====================
  fnPrev.addEventListener('click', function () {
    if (!bibleData || navBook == null || navChapter == null) return;
    var p = prevChapterNav(navBook, navChapter);
    if (p) showVersesViewWithTransition(p.book, p.chapter);
  });
  fnNext.addEventListener('click', function () {
    if (!bibleData || navBook == null || navChapter == null) return;
    var n = nextChapterNav(navBook, navChapter);
    if (n) showVersesViewWithTransition(n.book, n.chapter);
  });
  fnBook.addEventListener('click', function () {
    if (bibleData) showBooksView();
  });
  fnChapter.addEventListener('click', function () {
    if (bibleData && navBook) showChaptersView(navBook);
  });
  fnVerse.addEventListener('click', function () {
    if (bibleData && navBook && navChapter) showVersePickerView(navBook, navChapter);
  });
  viewEl.addEventListener('scroll', function () {
    requestAnimationFrame(updateActiveVerseFromViewport);
  }, { passive: true });
  viewEl.addEventListener('wheel', releaseVerseChaseForFreeScroll, { passive: true });
  document.addEventListener('keydown', handleBibleKeyboardNavigation);
  document.getElementById('btn-search').addEventListener('click', function (e) {
    e.stopPropagation();
    if (bibleData) {
      closeMenus();
      showSearchView();
    }
  });

  // ===================== LOAD DATA =====================
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'bible.json', true);
  xhr.responseType = 'json';

  xhr.onload = function () {
    loadingEl.style.display = 'none';
    if (xhr.status !== 200 || !xhr.response) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Failed to load bible.json (status ' + xhr.status + ').';
      return;
    }
    bibleData = xhr.response;
    initNavAnchor();
    history.replaceState({ view: 'books' }, '');
    navFromPop = true;
    showBooksView();
    navFromPop = false;
  };

  xhr.onerror = function () {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Network error loading bible.json.';
  };

  xhr.send();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
