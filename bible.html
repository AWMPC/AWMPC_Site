<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AWMPC Bible">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="resources/images/bible-icon-192.png">
<title>AWMPC Bible</title>
<style>
  :root {
    --bg: #f5f5f5; --bg2: #fff; --bg3: #fafaf8; --bg4: #f0f0f0;
    --fg: #222; --fg2: #555; --fg3: #707070; --fg4: #6b6b6b;
    --border: #e0e0e0; --border2: #ddd; --border3: #ccc;
    --accent: #1a1a2e; --accent-fg: #fff;
    --note-bg: #f0efe8; --note-border: #c5b358;
    --err-bg: #ffeaea; --err-fg: #a00;
    --toolbar-bg: #1a1a2e; --toolbar-fg: #e0e0e0;
    --bm-color: #c5a000;
  }
  html.dark {
    --bg: #121212; --bg2: #1e1e1e; --bg3: #1a1a1a; --bg4: #2a2a2a;
    --fg: #e0e0e0; --fg2: #aaa; --fg3: #959595; --fg4: #929292;
    --border: #333; --border2: #444; --border3: #555;
    --accent: #3a3a5e; --accent-fg: #fff;
    --note-bg: #2a2820; --note-border: #8a7a30;
    --err-bg: #3a1010; --err-fg: #f88;
    --toolbar-bg: #0a0a18; --toolbar-fg: #ccc;
    --bm-color: #e0c030;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
    display: flex; flex-direction: column;
  }

  /* Toolbar */
  .toolbar {
    display: flex; flex-direction: column;
    padding: 0; background: var(--toolbar-bg); flex-shrink: 0; z-index: 100;
  }
  .toolbar-row {
    display: flex; align-items: center; gap: 6px; padding: 6px 10px;
  }
  .toolbar-row + .toolbar-row { padding-top: 0; padding-bottom: 8px; }
  .tb {
    background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.35);
    color: var(--toolbar-fg); font-size: 16px; font-family: inherit;
    padding: 6px 10px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; transition: background 0.12s, border-color 0.12s; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; min-width: 38px; min-height: 38px;
  }
  .tb:hover { background: rgba(255,255,255,0.14); border-color: rgba(255,255,255,0.5); }
  .toolbar-title { color: #fff; font-size: 19px; font-weight: 600; flex-shrink: 0; cursor: pointer; }
  .toolbar-spacer { flex: 1; min-width: 4px; }
  .nav-btn {
    background: rgba(255,255,255,0.1); border: 1.5px solid rgba(255,255,255,0.45);
    color: #fff; font-size: 16px; font-family: inherit;
    padding: 6px 12px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; transition: background 0.12s, border-color 0.12s;
    max-width: 160px; overflow: hidden; text-overflow: ellipsis; flex-shrink: 1; min-width: 0;
  }
  .nav-btn:hover { background: rgba(255,255,255,0.2); border-color: rgba(255,255,255,0.6); }
  .nav-btn.hidden { display: none; }

  /* Dropdown menus (shared) */
  .dd-wrap { position: relative; flex-shrink: 0; }
  .dd-menu {
    display: none; position: absolute; top: 100%; margin-top: 6px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); min-width: 220px; max-height: 380px;
    overflow-y: auto; z-index: 110;
  }
  .dd-menu.open { display: block; }
  .dd-menu.right { right: 0; }
  .dd-menu.left { left: 0; }
  .dd-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--border);
    padding: 12px 16px; text-align: left; font-size: 17px; font-family: inherit;
    color: var(--fg); cursor: pointer; transition: background 0.1s;
  }
  .dd-item:last-child { border-bottom: none; }
  .dd-item:hover { background: var(--bg4); }
  .dd-item .dd-icon { flex-shrink: 0; width: 24px; text-align: center; }
  .dd-item .dd-label { flex: 1; }
  .dd-item .dd-value { color: var(--fg3); font-size: 14px; flex-shrink: 0; }
  .dd-empty { padding: 16px; color: var(--fg3); font-size: 15px; text-align: center; }

  /* Shell view area */
  #view { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .view-inner { max-width: 960px; margin: 0 auto; padding: 16px 12px; }

  /* Books view */
  .testaments { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .testament h2 {
    font-size: 18px; font-weight: 600; color: var(--fg2);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid var(--border2);
  }
  .testament { min-width: 0; }
  .testament ul { list-style: none; display: flex; flex-direction: column; gap: 5px; }
  .book-btn {
    display: block; width: 100%;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; font-family: inherit;
    color: var(--fg); cursor: pointer; text-align: left;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .book-btn:hover { border-color: var(--border3); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .book-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .book-name-en { font-size: 18px; line-height: 1.3; }
  .book-name-ko { font-size: 15px; color: var(--fg3); line-height: 1.3; }
  .book-btn.active .book-name-ko { color: #bbb; }

  /* Chapters view */
  .chapters-header { font-size: 22px; margin-bottom: 14px; color: var(--fg); }
  .chapter-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px;
  }
  .chapter-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 8px;
    padding: 14px 0; font-size: 19px; font-family: inherit; color: var(--fg);
    cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .chapter-btn:hover { background: var(--border2); border-color: var(--border3); }
  .chapter-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  /* Verses view */
  .verse {
    margin-bottom: 12px; font-size: 20px; line-height: 1.8; position: relative;
    border-radius: 8px; padding: 4px 6px; border: 2px solid transparent;
    transition: none;
  }
  .verse.highlight {
    background: rgba(197, 160, 50, 0.18);
    border-color: rgba(197, 160, 50, 0.6);
    box-shadow: 0 0 18px rgba(197, 160, 50, 0.35), inset 0 0 8px rgba(197, 160, 50, 0.1);
  }
  .verse.highlight-fade {
    transition: background 1.5s ease-out, border-color 1.5s ease-out, box-shadow 1.5s ease-out;
    background: transparent; border-color: transparent; box-shadow: none;
  }
  html.dark .verse.highlight {
    background: rgba(224, 192, 48, 0.15);
    border-color: rgba(224, 192, 48, 0.5);
    box-shadow: 0 0 22px rgba(224, 192, 48, 0.3), inset 0 0 8px rgba(224, 192, 48, 0.08);
  }
  .verse-num { font-size: 14px; font-weight: 700; color: var(--fg3); vertical-align: super; margin-right: 4px; }
  .verse-bm {
    background: none; border: none; cursor: pointer; font-size: 16px;
    padding: 0 2px; vertical-align: middle; opacity: 0.3; transition: opacity 0.15s;
  }
  .verse-bm:hover { opacity: 0.7; }
  .verse-bm.bookmarked { opacity: 1; color: var(--bm-color); }

  /* Bookmark popup */
  .bm-popup-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 200;
  }
  .bm-popup {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    background: var(--bg2); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.25); min-width: 260px; max-width: 320px;
    z-index: 201; overflow: hidden;
  }
  .bm-popup-title {
    font-size: 15px; font-weight: 600; color: var(--fg3); padding: 12px 16px 8px;
  }
  .bm-pop-item {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; border-top: 1px solid var(--border);
    padding: 12px 16px; text-align: left; font-size: 17px; font-family: inherit;
    color: var(--fg); cursor: pointer; transition: background 0.1s;
  }
  .bm-pop-item:hover { background: var(--bg4); }
  .bm-pop-item.danger { color: var(--err-fg); }
  .bm-pop-input {
    width: calc(100% - 32px); margin: 8px 16px; font-size: 16px; font-family: inherit;
    padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg); outline: none;
  }
  .bm-pop-input:focus { border-color: var(--accent); }
  .bm-pop-check { color: var(--bm-color); font-size: 14px; }
  .footnote-toggle {
    display: inline-block; background: none; border: 1px solid var(--border3);
    border-radius: 4px; color: var(--fg3); font-size: 13px; font-family: inherit;
    padding: 1px 7px; margin-left: 4px; cursor: pointer; vertical-align: middle;
    transition: background 0.12s, color 0.12s;
  }
  .footnote-toggle:hover { background: var(--bg4); color: var(--fg2); }
  .footnote-toggle.open { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .footnote-body {
    display: none; margin: 6px 0 4px 20px; padding: 8px 12px;
    background: var(--note-bg); border-left: 3px solid var(--note-border);
    border-radius: 0 6px 6px 0; font-size: 17px; color: var(--fg2); line-height: 1.6;
  }
  .footnote-body.visible { display: block; }

  /* Search view */
  .search-bar {
    display: flex; gap: 8px; margin-bottom: 16px;
  }
  .search-input {
    flex: 1; font-size: 18px; font-family: inherit; padding: 10px 14px;
    border: 1.5px solid var(--border); border-radius: 8px;
    background: var(--bg2); color: var(--fg); outline: none;
    transition: border-color 0.15s;
  }
  .search-input:focus { border-color: var(--accent); }
  .search-input::placeholder { color: var(--fg4); }
  .search-count { font-size: 15px; color: var(--fg3); margin-bottom: 12px; }
  .search-hist-label {
    font-size: 14px; font-weight: 600; color: var(--fg3); text-transform: uppercase;
    letter-spacing: 0.5px; margin-bottom: 8px;
  }
  .search-hist-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    margin-bottom: 5px; cursor: pointer; transition: background 0.1s;
  }
  .search-hist-item:hover { background: var(--bg4); }
  .search-hist-item .sh-query { flex: 1; font-size: 17px; color: var(--fg); }
  .search-hist-item .sh-remove {
    background: none; border: none; color: var(--fg4); font-size: 16px;
    cursor: pointer; padding: 2px 6px; border-radius: 4px;
  }
  .search-hist-item .sh-remove:hover { color: var(--err-fg); }
  .search-hist-clear {
    display: inline-block; font-size: 14px; color: var(--fg3); cursor: pointer;
    margin-top: 8px; padding: 4px 0; border: none; background: none; font-family: inherit;
  }
  .search-hist-clear:hover { color: var(--err-fg); }
  .search-result {
    padding: 12px; margin-bottom: 8px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 8px; cursor: pointer;
    transition: background 0.1s;
  }
  .search-result:hover { background: var(--bg4); }
  .search-ref { font-size: 14px; font-weight: 600; color: var(--accent-fg); background: var(--accent);
    display: inline-block; padding: 2px 8px; border-radius: 4px; margin-bottom: 4px; }
  html.dark .search-ref { color: var(--accent-fg); background: var(--accent); }
  .search-text { font-size: 16px; color: var(--fg2); }
  .search-text mark { background: #fff3a8; color: #222; border-radius: 2px; padding: 0 1px; }
  html.dark .search-text mark { background: #5a4a00; color: #e0e0e0; }

  /* Bookmarks view */
  .bm-item {
    display: flex; align-items: center; gap: 10px; padding: 12px;
    margin-bottom: 6px; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 8px; cursor: pointer; transition: background 0.1s;
  }
  .bm-item:hover { background: var(--bg4); }
  .bm-ref { font-weight: 600; font-size: 16px; flex: 1; }
  .bm-remove {
    background: none; border: none; color: var(--fg3); font-size: 18px;
    cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: color 0.12s;
  }
  .bm-remove:hover { color: var(--err-fg); }

  #error {
    display: none; background: var(--err-bg); color: var(--err-fg);
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
  }
  #loading { color: var(--fg3); font-size: 15px; padding: 40px 20px; text-align: center; }

  /* Large font overrides */
  html.large-font .toolbar-title { font-size: 23px; }
  html.large-font .tb { font-size: 19px; padding: 7px 12px; }
  html.large-font .nav-btn { font-size: 19px; padding: 7px 14px; }
  html.large-font .dd-item { font-size: 20px; padding: 14px 18px; }
  html.large-font .dd-empty { font-size: 19px; }
  html.large-font .book-btn { padding: 12px 14px; }
  html.large-font .book-name-en { font-size: 22px; }
  html.large-font .book-name-ko { font-size: 18px; }
  html.large-font .testament h2 { font-size: 22px; }
  html.large-font .chapters-header { font-size: 26px; }
  html.large-font .chapter-btn { font-size: 23px; padding: 18px 0; }
  html.large-font .verse { font-size: 24px; line-height: 1.9; }
  html.large-font .verse-num { font-size: 17px; }
  html.large-font .footnote-toggle { font-size: 16px; }
  html.large-font .footnote-body { font-size: 20px; }
  html.large-font .search-input { font-size: 21px; }
  html.large-font .search-ref { font-size: 17px; }
  html.large-font .search-text { font-size: 19px; }
  html.large-font .search-count { font-size: 18px; }
  html.large-font .search-hist-item .sh-query { font-size: 20px; }
  html.large-font .search-hist-label { font-size: 17px; }
  html.large-font .bm-ref { font-size: 19px; }
  html.large-font .bm-pop-item { font-size: 20px; }
  html.large-font .bm-pop-input { font-size: 19px; }

  /* Audio player bar */
  .audio-bar {
    display: none; background: var(--accent); color: var(--accent-fg);
    padding: 8px 12px; flex-shrink: 0; gap: 8px; align-items: center;
  }
  .audio-bar.active { display: flex; }
  .audio-bar-btn {
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 16px; width: 34px; height: 34px; border-radius: 50%;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: background 0.12s; flex-shrink: 0;
  }
  .audio-bar-btn:hover { background: rgba(255,255,255,0.25); }
  .audio-bar-info {
    flex: 1; min-width: 0; font-size: 13px; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .audio-bar-ref { font-weight: 600; }
  .audio-bar-timer { font-size: 12px; opacity: 0.7; margin-left: 4px; }
  .audio-bar-speed {
    background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3);
    color: #fff; font-size: 12px; font-family: inherit;
    padding: 3px 8px; border-radius: 4px; cursor: pointer; flex-shrink: 0;
  }
  .verse.speaking { background: rgba(100, 149, 237, 0.15); border-color: rgba(100, 149, 237, 0.4); }
  html.dark .verse.speaking { background: rgba(100, 149, 237, 0.1); border-color: rgba(100, 149, 237, 0.3); }

  /* Audio setup popup */
  .audio-setup { text-align: left; }
  .audio-setup label {
    display: block; font-size: 15px; color: var(--fg2); margin: 12px 16px 4px;
  }
  .audio-setup select, .audio-setup input[type="range"] {
    display: block; width: calc(100% - 32px); margin: 0 16px 8px;
    font-size: 15px; font-family: inherit; padding: 6px 8px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); color: var(--fg);
  }
  .audio-timer-opts { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 16px 12px; }
  .audio-timer-opt {
    padding: 6px 14px; border-radius: 6px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border); background: var(--bg); color: var(--fg);
    cursor: pointer; transition: background 0.1s;
  }
  .audio-timer-opt:hover { background: var(--bg4); }
  .audio-timer-opt.selected { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  /* Auth UI */
  .profile-avatar {
    width: 28px; height: 28px; border-radius: 50%; vertical-align: middle;
    border: 1.5px solid rgba(255,255,255,0.4);
  }
  .dd-user {
    display: flex; align-items: center; gap: 10px;
    padding: 14px 16px; border-bottom: 1px solid var(--border);
  }
  .dd-user-photo { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
  .dd-user-info { flex: 1; min-width: 0; }
  .dd-user-name { font-size: 15px; font-weight: 600; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-user-email { font-size: 12px; color: var(--fg3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-sync-status { font-size: 12px; color: var(--fg4); padding: 4px 16px 8px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <div class="toolbar-row">
    <span class="toolbar-title" id="nav-home">📖 AWMPC Bible</span>
    <span class="toolbar-spacer"></span>
    <div class="dd-wrap">
      <button class="tb" id="profile-btn" type="button" aria-label="Settings">👤</button>
      <div class="dd-menu right" id="profile-menu">
        <div id="auth-area"></div>
        <button class="dd-item" id="dd-dark" type="button">
          <span class="dd-icon" id="dd-dark-icon">🌙</span>
          <span class="dd-label">Dark Mode</span>
          <span class="dd-value" id="dd-dark-val">Off</span>
        </button>
        <button class="dd-item" id="dd-font" type="button">
          <span class="dd-icon">Aa</span>
          <span class="dd-label">Large Text</span>
          <span class="dd-value" id="dd-font-val">Off</span>
        </button>
      </div>
    </div>
  </div>
  <div class="toolbar-row">
    <button class="nav-btn hidden" id="nav-book" type="button"></button>
    <button class="nav-btn hidden" id="nav-chapter" type="button"></button>
    <span class="toolbar-spacer"></span>
    <button class="tb" id="btn-search" type="button" aria-label="Search">🔍</button>
    <button class="tb" id="btn-audio" type="button" aria-label="Audio">🔊</button>
    <button class="tb" id="btn-bookmarks" type="button" aria-label="Bookmarks">🔖</button>
    <div class="dd-wrap">
      <button class="tb" id="btn-history" type="button" aria-label="History">📑</button>
      <div class="dd-menu right" id="history-menu"></div>
    </div>
  </div>
</div>

<div class="audio-bar" id="audio-bar">
  <button class="audio-bar-btn" id="ab-prev" aria-label="Previous verse">⏮</button>
  <button class="audio-bar-btn" id="ab-play" aria-label="Play/Pause">⏸</button>
  <button class="audio-bar-btn" id="ab-next" aria-label="Next verse">⏭</button>
  <div class="audio-bar-info">
    <span class="audio-bar-ref" id="ab-ref"></span>
    <span class="audio-bar-timer" id="ab-timer"></span>
  </div>
  <button class="audio-bar-speed" id="ab-speed">1x</button>
  <button class="audio-bar-btn" id="ab-stop" aria-label="Stop">⏹</button>
</div>

<div id="view">
  <div class="view-inner" id="view-inner">
    <div id="error"></div>
    <p id="loading">Loading&hellip;</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.2.0/firebase-firestore-compat.js"></script>

  var auth = fbApp.auth();
  var db = fbApp.firestore();
  db.enablePersistence({ synchronizeTabs: true }).catch(function () {});

  // ===================== STATE WRAPPER =====================
  var _syncTimer = null;

  function _userDoc() {
    return _currentUid ? db.collection('users').doc(_currentUid) : null;
  }

  // ===================== FOOTNOTES =====================
  var footnoteRe = /\{\[(\d+)\]\s*(.*?)\}/g;
  function parseVerse(raw) {
    var segments = [];
    var last = 0;
    var m;
    footnoteRe.lastIndex = 0;
    while ((m = footnoteRe.exec(raw)) !== null) {
      if (m.index > last) {
        segments.push({ type: 'text', value: raw.slice(last, m.index).replace(/  +/g, ' ') });
      }
      segments.push({ type: 'note', num: m[1], text: m[2] });
      last = footnoteRe.lastIndex;
    }
    if (last < raw.length) {
      segments.push({ type: 'text', value: raw.slice(last).replace(/  +/g, ' ') });
    }
    return segments;
  }

      navBookBtn.textContent = currentBook;
      navBookBtn.classList.remove('hidden');

    }
    if (currentBook && currentChapter) {
      navChapterBtn.textContent = currentChapter;
      navChapterBtn.classList.remove('hidden');
    } else {
      navChapterBtn.classList.add('hidden');
    }
  }

    var s = e.state;
    navFromPop = true;
    if (s && s.view === 'verses' && s.book && s.chapter) showVersesView(s.book, s.chapter);
    else if (s && s.view === 'chapters' && s.book) showChaptersView(s.book);
    else if (s && s.view === 'search') showSearchView();
    else if (s && s.view === 'bookmarks') showBookmarksView();
    else showBooksView();
    navFromPop = false;
  });

    pushNav({ view: 'books' });

    var data = bibleData;
    var books = Object.keys(data);
    var wrap = document.createElement('div');
    wrap.className = 'testaments';

    var otDiv = document.createElement('div');
    otDiv.className = 'testament';
    var otH = document.createElement('h2'); otH.textContent = 'Old Testament';
    otDiv.appendChild(otH);
    var otUl = document.createElement('ul'); otDiv.appendChild(otUl);

    var ntDiv = document.createElement('div');
    ntDiv.className = 'testament';
    var ntH = document.createElement('h2'); ntH.textContent = 'New Testament';
    ntDiv.appendChild(ntH);
    var ntUl = document.createElement('ul'); ntDiv.appendChild(ntUl);

    for (var i = 0; i < books.length; i++) {
      var ul = i < OT_COUNT ? otUl : ntUl;

    wrap.appendChild(otDiv);
    wrap.appendChild(ntDiv);

  // ===================== VIEW: VERSES =====================
  function showVersesView(bookName, chapterNum, scrollToVerse) {
    viewEl.scrollTop = 0;
    viewInner.textContent = '';
    currentBook = bookName;
    currentChapter = chapterNum;
    updateNav();
    pushNav({ view: 'verses', book: bookName, chapter: chapterNum });
    State.pushHistory(bookName, chapterNum);

    var chapters = bibleData[bookName];
    var verses = chapters[String(chapterNum)];
    var keys = Object.keys(verses);

    for (var i = 0; i < keys.length; i++) {
      var segments = parseVerse(verses[keys[i]]);
      var div = document.createElement('div');
      div.className = 'verse';
      div.setAttribute('data-v', keys[i]);

      var p = document.createElement('p');
      var sup = document.createElement('span');
      sup.className = 'verse-num';
      sup.textContent = keys[i];
      p.appendChild(sup);

      var noteBodies = [];
      for (var s = 0; s < segments.length; s++) {
        var seg = segments[s];
        if (seg.type === 'text') {
          p.appendChild(document.createTextNode(seg.value));
        } else {
          var noteBtn = document.createElement('button');
          noteBtn.type = 'button';
          noteBtn.className = 'footnote-toggle';
          noteBtn.textContent = '\u2020' + seg.num;
          var noteBody = document.createElement('div');
          noteBody.className = 'footnote-body';
          noteBody.textContent = '[' + seg.num + '] ' + seg.text;
          noteBtn.addEventListener('click', (function (b, bd) {
            return function () {
              var on = bd.className.indexOf('visible') !== -1;
              bd.className = on ? 'footnote-body' : 'footnote-body visible';
              b.className = on ? 'footnote-toggle' : 'footnote-toggle open';
            };
          })(noteBtn, noteBody));
          p.appendChild(noteBtn);
          noteBodies.push(noteBody);
        }
      }

      var bmBtn = document.createElement('button');
      bmBtn.type = 'button';
      bmBtn.className = 'verse-bm' + (State.isBookmarked(bookName, chapterNum, keys[i]) ? ' bookmarked' : '');
      bmBtn.textContent = '\uD83D\uDD16';
      bmBtn.addEventListener('click', (function (book, ch, v, el) {

      })(bookName, chapterNum, keys[i], bmBtn));
      p.appendChild(bmBtn);

      div.appendChild(p);
      for (var nb = 0; nb < noteBodies.length; nb++) div.appendChild(noteBodies[nb]);

    if (scrollToVerse) {

            target.classList.remove('highlight');
          }, 1800);
          setTimeout(function () {
            target.classList.remove('highlight-fade');
          }, 3500);
        }
      });
    }
  }

  function buildSearchIndex() {

    searchIndex = [];
    var books = Object.keys(bibleData);
    for (var b = 0; b < books.length; b++) {
      var chs = bibleData[books[b]];
      var chKeys = Object.keys(chs);

        var vKeys = Object.keys(vs);

    bar.className = 'search-bar';

    input.type = 'text';
    input.className = 'search-input';
    input.placeholder = 'Search the Bible\u2026';
    input.setAttribute('autocomplete', 'off');
    bar.appendChild(input);
    viewInner.appendChild(bar);

    var countEl = document.createElement('div');
    countEl.className = 'search-count';
    viewInner.appendChild(countEl);

    var resultsEl = document.createElement('div');
    viewInner.appendChild(resultsEl);

    var histEl = document.createElement('div');
    viewInner.appendChild(histEl);
    renderSearchHistory(histEl, input, countEl, resultsEl);

    var debounce = null;
    var lastCommitted = '';
    input.addEventListener('input', function () {
      clearTimeout(debounce);
      var q = input.value.trim();
      if (q.length < 2) {
        countEl.textContent = '';
        resultsEl.textContent = '';
        histEl.style.display = '';
        renderSearchHistory(histEl, input, countEl, resultsEl);
        return;
      }
      histEl.style.display = 'none';
      debounce = setTimeout(function () { runSearch(q, countEl, resultsEl); }, 250);
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        var q = input.value.trim();
        if (q.length >= 2 && q !== lastCommitted) {
          lastCommitted = q;
          State.pushSearchHistory(q);
        }
      }
    });

    input.addEventListener('blur', function () {
      var q = input.value.trim();
      if (q.length >= 2 && q !== lastCommitted) {
        lastCommitted = q;
        State.pushSearchHistory(q);
      }
    });

    setTimeout(function () { input.focus(); }, 100);
  }

  function runSearch(query, countEl, resultsEl) {
    resultsEl.textContent = '';
    var q = query.trim().toLowerCase();
    if (q.length < 2) { countEl.textContent = ''; return; }

    var results = [];
    var max = 200;
    for (var i = 0; i < searchIndex.length && results.length < max; i++) {
      if (searchIndex[i].lower.indexOf(q) !== -1) results.push(searchIndex[i]);
    }

    countEl.textContent = results.length >= max ? max + '+ results' : results.length + ' result' + (results.length !== 1 ? 's' : '');

    for (var r = 0; r < results.length; r++) {
      var item = results[r];
      var div = document.createElement('div');
      div.className = 'search-result';

      var ref = document.createElement('span');
      ref.className = 'search-ref';
      ref.textContent = item.book + ' ' + item.ch + ':' + item.v;
      div.appendChild(ref);

      var text = document.createElement('div');
      text.className = 'search-text';
      var raw = item.text.replace(/\{\[\d+\]\s*.*?\}/g, '').replace(/  +/g, ' ');
      var idx = raw.toLowerCase().indexOf(q);
      var start = Math.max(0, idx - 40);
      var end = Math.min(raw.length, idx + q.length + 40);
      var snippet = (start > 0 ? '\u2026' : '') + raw.slice(start, end) + (end < raw.length ? '\u2026' : '');
      var before = snippet.slice(0, idx - start + (start > 0 ? 1 : 0));
      var match = snippet.slice(before.length, before.length + q.length);
      var after = snippet.slice(before.length + q.length);
      text.appendChild(document.createTextNode(before));
      var mark = document.createElement('mark');
      mark.textContent = match;
      text.appendChild(mark);
      text.appendChild(document.createTextNode(after));
      div.appendChild(text);

      div.addEventListener('click', (function (book, ch, verse) {
        return function () { showVersesView(book, parseInt(ch, 10), verse); };
      })(item.book, item.ch, item.v));
      resultsEl.appendChild(div);
    }
  }

  // ===================== TTS ENGINE =====================
  var tts = {
    speaking: false, paused: false,
    bookIdx: 0, chIdx: 0, vIdx: 0,
    timerMinutes: 0, timerEnd: 0,
    rate: 1, speeds: [0.7, 0.85, 1, 1.15, 1.3, 1.5],
    speedIdx: 2,
    allBooks: null, utterance: null,
    _highlightEl: null,
    footnoteRe: /\{\[\d+\]\s*.*?\}/g,

    init: function () {
      if (!bibleData) return;
      this.allBooks = Object.keys(bibleData);
    },

    cleanText: function (raw) {
      return raw.replace(this.footnoteRe, '').replace(/  +/g, ' ').trim();
    },

    getVerse: function () {
      var book = this.allBooks[this.bookIdx];
      var chs = Object.keys(bibleData[book]);
      if (this.chIdx >= chs.length) return null;
      var vs = Object.keys(bibleData[book][chs[this.chIdx]]);
      if (this.vIdx >= vs.length) return null;
      return {
        book: book, ch: chs[this.chIdx], v: vs[this.vIdx],
        text: this.cleanText(bibleData[book][chs[this.chIdx]][vs[this.vIdx]])
      };
    },

    advance: function () {
      var book = this.allBooks[this.bookIdx];
      var chs = Object.keys(bibleData[book]);
      var vs = Object.keys(bibleData[book][chs[this.chIdx]]);
      this.vIdx++;
      if (this.vIdx >= vs.length) {
        this.vIdx = 0;
        this.chIdx++;
        if (this.chIdx >= chs.length) {
          this.chIdx = 0;
          this.bookIdx++;
          if (this.bookIdx >= this.allBooks.length) {
            return false;
          }
        }
        var newBook = this.allBooks[this.bookIdx];
        var newCh = Object.keys(bibleData[newBook])[this.chIdx];
        if (currentBook !== newBook || currentChapter !== parseInt(newCh, 10)) {
          showVersesView(newBook, parseInt(newCh, 10));
        }
      }
      return true;
    },

    rewind: function () {
      if (this.vIdx > 0) { this.vIdx--; return true; }
      if (this.chIdx > 0) {
        this.chIdx--;
        var book = this.allBooks[this.bookIdx];
        var vs = Object.keys(bibleData[book][Object.keys(bibleData[book])[this.chIdx]]);
        this.vIdx = Math.max(0, vs.length - 1);
        return true;
      }
      if (this.bookIdx > 0) {
        this.bookIdx--;
        var b = this.allBooks[this.bookIdx];
        var chs = Object.keys(bibleData[b]);
        this.chIdx = chs.length - 1;
        var vs2 = Object.keys(bibleData[b][chs[this.chIdx]]);
        this.vIdx = Math.max(0, vs2.length - 1);
        return true;
      }
      return false;
    },

    highlight: function (verseNum) {
      if (this._highlightEl) this._highlightEl.classList.remove('speaking');
      var el = viewInner.querySelector('[data-v="' + verseNum + '"]');
      if (el) {
        el.classList.add('speaking');
        el.scrollIntoView({ behavior: 'smooth', block: 'center' });
        this._highlightEl = el;
      }
    },

    clearHighlight: function () {
      if (this._highlightEl) { this._highlightEl.classList.remove('speaking'); this._highlightEl = null; }
    },

    speakVerse: function () {
      if (this.timerMinutes > 0 && Date.now() >= this.timerEnd) {
        this.stop(); return;
      }
      var info = this.getVerse();
      if (!info) { this.stop(); return; }

      abRef.textContent = info.book + ' ' + info.ch + ':' + info.v;
      this.highlight(info.v);
      this.updateTimer();

      var prefix = '';
      var book = this.allBooks[this.bookIdx];
      var chs = Object.keys(bibleData[book]);
      if (this.vIdx === 0) {
        prefix = info.book + ', chapter ' + info.ch + '. ';
      }

      var utt = new SpeechSynthesisUtterance(prefix + info.text);
      utt.rate = this.rate;
      utt.onend = function () {
        if (!tts.speaking || tts.paused) return;
        if (tts.advance()) {
          tts.speakVerse();
        } else {
          tts.stop();
        }
      };
      utt.onerror = function () { tts.stop(); };
      this.utterance = utt;
      speechSynthesis.speak(utt);
    },

    startFrom: function (bookName, chapterNum) {
      this.init();
      this.bookIdx = Math.max(0, this.allBooks.indexOf(bookName));
      var chs = Object.keys(bibleData[bookName]);
      this.chIdx = Math.max(0, chs.indexOf(String(chapterNum)));
      this.vIdx = 0;
      if (this.timerMinutes > 0) this.timerEnd = Date.now() + this.timerMinutes * 60000;
      this.speaking = true;
      this.paused = false;
      audioBar.classList.add('active');
      abPlay.textContent = '\u23F8';
      this.speakVerse();
    },

    pause: function () {
      this.paused = true;
      speechSynthesis.pause();
      abPlay.textContent = '\u25B6';
    },

    resume: function () {
      this.paused = false;
      speechSynthesis.resume();
      abPlay.textContent = '\u23F8';
    },

    stop: function () {
      this.speaking = false;
      this.paused = false;
      speechSynthesis.cancel();
      this.clearHighlight();
      audioBar.classList.remove('active');
    },

    nextVerse: function () {
      speechSynthesis.cancel();
      if (this.advance()) this.speakVerse(); else this.stop();
    },

    prevVerse: function () {
      speechSynthesis.cancel();
      this.rewind();
      this.speakVerse();
    },

    cycleSpeed: function () {
      this.speedIdx = (this.speedIdx + 1) % this.speeds.length;
      this.rate = this.speeds[this.speedIdx];
      abSpeed.textContent = this.rate + 'x';
      if (this.speaking && !this.paused) {
        speechSynthesis.cancel();
        this.speakVerse();
      }
    },

    updateTimer: function () {
      if (this.timerMinutes <= 0) { abTimer.textContent = ''; return; }
      var left = Math.max(0, Math.ceil((this.timerEnd - Date.now()) / 60000));
      abTimer.textContent = '(' + left + 'm left)';
    }
  };

  var audioBar = document.getElementById('audio-bar');
  var abRef = document.getElementById('ab-ref');
  var abTimer = document.getElementById('ab-timer');
  var abPlay = document.getElementById('ab-play');
  var abSpeed = document.getElementById('ab-speed');

  document.getElementById('ab-play').addEventListener('click', function () {
    if (tts.paused) tts.resume(); else tts.pause();
  });
  document.getElementById('ab-stop').addEventListener('click', function () { tts.stop(); });
  document.getElementById('ab-next').addEventListener('click', function () { if (tts.speaking) tts.nextVerse(); });
  document.getElementById('ab-prev').addEventListener('click', function () { if (tts.speaking) tts.prevVerse(); });
  document.getElementById('ab-speed').addEventListener('click', function () { tts.cycleSpeed(); });

  // Audio setup popup
  function showAudioSetup() {
    closeBmPopup();
    var scrim = document.createElement('div');
    scrim.className = 'bm-popup-scrim';
    scrim.addEventListener('click', function () { scrim.remove(); popup.remove(); });
    document.body.appendChild(scrim);

    var popup = document.createElement('div');
    popup.className = 'bm-popup audio-setup';

    var title = document.createElement('div');
    title.className = 'bm-popup-title';
    title.textContent = '\uD83D\uDD0A Read Aloud';
    popup.appendChild(title);

    var fromLabel = document.createElement('label');
    fromLabel.textContent = 'Start from';
    popup.appendChild(fromLabel);

    var fromText = document.createElement('div');
    fromText.style.cssText = 'padding: 0 16px 8px; font-size: 16px; font-weight: 600; color: var(--fg);';
    if (currentBook && currentChapter) {
      fromText.textContent = currentBook + ' ' + currentChapter;
    } else {
      fromText.textContent = 'Genesis 1';
    }
    popup.appendChild(fromText);

    var speedLabel = document.createElement('label');
    speedLabel.textContent = 'Speed';
    popup.appendChild(speedLabel);

    var speedSel = document.createElement('select');
    var speeds = [['0.7x (Slow)', 0.7], ['0.85x', 0.85], ['1x (Normal)', 1], ['1.15x', 1.15], ['1.3x', 1.3], ['1.5x (Fast)', 1.5]];
    for (var i = 0; i < speeds.length; i++) {
      var opt = document.createElement('option');
      opt.value = speeds[i][1];
      opt.textContent = speeds[i][0];
      if (speeds[i][1] === tts.rate) opt.selected = true;
      speedSel.appendChild(opt);
    }
    popup.appendChild(speedSel);

    var timerLabel = document.createElement('label');
    timerLabel.textContent = 'Auto-stop after';
    popup.appendChild(timerLabel);

    var timerOpts = document.createElement('div');
    timerOpts.className = 'audio-timer-opts';
    var times = [['No limit', 0], ['15 min', 15], ['30 min', 30], ['1 hour', 60], ['2 hours', 120]];
    var selectedTimer = tts.timerMinutes;
    for (var t = 0; t < times.length; t++) {
      var tb = document.createElement('button');
      tb.type = 'button';
      tb.className = 'audio-timer-opt' + (times[t][1] === selectedTimer ? ' selected' : '');
      tb.textContent = times[t][0];
      tb.addEventListener('click', (function (val, btn, container) {
        return function () {
          selectedTimer = val;
          var all = container.querySelectorAll('.audio-timer-opt');
          for (var x = 0; x < all.length; x++) all[x].classList.remove('selected');
          btn.classList.add('selected');
        };
      })(times[t][1], tb, timerOpts));
      timerOpts.appendChild(tb);
    }
    popup.appendChild(timerOpts);

    var startBtn = document.createElement('button');
    startBtn.type = 'button';
    startBtn.className = 'bm-pop-item';
    startBtn.innerHTML = '<span class="dd-icon">\u25B6</span> Start Reading';
    startBtn.addEventListener('click', function () {
      var spd = parseFloat(speedSel.value);
      tts.rate = spd;
      tts.speedIdx = tts.speeds.indexOf(spd);
      if (tts.speedIdx === -1) tts.speedIdx = 2;
      abSpeed.textContent = spd + 'x';
      tts.timerMinutes = selectedTimer;

      scrim.remove();
      popup.remove();

      var book = currentBook || 'Genesis';
      var ch = currentChapter || 1;
      if (!currentBook || !currentChapter) {
        showVersesView('Genesis', 1);
        book = 'Genesis'; ch = 1;
      }
      tts.stop();
      tts.startFrom(book, ch);
    });
    popup.appendChild(startBtn);

    if (tts.speaking) {
      var stopBtn = document.createElement('button');
      stopBtn.type = 'button';
      stopBtn.className = 'bm-pop-item danger';
      stopBtn.innerHTML = '<span class="dd-icon">\u23F9</span> Stop Reading';
      stopBtn.addEventListener('click', function () {
        tts.stop();
        scrim.remove();
        popup.remove();
      });
      popup.appendChild(stopBtn);
    }

    document.body.appendChild(popup);
  }

  // ===================== NAV HANDLERS =====================
  document.getElementById('nav-home').addEventListener('click', function () {
    if (bibleData) showBooksView();
  });
  navBookBtn.addEventListener('click', function () {
    if (bibleData && currentBook) showChaptersView(currentBook);
  });
  document.getElementById('btn-search').addEventListener('click', function () {
    if (bibleData) showSearchView();
  });
  document.getElementById('btn-audio').addEventListener('click', function () {
    if (bibleData) showAudioSetup();
  });
  document.getElementById('btn-bookmarks').addEventListener('click', function () {
    if (bibleData) showBookmarksView();
  });

  // ===================== LOAD DATA =====================
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'bible.json', true);
  xhr.responseType = 'json';

  xhr.onload = function () {
    loadingEl.style.display = 'none';
    if (xhr.status !== 200 || !xhr.response) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Failed to load bible.json (status ' + xhr.status + ').';
      return;
    }
    bibleData = xhr.response;
    history.replaceState({ view: 'books' }, '');
    navFromPop = true;
    showBooksView();
    navFromPop = false;
  };

  xhr.onerror = function () {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Network error loading bible.json.';
  };

  xhr.send();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
