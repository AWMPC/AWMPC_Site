<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bible - Books</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
    line-height: 1.6;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 32px 20px;
  }
  h1 { font-size: 28px; margin-bottom: 4px; color: #1a1a1a; }
  .subtitle { font-size: 15px; color: #666; margin-bottom: 24px; }

  /* Two-column testament layout */
  .testaments {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
  }
  @media (max-width: 640px) {
    .testaments { grid-template-columns: 1fr; }
  }
  .testament h2 {
    font-size: 17px;
    font-weight: 600;
    color: #555;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 10px;
    padding-bottom: 6px;
    border-bottom: 2px solid #ddd;
  }
  .testament ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }

  /* Book buttons */
  .book-btn {
    display: flex;
    align-items: center;
    width: 100%;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 15px;
    font-family: inherit;
    color: #222;
    cursor: pointer;
    text-align: left;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .book-btn:hover { border-color: #bbb; box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .book-btn.active {
    background: #1a1a2e;
    color: #fff;
    border-color: #1a1a2e;
  }
  .book-btn .book-number {
    display: inline-block;
    width: 26px;
    flex-shrink: 0;
    color: #999;
    font-size: 12px;
    text-align: right;
    margin-right: 8px;
  }
  .book-btn.active .book-number { color: #aaa; }
  .book-btn .chapter-count {
    margin-left: auto;
    font-size: 12px;
    color: #999;
    flex-shrink: 0;
  }
  .book-btn.active .chapter-count { color: #aaa; }

  /* Chapter panel */
  #chapter-panel {
    display: none;
    margin-top: 28px;
    background: #fff;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 20px 24px;
  }
  #chapter-panel.visible { display: block; }
  #chapter-panel h2 {
    font-size: 20px;
    margin-bottom: 14px;
    color: #1a1a1a;
  }
  .chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(52px, 1fr));
    gap: 8px;
  }
  .chapter-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f0f0f0;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 0;
    font-size: 15px;
    font-family: inherit;
    color: #333;
    cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .chapter-btn:hover { background: #e4e4e4; border-color: #ccc; }
  .chapter-btn.active {
    background: #1a1a2e;
    color: #fff;
    border-color: #1a1a2e;
  }

  /* Verse panel */
  #verse-panel {
    display: none;
    margin-top: 20px;
    background: #fafaf8;
    border: 1px solid #e0e0e0;
    border-radius: 12px;
    padding: 20px 24px;
    max-height: 70vh;
    overflow-y: auto;
  }
  #verse-panel.visible { display: block; }
  #verse-panel h3 {
    font-size: 18px;
    color: #1a1a1a;
    margin-bottom: 16px;
    position: sticky;
    top: -20px;
    background: #fafaf8;
    padding: 8px 0 10px;
    z-index: 1;
  }
  .verse {
    margin-bottom: 12px;
    font-size: 16px;
    line-height: 1.7;
  }
  .verse-num {
    font-size: 12px;
    font-weight: 700;
    color: #888;
    vertical-align: super;
    margin-right: 4px;
  }

  #error {
    display: none;
    background: #ffeaea;
    color: #a00;
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
  }
  #loading { color: #888; font-size: 15px; }
</style>
</head>
<body>
<div class="container">
  <h1>Bible</h1>
  <p class="subtitle">Books of the Bible</p>
  <div id="error"></div>
  <p id="loading">Loading&hellip;</p>

  <div class="testaments" id="testaments" style="display:none;">
    <div class="testament">
      <h2>Old Testament</h2>
      <ul id="ot-list"></ul>
    </div>
    <div class="testament">
      <h2>New Testament</h2>
      <ul id="nt-list"></ul>
    </div>
  </div>

  <div id="chapter-panel">
    <h2 id="chapter-title"></h2>
    <div class="chapter-grid" id="chapter-grid"></div>
    <div id="verse-panel">
      <h3 id="verse-title"></h3>
      <div id="verse-list"></div>
    </div>
  </div>
</div>
<script>
(function () {
  var OT_COUNT = 39;
  var loading = document.getElementById('loading');
  var errorEl = document.getElementById('error');
  var testaments = document.getElementById('testaments');
  var otList = document.getElementById('ot-list');
  var ntList = document.getElementById('nt-list');
  var chapterPanel = document.getElementById('chapter-panel');
  var chapterTitle = document.getElementById('chapter-title');
  var chapterGrid = document.getElementById('chapter-grid');
  var versePanel = document.getElementById('verse-panel');
  var verseTitle = document.getElementById('verse-title');
  var verseList = document.getElementById('verse-list');
  var activeBtn = null;
  var activeChBtn = null;
  var bibleData = null;

  function showVerses(bookName, chapterNum) {
    var chapters = bibleData[bookName];
    var verses = chapters[String(chapterNum)];
    var keys = Object.keys(verses);

    verseTitle.textContent = bookName + ' ' + chapterNum;
    verseList.textContent = '';

    for (var i = 0; i < keys.length; i++) {
      var p = document.createElement('p');
      p.className = 'verse';
      var sup = document.createElement('span');
      sup.className = 'verse-num';
      sup.textContent = keys[i];
      p.appendChild(sup);
      p.appendChild(document.createTextNode(verses[keys[i]]));
      verseList.appendChild(p);
    }

    versePanel.className = 'visible';
    versePanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showChapters(bookName, chapterCount) {
    chapterTitle.textContent = bookName + ' \u2014 ' + chapterCount + (chapterCount === 1 ? ' Chapter' : ' Chapters');
    chapterGrid.textContent = '';
    versePanel.className = '';
    activeChBtn = null;

    for (var c = 1; c <= chapterCount; c++) {
      var btn = document.createElement('div');
      btn.className = 'chapter-btn';
      btn.textContent = c;
      btn.setAttribute('data-ch', c);
      btn.addEventListener('click', (function (book, ch) {
        return function () {
          if (activeChBtn) activeChBtn.className = 'chapter-btn';
          this.className = 'chapter-btn active';
          activeChBtn = this;
          showVerses(book, ch);
        };
      })(bookName, c));
      chapterGrid.appendChild(btn);
    }
    chapterPanel.className = 'visible';
    chapterPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function createBookButton(bookName, index, chapterCount, list) {
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.type = 'button';

    var num = document.createElement('span');
    num.className = 'book-number';
    num.textContent = (index + 1) + '.';
    btn.appendChild(num);

    btn.appendChild(document.createTextNode(bookName));

    var chs = document.createElement('span');
    chs.className = 'chapter-count';
    chs.textContent = chapterCount + (chapterCount === 1 ? ' ch' : ' chs');
    btn.appendChild(chs);

    btn.addEventListener('click', function () {
      if (activeBtn) activeBtn.className = 'book-btn';
      btn.className = 'book-btn active';
      activeBtn = btn;
      showChapters(bookName, chapterCount);
    });

    li.appendChild(btn);
    list.appendChild(li);
  }

  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'bible.json', true);
  xhr.responseType = 'json';

  xhr.onload = function () {
    loading.style.display = 'none';
    if (xhr.status !== 200 || !xhr.response) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Failed to load bible.json (status ' + xhr.status + ').';
      return;
    }
    bibleData = xhr.response;
    var data = bibleData;
    var books = Object.keys(data);
    testaments.style.display = '';

    for (var i = 0; i < books.length; i++) {
      var chapterCount = Object.keys(data[books[i]]).length;
      var list = i < OT_COUNT ? otList : ntList;
      createBookButton(books[i], i, chapterCount, list);
    }
  };

  xhr.onerror = function () {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Network error loading bible.json.';
  };

  xhr.send();
})();
</script>
</body>
</html>
