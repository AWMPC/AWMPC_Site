<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1a1a2e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bible">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📖</text></svg>">
<title>Bible</title>
<style>
  :root {
    --bg: #f5f5f5; --bg2: #fff; --bg3: #fafaf8; --bg4: #f0f0f0;
    --fg: #222; --fg2: #555; --fg3: #888; --fg4: #999;
    --border: #e0e0e0; --border2: #ddd; --border3: #ccc;
    --accent: #1a1a2e; --accent-fg: #fff;
    --note-bg: #f0efe8; --note-border: #c5b358;
    --err-bg: #ffeaea; --err-fg: #a00;
    --toolbar-bg: #1a1a2e; --toolbar-fg: #e0e0e0;
  }
  html.dark {
    --bg: #121212; --bg2: #1e1e1e; --bg3: #1a1a1a; --bg4: #2a2a2a;
    --fg: #e0e0e0; --fg2: #aaa; --fg3: #777; --fg4: #666;
    --border: #333; --border2: #444; --border3: #555;
    --accent: #3a3a5e; --accent-fg: #fff;
    --note-bg: #2a2820; --note-border: #8a7a30;
    --err-bg: #3a1010; --err-fg: #f88;
    --toolbar-bg: #0a0a18; --toolbar-fg: #ccc;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg); color: var(--fg); line-height: 1.6;
  }

  /* Toolbar */
  .toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 14px; background: var(--toolbar-bg);
    position: sticky; top: 0; z-index: 100;
  }
  .toolbar-btn {
    background: none; border: 1px solid rgba(255,255,255,0.15);
    color: var(--toolbar-fg); font-size: 13px; font-family: inherit;
    padding: 5px 12px; border-radius: 6px; cursor: pointer;
    white-space: nowrap; transition: background 0.12s;
  }
  .toolbar-btn:hover { background: rgba(255,255,255,0.1); }
  .toolbar-title { color: #fff; font-size: 15px; font-weight: 600; margin-right: auto; }

  /* History dropdown */
  .history-wrap { position: relative; }
  .history-menu {
    display: none; position: absolute; top: 100%; right: 0; margin-top: 6px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.18); min-width: 200px; max-height: 320px;
    overflow-y: auto; z-index: 110;
  }
  .history-menu.open { display: block; }
  .history-menu .hm-empty { padding: 14px 16px; color: var(--fg3); font-size: 13px; }
  .history-item {
    display: block; width: 100%; background: none; border: none; border-bottom: 1px solid var(--border);
    padding: 10px 16px; text-align: left; font-size: 14px; font-family: inherit;
    color: var(--fg); cursor: pointer; transition: background 0.1s;
  }
  .history-item:last-child { border-bottom: none; }
  .history-item:hover { background: var(--bg4); }

  .container { max-width: 960px; margin: 0 auto; padding: 24px 20px; }
  h1 { font-size: 28px; margin-bottom: 4px; color: var(--fg); }
  .subtitle { font-size: 15px; color: var(--fg3); margin-bottom: 24px; }

  .testaments { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
  @media (max-width: 640px) { .testaments { gap: 16px; } }
  .testament h2 {
    font-size: 17px; font-weight: 600; color: var(--fg2);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--border2);
  }
  .testament ul { list-style: none; display: flex; flex-direction: column; gap: 6px; }

  .book-btn {
    display: flex; align-items: center; width: 100%;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 15px; font-family: inherit;
    color: var(--fg); cursor: pointer; text-align: left; overflow: hidden;
    transition: box-shadow 0.15s, border-color 0.15s, background 0.15s;
  }
  .book-btn:hover { border-color: var(--border3); box-shadow: 0 2px 8px rgba(0,0,0,0.07); }
  .book-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .book-btn .book-number {
    display: inline-block; width: 26px; flex-shrink: 0;
    color: var(--fg4); font-size: 12px; text-align: right; margin-right: 8px;
  }
  .book-btn.active .book-number { color: #aaa; }
  .book-name { flex: 1; min-width: 0; overflow: hidden; position: relative; }
  .book-name-inner { display: inline-block; white-space: nowrap; }
  .book-btn:hover .book-name-inner.overflows,
  .book-btn.active .book-name-inner.overflows {
    animation: marquee var(--marquee-dur, 3s) linear infinite alternate;
  }
  @keyframes marquee {
    0%, 15%   { transform: translateX(0); }
    85%, 100% { transform: translateX(var(--marquee-dist)); }
  }
  .book-btn .chapter-count {
    margin-left: 6px; font-size: 12px; color: var(--fg4); flex-shrink: 0; white-space: nowrap;
  }
  .book-btn.active .chapter-count { color: #aaa; }

  #chapter-panel {
    display: none; margin-top: 28px; background: var(--bg2);
    border: 1px solid var(--border); border-radius: 12px; padding: 20px 24px;
  }
  #chapter-panel.visible { display: block; }
  #chapter-panel h2 { font-size: 20px; margin-bottom: 14px; color: var(--fg); }
  .chapter-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 8px;
  }
  .chapter-btn {
    display: flex; align-items: center; justify-content: center;
    background: var(--bg4); border: 1px solid var(--border2); border-radius: 8px;
    padding: 10px 0; font-size: 15px; font-family: inherit; color: var(--fg);
    cursor: pointer; transition: background 0.12s, border-color 0.12s;
  }
  .chapter-btn:hover { background: var(--border2); border-color: var(--border3); }
  .chapter-btn.active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }

  #verse-panel {
    display: none; margin-top: 20px; background: var(--bg3);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 20px 24px; max-height: 70vh; overflow-y: auto;
  }
  #verse-panel.visible { display: block; }
  #verse-panel h3 {
    font-size: 18px; color: var(--fg); margin-bottom: 16px;
    position: sticky; top: -20px; background: var(--bg3); padding: 8px 0 10px; z-index: 1;
  }
  .verse { margin-bottom: 12px; font-size: 16px; line-height: 1.7; }
  .verse-num { font-size: 12px; font-weight: 700; color: var(--fg3); vertical-align: super; margin-right: 4px; }
  .footnote-toggle {
    display: inline-block; background: none; border: 1px solid var(--border3);
    border-radius: 4px; color: var(--fg3); font-size: 11px; font-family: inherit;
    padding: 1px 7px; margin-left: 4px; cursor: pointer; vertical-align: middle;
    transition: background 0.12s, color 0.12s;
  }
  .footnote-toggle:hover { background: var(--bg4); color: var(--fg2); }
  .footnote-toggle.open { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  .footnote-body {
    display: none; margin: 6px 0 4px 20px; padding: 8px 12px;
    background: var(--note-bg); border-left: 3px solid var(--note-border);
    border-radius: 0 6px 6px 0; font-size: 14px; color: var(--fg2); line-height: 1.6;
  }
  .footnote-body.visible { display: block; }

  #error {
    display: none; background: var(--err-bg); color: var(--err-fg);
    padding: 12px 16px; border-radius: 8px; margin-bottom: 16px;
  }
  #loading { color: var(--fg3); font-size: 15px; }

  #install-btn { display: none; }
  #install-btn.available { display: inline-block; }
</style>
</head>
<body>

<div class="toolbar">
  <span class="toolbar-title">📖 Bible</span>
  <div class="history-wrap">
    <button class="toolbar-btn" id="history-btn" type="button">📑 History</button>
    <div class="history-menu" id="history-menu"></div>
  </div>
  <button class="toolbar-btn" id="dark-btn" type="button">🌙 Dark</button>
  <button class="toolbar-btn" id="install-btn" type="button">📲 Install</button>
</div>

<div class="container">
  <h1>Bible</h1>
  <p class="subtitle">Books of the Bible</p>
  <div id="error"></div>
  <p id="loading">Loading&hellip;</p>

  <div class="testaments" id="testaments" style="display:none;">
    <div class="testament">
      <h2>Old Testament</h2>
      <ul id="ot-list"></ul>
    </div>
    <div class="testament">
      <h2>New Testament</h2>
      <ul id="nt-list"></ul>
    </div>
  </div>

  <div id="chapter-panel">
    <h2 id="chapter-title"></h2>
    <div class="chapter-grid" id="chapter-grid"></div>
    <div id="verse-panel">
      <h3 id="verse-title"></h3>
      <div id="verse-list"></div>
    </div>
  </div>
</div>

<script>
(function () {
  var OT_COUNT = 39;
  var HISTORY_KEY = 'bible_history';
  var DARK_KEY = 'bible_dark';
  var MAX_HISTORY = 20;

  var loading = document.getElementById('loading');
  var errorEl = document.getElementById('error');
  var testaments = document.getElementById('testaments');
  var otList = document.getElementById('ot-list');
  var ntList = document.getElementById('nt-list');
  var chapterPanel = document.getElementById('chapter-panel');
  var chapterTitle = document.getElementById('chapter-title');
  var chapterGrid = document.getElementById('chapter-grid');
  var versePanel = document.getElementById('verse-panel');
  var verseTitle = document.getElementById('verse-title');
  var verseList = document.getElementById('verse-list');
  var darkBtn = document.getElementById('dark-btn');
  var historyBtn = document.getElementById('history-btn');
  var historyMenu = document.getElementById('history-menu');
  var installBtn = document.getElementById('install-btn');

  var activeBtn = null;
  var activeChBtn = null;
  var bibleData = null;
  var deferredPrompt = null;

  // --- Dark mode ---
  function applyDark(on) {
    document.documentElement.classList.toggle('dark', on);
    darkBtn.textContent = on ? '☀️ Light' : '🌙 Dark';
    try { localStorage.setItem(DARK_KEY, on ? '1' : '0'); } catch(e) {}
  }
  var initDark = false;
  try { initDark = localStorage.getItem(DARK_KEY) === '1'; } catch(e) {}
  applyDark(initDark);
  darkBtn.addEventListener('click', function () {
    applyDark(!document.documentElement.classList.contains('dark'));
  });

  // --- History ---
  function getHistory() {
    try { return JSON.parse(localStorage.getItem(HISTORY_KEY)) || []; } catch(e) { return []; }
  }
  function saveHistory(list) {
    try { localStorage.setItem(HISTORY_KEY, JSON.stringify(list)); } catch(e) {}
  }
  function pushHistory(book, ch) {
    var list = getHistory();
    var key = book + '|' + ch;
    list = list.filter(function (x) { return x !== key; });
    list.unshift(key);
    if (list.length > MAX_HISTORY) list = list.slice(0, MAX_HISTORY);
    saveHistory(list);
  }
  function renderHistoryMenu() {
    historyMenu.textContent = '';
    var list = getHistory();
    if (list.length === 0) {
      var empty = document.createElement('div');
      empty.className = 'hm-empty';
      empty.textContent = 'No history yet';
      historyMenu.appendChild(empty);
      return;
    }
    for (var i = 0; i < list.length; i++) {
      var parts = list[i].split('|');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'history-item';
      btn.textContent = parts[0] + ' ' + parts[1];
      btn.addEventListener('click', (function (book, ch) {
        return function () {
          historyMenu.classList.remove('open');
          if (bibleData && bibleData[book]) {
            navigateTo(book, parseInt(ch, 10));
          }
        };
      })(parts[0], parts[1]));
      historyMenu.appendChild(btn);
    }
  }
  historyBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    renderHistoryMenu();
    historyMenu.classList.toggle('open');
  });
  document.addEventListener('click', function () { historyMenu.classList.remove('open'); });
  historyMenu.addEventListener('click', function (e) { e.stopPropagation(); });

  // --- Install PWA ---
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.classList.add('available');
  });
  installBtn.addEventListener('click', function () {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function () { deferredPrompt = null; installBtn.classList.remove('available'); });
  });

  // --- Footnotes ---
  var footnoteRe = /\{\[(\d+)\]\s*(.*?)\}/g;
  function parseVerse(raw) {
    var segments = [];
    var last = 0;
    var m;
    footnoteRe.lastIndex = 0;
    while ((m = footnoteRe.exec(raw)) !== null) {
      if (m.index > last) {
        segments.push({ type: 'text', value: raw.slice(last, m.index).replace(/  +/g, ' ') });
      }
      segments.push({ type: 'note', num: m[1], text: m[2] });
      last = footnoteRe.lastIndex;
    }
    if (last < raw.length) {
      segments.push({ type: 'text', value: raw.slice(last).replace(/  +/g, ' ') });
    }
    return segments;
  }

  // --- Navigation ---
  function navigateTo(bookName, chapterNum) {
    if (!bibleData || !bibleData[bookName]) return;
    var books = Object.keys(bibleData);
    var idx = books.indexOf(bookName);
    if (idx === -1) return;
    var chapterCount = Object.keys(bibleData[bookName]).length;

    if (activeBtn) activeBtn.className = 'book-btn';
    var allBtns = document.querySelectorAll('.book-btn');
    if (allBtns[idx]) {
      allBtns[idx].className = 'book-btn active';
      activeBtn = allBtns[idx];
    }
    showChapters(bookName, chapterCount);
    selectChapter(bookName, chapterNum);
  }

  function selectChapter(bookName, chapterNum) {
    var btns = chapterGrid.querySelectorAll('.chapter-btn');
    for (var j = 0; j < btns.length; j++) {
      if (parseInt(btns[j].getAttribute('data-ch'), 10) === chapterNum) {
        if (activeChBtn) activeChBtn.className = 'chapter-btn';
        btns[j].className = 'chapter-btn active';
        activeChBtn = btns[j];
        break;
      }
    }
    showVerses(bookName, chapterNum);
    pushHistory(bookName, chapterNum);
  }

  function showVerses(bookName, chapterNum) {
    var chapters = bibleData[bookName];
    var verses = chapters[String(chapterNum)];
    var keys = Object.keys(verses);

    verseTitle.textContent = bookName + ' ' + chapterNum;
    verseList.textContent = '';

    for (var i = 0; i < keys.length; i++) {
      var segments = parseVerse(verses[keys[i]]);
      var div = document.createElement('div');
      div.className = 'verse';

      var p = document.createElement('p');
      var sup = document.createElement('span');
      sup.className = 'verse-num';
      sup.textContent = keys[i];
      p.appendChild(sup);

      var noteBodies = [];
      for (var s = 0; s < segments.length; s++) {
        var seg = segments[s];
        if (seg.type === 'text') {
          p.appendChild(document.createTextNode(seg.value));
        } else {
          var noteBtn = document.createElement('button');
          noteBtn.type = 'button';
          noteBtn.className = 'footnote-toggle';
          noteBtn.textContent = '\u2020' + seg.num;

          var noteBody = document.createElement('div');
          noteBody.className = 'footnote-body';
          noteBody.textContent = '[' + seg.num + '] ' + seg.text;

          noteBtn.addEventListener('click', (function (btn, body) {
            return function () {
              var open = body.className.indexOf('visible') !== -1;
              body.className = open ? 'footnote-body' : 'footnote-body visible';
              btn.className = open ? 'footnote-toggle' : 'footnote-toggle open';
            };
          })(noteBtn, noteBody));

          p.appendChild(noteBtn);
          noteBodies.push(noteBody);
        }
      }

      div.appendChild(p);
      for (var nb = 0; nb < noteBodies.length; nb++) {
        div.appendChild(noteBodies[nb]);
      }
      verseList.appendChild(div);
    }

    versePanel.className = 'visible';
    versePanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function showChapters(bookName, chapterCount) {
    chapterTitle.textContent = bookName + ' \u2014 ' + chapterCount + (chapterCount === 1 ? ' Chapter' : ' Chapters');
    chapterGrid.textContent = '';
    versePanel.className = '';
    activeChBtn = null;

    for (var c = 1; c <= chapterCount; c++) {
      var btn = document.createElement('div');
      btn.className = 'chapter-btn';
      btn.textContent = c;
      btn.setAttribute('data-ch', c);
      btn.addEventListener('click', (function (book, ch) {
        return function () {
          if (activeChBtn) activeChBtn.className = 'chapter-btn';
          this.className = 'chapter-btn active';
          activeChBtn = this;
          showVerses(book, ch);
          pushHistory(book, ch);
        };
      })(bookName, c));
      chapterGrid.appendChild(btn);
    }
    chapterPanel.className = 'visible';
    chapterPanel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function createBookButton(bookName, index, chapterCount, list) {
    var li = document.createElement('li');
    var btn = document.createElement('button');
    btn.className = 'book-btn';
    btn.type = 'button';

    var num = document.createElement('span');
    num.className = 'book-number';
    num.textContent = (index + 1) + '.';
    btn.appendChild(num);

    var nameWrap = document.createElement('span');
    nameWrap.className = 'book-name';
    var nameInner = document.createElement('span');
    nameInner.className = 'book-name-inner';
    nameInner.textContent = bookName;
    nameWrap.appendChild(nameInner);
    btn.appendChild(nameWrap);

    var chs = document.createElement('span');
    chs.className = 'chapter-count';
    chs.textContent = chapterCount + (chapterCount === 1 ? ' ch' : ' chs');
    btn.appendChild(chs);

    btn.addEventListener('click', function () {
      if (activeBtn) activeBtn.className = 'book-btn';
      btn.className = 'book-btn active';
      activeBtn = btn;
      showChapters(bookName, chapterCount);
    });

    li.appendChild(btn);
    list.appendChild(li);
  }

  function checkMarquees() {
    var inners = document.querySelectorAll('.book-name-inner');
    for (var i = 0; i < inners.length; i++) {
      var inner = inners[i];
      var wrap = inner.parentNode;
      if (inner.scrollWidth > wrap.clientWidth) {
        inner.classList.add('overflows');
        var dist = -(inner.scrollWidth - wrap.clientWidth);
        inner.style.setProperty('--marquee-dist', dist + 'px');
        var dur = Math.max(2, Math.abs(dist) / 30);
        inner.style.setProperty('--marquee-dur', dur + 's');
      }
    }
  }

  // --- Load data ---
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'bible.json', true);
  xhr.responseType = 'json';

  xhr.onload = function () {
    loading.style.display = 'none';
    if (xhr.status !== 200 || !xhr.response) {
      errorEl.style.display = 'block';
      errorEl.textContent = 'Failed to load bible.json (status ' + xhr.status + ').';
      return;
    }
    bibleData = xhr.response;
    var data = bibleData;
    var books = Object.keys(data);
    testaments.style.display = '';

    for (var i = 0; i < books.length; i++) {
      var chapterCount = Object.keys(data[books[i]]).length;
      var list = i < OT_COUNT ? otList : ntList;
      createBookButton(books[i], i, chapterCount, list);
    }
    checkMarquees();
    window.addEventListener('resize', checkMarquees);
  };

  xhr.onerror = function () {
    loading.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Network error loading bible.json.';
  };

  xhr.send();

  // --- Register Service Worker ---
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  }
})();
</script>
</body>
</html>
