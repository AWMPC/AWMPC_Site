<body bgcolor=#ccbb99 >

    <div>

        <h3><span style='font-size:14.0pt;color:#5A4409'>World
                Mission Prayer Center</span></h3>

        <p><span style='font-size:14.0pt;
color:#5A4409'>Thank you for submitting your prayer request.</span></p>



        <p><span style='font-size:14.0pt;
color:#5A4409'>We will pray for you according to the will of the Lord.</span></p>



        <p><span style='font-size:14.0pt;
color:#5A4409'>God promised that He would draw near to you as you draw near to
                Him. </span></p>



        <p><span style='font-size:14.0pt;
color:#5A4409'>And ...according to your faith will it be done to you. Matthew
                9:29</span></p>

    </div>
