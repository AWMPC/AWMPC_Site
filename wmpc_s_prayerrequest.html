<html xmlns="https://www.w3.org/TR/REC-html40">

<head>
	<meta http-equiv="Content-Type" content="text/html; charset=us-ascii">

<title>AWMPC Prayer Request</title>
<style type="text/css">
		<!--
		/* Style Definitions */

		h1 {
			margin: 0in;
			margin-bottom: .0001pt;
			page-break-after: avoid;
			font-size: 14.0pt;
			font-family: Arial;
			font-weight: normal;
		}

		h3 {
			margin: 0in;
			margin-bottom: .0001pt;
			page-break-after: avoid;
			font-size: 24.0pt;
			font-family: Arial;
		}

		-->
</style>

</head>

<body bgcolor="#ccbb99" >
	<div>
		<p><b><span style="font-size:24.0pt;font-family:SimSun;color:red;">我們為您代禱</span></b><b></b></p>

		<p><span style="font-size:14.0pt;
font-family:Arial">
				<!--[if !supportEmptyParas]-->&nbsp;
				<!--[endif]-->

			</span></p>

		<form action="https://www.hostmonster.com/monstermail" enctype="multipart/form-data" method="POST">
			<p><span style="font-size:14.0pt;
font-family:Arial;display:none;"><input name="sendtoemail" type="hidden" value="awmpc@awmpc.org" />
					<input name="subject" type="hidden" value="Prayer request received from awmpc.org" />
					<!--<INPUT TYPE="hidden" NAME="text" VALUE="1">--> <input name="redirect" type="hidden"
						value="https://www.awmpc.org/wmpc_pager.php?page=mi_reply" />
				</span> </p>

			<table border="0" cellpadding="0" >
				<tbody>
					<tr>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial">Name:</span></p>
						</td>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial"><input name="name" type="text" />

								</span></p>
						</td>
					</tr>
					<tr>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial">Email:</span></p>
						</td>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial"><input name="mailfrom" type="text" />

								</span></p>
						</td>
					</tr>
					<tr>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial">Phone:</span></p>
						</td>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial"><input name="phone" type="text" />

								</span></p>
						</td>
					</tr>
					<tr>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial">Address:</span></p>
						</td>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial"><input name="streetAddress" type="text" />

								</span></p>
						</td>
					</tr>
					<tr>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial">City:</span></p>
						</td>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial"><input name="city" type="text" />

								</span></p>
						</td>
					</tr>
					<tr>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial">State:</span></p>
						</td>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial"><input name="state" size="2" type="text" />Zip:<input name="zip" size="8" type="text" />

								</span></p>
						</td>
					</tr>
					<tr>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial">Message:</span></p>
						</td>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial"><textarea cols="34" name="message" rows="10"></textarea>

								</span></p>
						</td>
					</tr>
					<tr>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p>
								<!--[if !supportEmptyParas]-->&nbsp;
								<!--[endif]-->
							</p>
						</td>
						<td style="padding:.75pt .75pt .75pt .75pt">
							<p><span style="font-size:14.0pt;
  font-family:Arial"><input type="submit" value="Send Request" />

								</span></p>
						</td>
					</tr>
				</tbody>
			</table>
		</form>

		<p><span style="font-size:14.0pt;
font-family:Arial">
				<!--[if !supportEmptyParas]-->&nbsp;
				<!--[endif]-->

			</span></p>
	</div>
</body>

</html>
